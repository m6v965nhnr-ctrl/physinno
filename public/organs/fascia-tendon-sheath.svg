<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>筋を包む3層の結合組織（筋外膜・筋周膜・筋内膜）</title><desc>筋の断面の模式図。筋全体を筋外膜が包み、内部の筋線維は筋周膜でいくつかの筋束にまとめられ、1本ずつの筋線維を筋内膜が包む。右に筋束を拡大して示す。3層のコラーゲンは腱のコラーゲンとつながり、筋の張力は腱を通して骨膜と骨へ伝わる。</desc>
