<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" width="680" height="530" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>胎盤と羊水の模式図</title><desc>妊娠中の子宮を前から見た断面の模式図と、胎盤の拡大。子宮の壁（筋層）の内側に絨毛膜と羊膜があり、羊膜に囲まれた羊水の中に胎児がいる。胎児は臍帯で胎盤とつながる。胎盤は子宮の壁に接し、胎児側は絨毛膜絨毛、母体側は脱落膜からなる。子宮頸管には粘液栓がある。拡大図では、絨毛の中の胎児の血管（臍動脈は酸素の少ない血液を胎盤へ、臍静脈は酸素の多い血液を胎児へ）と絨毛のまわりの母体血が、血液が混ざらないまま物質を交換する。</desc><defs><marker id="ah185FA5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ahA32D2D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker></defs><rect width="680" height="530" fill="#fff"/>
