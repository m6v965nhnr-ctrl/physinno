<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 800" width="680" height="800" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>延髄の断面の模式図（下部と上部）</title><desc>延髄の断面の模式図。上は延髄下部（中心管がある高さ）。背側に薄束核（内側）と楔状束核（外側）、その外側に三叉神経脊髄路核。後索核から出た内弓状線維が腹側へ回って正中で交叉（毛帯交叉）し、内側毛帯となって上行する。腹側に左右の錐体がある。下は延髄上部（オリーブの高さ、第四脳室が開く）。背側の第四脳室の底の正中寄りに舌下神経核、その外側に迷走神経背側核。外側の背側に三叉神経脊髄路核、その外側縁に後脊髄小脳路と、その腹側に外側脊髄視床路。三叉神経脊髄路核とオリーブ核の中間の網様体に疑核。腹外側にオリーブ核、正中寄りに内側毛帯、腹側に錐体。舌下神経の根は内側毛帯の外側を下り、錐体とオリーブの間から出る。</desc>
<rect width="680" height="800" fill="#fff"/>
<text x="24" y="28" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="500" fill="#2C2C2A">延髄下部（毛帯交叉の高さ）</text>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">背側</text>
