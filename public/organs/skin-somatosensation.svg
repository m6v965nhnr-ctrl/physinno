ze="13" fill="#2C2C2A" transform="rotate(-90 112 350.0)">皮下組織</text><text x="20" y="440" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">皮膚を垂直に切った断面の模式図。受容器の位置は、出典の記述（存在する層）をもとに、</text><text x="20" y="462" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">表皮と真皮の境（メルケル盤）、真皮の浅いところ（マイスナー小体）、</text><text x="20" y="484" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">真皮（ルフィニ終末・自由神経終末）、深い真皮〜皮下組織（パチニ小体）の順で描いた。</text><text x="20" y="514" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">各部の大きさ・数・形は実物と異なります。受容器は一部だけを描いています。</text>
