<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>皮膚の断面と受容器の位置</title><desc>皮膚を垂直に切った断面の模式図。外側から表皮（角層・基底層）、真皮、皮下組織の3層。表皮と真皮の境にメルケル盤、真皮の浅いところにマイスナー小体、真皮にルフィニ終末と自由神経終末、深い真皮から皮下組織にパチニ小体がある。毛包のまわりに毛包受容器、真皮には汗腺・皮脂腺・血管がある。</desc>
