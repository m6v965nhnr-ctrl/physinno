<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>消化管全体の模式図（前から見た図）</title><desc>食道が胃につながり、胃の先に十二指腸、空腸、回腸が続く。回腸は右下腹部で盲腸につながり、大腸は上行結腸、横行結腸、下行結腸、S状結腸、直腸、肛門管の順に肛門へ続く。肝臓は右上腹部、胃は左上腹部にあり、膵臓は胃の後ろにある。</desc><rect width="680" height="560" fill="#fff"/>
