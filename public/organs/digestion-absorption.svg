<text x="20" y="545" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">膵臓は胃の後ろにあります。位置関係を示す模式図です。小腸は区分を示すために単純な蛇行で描いています。</text>
