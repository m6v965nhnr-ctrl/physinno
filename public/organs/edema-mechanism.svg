<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" width="680" height="570" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>浮腫が起こる4つの機序</title><desc>毛細血管と間質、毛細リンパ管の模式図。毛細血管の動脈側の端で静水圧が上がると濾過が増える（1）。血漿膠質浸透圧が下がると、静脈側の端での再吸収が減る（2）。毛細血管壁の透過性が上がると血管外へ漏れる液が増える（3）。リンパ管が閉塞すると、間質から液やタンパク質を回収できない（4）。下に、4つの機序ごとの代表的な原因を示す。</desc>
<defs><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3B6D11"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker></defs>
<rect width="680" height="570" fill="#fff"/>
<text x="340" y="22" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A" dominant-baseline="central">浮腫が起こる4つの機序（毛細血管での液の出入りが崩れる）</text>
<text x="30" y="58" font-size="13" fill="#2C2C2A" dominant-baseline="central">血管の外側は組織（間質）。ここに液がたまると浮腫になる。</text>
<rect x="60" y="170" width="400" height="56" rx="28" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
<text x="84" y="198" font-size="13" fill="#2C2C2A" dominant-baseline="central">細動脈側</text>
<text x="436" y="198" text-anchor="end" font-size="13" fill="#2C2C2A" dominant-baseline="central">細静脈側</text>
<path d="M20 198 L58 198" stroke="#A32D2D" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#ar)"/>
<path d="M462 198 L500 198" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#ab)"/>
<path d="M100 164 L100 112" stroke="#993C1D" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#ao)"/>
<path d="M140 164 L140 112" stroke="#993C1D" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#ao)"/>
<path d="M180 164 L180 112" stroke="#993C1D" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#ao)"/>
<rect x="255" y="166" width="14" height="8" fill="#fff"/><rect x="295" y="166" width="14" height="8" fill="#fff"/>
<path d="M262 164 L262 124" stroke="#534AB7" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#ap)"/>
<path d="M302 164 L302 124" stroke="#534AB7" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#ap)"/>
<path d="M370 118 L370 160" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" fill="none" marker-end="url(#ag)"/>
<path d="M410 118 L410 160" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" fill="none" marker-end="url(#ag)"/>
<path d="M640 80 L526 80 C508 80 508 110 526 110 L640 110" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.5"/>
<text x="590" y="64" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">毛細リンパ管</text>
<path d="M470 140 L514 112" stroke="#3B6D11" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#al)"/>
<path d="M572 70 L596 120 M596 70 L572 120" stroke="#E24B4A" stroke-width="3" stroke-linecap="round"/>
<circle cx="140" cy="92" r="12" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="140" y="92.5" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">①</text>
<circle cx="282" cy="100" r="12" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/><text x="282" y="100.5" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">③</text>
<circle cx="390" cy="98" r="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="390" y="98.5" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">②</text>
<circle cx="610" cy="140" r="12" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/><text x="610" y="140.5" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">④</text>
<text x="140" y="250" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">濾過が増える</text>
<text x="282" y="250" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">漏れが増える</text>
<text x="390" y="250" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">再吸収が減る</text>
<text x="610" y="168" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">回収できない</text>
<rect x="20" y="278" width="315" height="106" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/>
<text x="32" y="298" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">① 毛細血管静水圧の上昇</text>
<text x="32" y="324" font-size="13" fill="#2C2C2A" dominant-baseline="central">右心不全、静脈の閉塞（DVTなど）</text>
<text x="32" y="345" font-size="13" fill="#2C2C2A" dominant-baseline="central">体液過剰</text>
<text x="32" y="366" font-size="13" fill="#2C2C2A" dominant-baseline="central">長期の不動（骨格筋ポンプの低下）</text>
<rect x="345" y="278" width="315" height="106" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/>
<text x="357" y="298" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">② 血漿膠質浸透圧の低下</text>
<text x="357" y="324" font-size="13" fill="#2C2C2A" dominant-baseline="central">ネフローゼ症候群</text>
<text x="357" y="345" font-size="13" fill="#2C2C2A" dominant-baseline="central">肝疾患・低栄養（アルブミン合成の低下）</text>
<text x="357" y="366" font-size="13" fill="#2C2C2A" dominant-baseline="central">タンパク漏出性胃腸症</text>
<rect x="20" y="396" width="315" height="106" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/>
<text x="32" y="416" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">③ 毛細血管の透過性亢進</text>
<text x="32" y="442" font-size="13" fill="#2C2C2A" dominant-baseline="central">感染・炎症、熱傷などの損傷</text>
<text x="32" y="463" font-size="13" fill="#2C2C2A" dominant-baseline="central">血管性浮腫（ヒスタミンなどが関与）</text>
<rect x="345" y="396" width="315" height="106" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/>
<text x="357" y="416" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">④ リンパ系の閉塞</text>
<text x="357" y="442" font-size="13" fill="#2C2C2A" dominant-baseline="central">がん手術のリンパ節郭清後・放射線療法</text>
<text x="357" y="463" font-size="13" fill="#2C2C2A" dominant-baseline="central">リンパ系フィラリア症、先天性（まれ）</text>
<text x="340" y="524" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">指で押すとへこんで跡が残る浮腫を圧痕性、残らない浮腫を非圧痕性という。</text>
<text x="340" y="546" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">右心不全・DVTの浮腫は圧痕性、甲状腺機能低下症の浮腫は非圧痕性。</text>
</svg>