<rect x="180" y="654" width="44" height="52" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.4"/>
<rect x="168" y="712" width="68" height="34" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="202" y="729" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">手</text>
<line x1="158" y1="651" x2="202" y2="651" stroke="#A32D2D" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M 232 680 L 276 680" stroke="#993C1D" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>
<text x="490" y="506" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">スミス骨折</text>
<text x="420" y="534" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">掌側</text>
<text x="560" y="534" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">背側</text>
<rect x="468" y="548" width="44" height="100" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.4"/>
<rect x="446" y="654" width="44" height="52" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.4"/>
<rect x="434" y="712" width="68" height="34" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="468" y="729" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">手</text>
<line x1="468" y1="651" x2="512" y2="651" stroke="#A32D2D" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M 438 680 L 394 680" stroke="#993C1D" stroke-width="2.4" fill="none" marker-end="url(#ah)"/>
<text x="340" y="764" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">赤い点線が骨折線。骨片のずれの方向だけを示した図で、骨の形は省いている。</text></svg>