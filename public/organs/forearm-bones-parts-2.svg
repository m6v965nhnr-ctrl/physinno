<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780" width="680" height="780" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>前腕の回外・回内と、橈骨遠位端骨折（模式図）</title><desc>上段は右前腕を前から見た棒の模式図。回外位では橈骨と尺骨が並んで平行。回内位では、橈骨頭は同じ場所で回り、橈骨の下端が尺骨の下端のまわりを回って、2本の骨が交差する。赤い点線は、橈骨頭の中心から尺骨の下端を結ぶ回転の軸。下段は手首を横から見た模式図。コーレス骨折では橈骨の遠位骨片が背側へずれ、スミス骨折では掌側へずれる。</desc><rect width="680" height="780" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker></defs><text x="340" y="28" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">前腕の回外と回内（右前腕を前から見た棒の模式図）</text>
<line x1="210" y1="90" x2="210" y2="318" stroke="#534AB7" stroke-width="21" stroke-linecap="round"/>
<line x1="210" y1="90" x2="210" y2="318" stroke="#CECBF6" stroke-width="18" stroke-linecap="round"/>
<line x1="150" y1="120" x2="150" y2="332" stroke="#0F6E56" stroke-width="17" stroke-linecap="round"/>
<line x1="150" y1="120" x2="150" y2="332" stroke="#9FE1CB" stroke-width="14" stroke-linecap="round"/>
<circle cx="150" cy="112" r="14" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/>
<line x1="150" y1="112" x2="210" y2="318" stroke="#A32D2D" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="110" y="342" width="140" height="26" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="180" y="355" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">手</text>
<text x="210" y="62" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">回外位（手のひらが前）</text>
<text x="126" y="112" font-size="13" text-anchor="end" dominant-baseline="central" fill="#2C2C2A">橈骨頭</text>
<text x="230" y="90" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2C2C2A">尺骨</text>
<text x="132" y="300" font-size="13" text-anchor="end" dominant-baseline="central" fill="#2C2C2A">橈骨</text>
<line x1="520" y1="90" x2="520" y2="318" stroke="#534AB7" stroke-width="21" stroke-linecap="round"/>
<line x1="520" y1="90" x2="520" y2="318" stroke="#CECBF6" stroke-width="18" stroke-linecap="round"/>
<line x1="460" y1="120" x2="580" y2="332" stroke="#0F6E56" stroke-width="17" stroke-linecap="round"/>
<line x1="460" y1="120" x2="580" y2="332" stroke="#9FE1CB" stroke-width="14" stroke-linecap="round"/>
<circle cx="460" cy="112" r="14" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/>
<line x1="460" y1="112" x2="520" y2="318" stroke="#A32D2D" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="480" y="342" width="140" height="26" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="550" y="355" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">手</text>
<text x="520" y="62" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">回内位（手のひらが後ろ）</text>
<text x="436" y="112" font-size="13" text-anchor="end" dominant-baseline="central" fill="#2C2C2A">橈骨頭</text>
<text x="540" y="90" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2C2C2A">尺骨</text>
<text x="600" y="300" font-size="13" text-anchor="start" dominant-baseline="central" fill="#2C2C2A">橈骨</text>
<text x="340" y="400" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">赤い点線は回転の軸（橈骨頭の中心から尺骨の下端へ）。橈骨頭は輪状靱帯の中で回り、</text>
<text x="340" y="418" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">橈骨の下端が尺骨の下端のまわりを弧を描いて動くため、回内位では2本の骨が交差する。</text>
<text x="340" y="470" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">橈骨遠位端骨折（手首を横から見た模式図）</text>
<text x="180" y="506" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">コーレス骨折</text>
<text x="110" y="534" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">掌側</text>
<text x="250" y="534" font-size="12.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">背側</text>
