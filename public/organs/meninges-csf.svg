<title>脳脊髄液の循環（脳を横から見た模式図）</title>
<desc>脳を左横から見た模式図。側脳室の脈絡叢でつくられた髄液が、室間孔、第三脳室、中脳水道、第四脳室の順に流れ、正中口・外側口からくも膜下腔に出て、くも膜顆粒から上矢状静脈洞に吸収される。第四脳室の下は脊髄の中心管（盲管）につながる。</desc>
