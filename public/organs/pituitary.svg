<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>下垂体と視床下部（断面の模式図）</title><desc>視床下部の下に漏斗でつながる下垂体を横から見た模式図。下垂体は蝶形骨のトルコ鞍におさまり、前葉（腺性）と後葉（神経性）からなる。視床下部の放出・抑制ホルモンは下垂体門脈系（第一次毛細血管叢から第二次毛細血管叢）で前葉に届く。室傍核・視索上核の神経細胞の軸索は後葉に達し、バソプレシンとオキシトシンを血中に放出する。前葉のホルモンはGH、PRL、TSH、ACTH、FSH、LH。</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#854F0B"/></marker></defs><rect width="680" height="620" fill="#fff"/><path d="M190 238 L190 330 Q190 352 214 352 L406 352 Q430 352 430 330 L430 238" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><path d="M215 34 Q315 14 415 34 Q440 70 415 108 Q315 124 215 108 Q190 70 215 34 Z" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="315" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">視床下部</text><rect x="300" y="112" width="28" height="126" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><path d="M214 244 Q214 238 232 238 L330 238 L330 330 Q330 346 300 346 L242 346 Q214 346 214 322 Z" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><path d="M332 238 L398 238 Q410 238 410 252 L410 318 Q410 340 382 340 L332 340 Z" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/><text x="272" y="332" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">前葉</text><text x="371" y="326" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">後葉</text><circle cx="245" cy="88" r="9" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/><circle cx="392" cy="88" r="7" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><path d="M254 90 C282 96 300 108 312 132 L312 222 C312 244 366 244 368 270 L368 292" fill="none" stroke="#534AB7" stroke-width="2.6" stroke-linecap="round"/><circle cx="362" cy="296" r="4.5" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><circle cx="374" cy="300" r="4.5" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><circle cx="368" cy="308" r="4.5" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><path d="M385 94 C380 108 352 112 322 122" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round"/><path d="M303 118 l5 6 l-5 6 l5 6 l-5 6" fill="none" stroke="#A32D2D" stroke-width="1.8"/><path d="M306 148 L306 236" fill="none" stroke="#A32D2D" stroke-width="2.2"/><path d="M306 236 L292 262 L276 262 M292 262 L292 282 L262 282 M292 262 L304 290 L286 308" fill="none" stroke="#A32D2D" stroke-width="1.8" stroke-linecap="round"/><path d="M262 282 l-8 -8 l-8 8 l-8 -8" fill="none" stroke="#A32D2D" stroke-width="1.8"/><text x="20" y="150" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">室傍核・視索上核</text><text x="20" y="170" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">の神経細胞</text><path d="M120 150 L238 96" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><text x="20" y="214" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">漏斗（下垂体茎）</text><path d="M138 214 L300 200" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><text x="20" y="262" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">下垂体門脈系</text><path d="M118 262 L276 262" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><text x="20" y="292" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">第二次毛細血管叢</text><path d="M138 292 L246 280" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><text x="20" y="322" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">前葉（腺性）</text><path d="M104 322 L224 322" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><text x="452" y="126" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">第一次毛細血管叢</text><path d="M448 126 L326 124" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><text x="452" y="168" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">視床下部下垂体路</text><text x="452" y="188" font-size="13" fill="#2C2C2A" dominant-baseline="central">（神経細胞の軸索）</text><path d="M448 168 L314 168" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><text x="452" y="262" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">後葉（神経性）</text><path d="M448 262 L402 262" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><text x="452" y="66" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">放出・抑制ホルモン</text><text x="452" y="86" font-size="13" fill="#2C2C2A" dominant-baseline="central">を作る神経細胞</text><path d="M448 90 L401 90" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><text x="310" y="374" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">トルコ鞍（蝶形骨）</text><rect x="30" y="402" width="300" height="198" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><text x="50" y="424" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">前葉が分泌するホルモン</text><text x="50" y="452" font-size="13" fill="#2C2C2A" dominant-baseline="central">成長ホルモン（GH）</text><text x="50" y="476" font-size="13" fill="#2C2C2A" dominant-baseline="central">プロラクチン（PRL）</text><text x="50" y="500" font-size="13" fill="#2C2C2A" dominant-baseline="central">甲状腺刺激ホルモン（TSH）</text><text x="50" y="524" font-size="13" fill="#2C2C2A" dominant-baseline="central">副腎皮質刺激ホルモン（ACTH）</text><text x="50" y="548" font-size="13" fill="#2C2C2A" dominant-baseline="central">卵胞刺激ホルモン（FSH）</text><text x="50" y="572" font-size="13" fill="#2C2C2A" dominant-baseline="central">黄体形成ホルモン（LH）</text><rect x="350" y="402" width="300" height="198" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/><text x="370" y="424" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">後葉が放出するホルモン</text><text x="370" y="452" font-size="13" fill="#2C2C2A" dominant-baseline="central">バソプレシン（ADH）</text><text x="370" y="476" font-size="13" fill="#2C2C2A" dominant-baseline="central">オキシトシン</text><text x="370" y="516" font-size="13" fill="#2C2C2A" dominant-baseline="central">後葉は、視床下部の神経細胞が作った</text><text x="370" y="538" font-size="13" fill="#2C2C2A" dominant-baseline="central">ホルモンを貯えて、血中に放出する。</text></svg>