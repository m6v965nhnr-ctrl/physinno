<rect x="225" y="134" width="230" height="12" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<path d="M233 134 l0 -6 M233 146 l0 6 M249 134 l0 -6 M249 146 l0 6 M265 134 l0 -6 M265 146 l0 6 M281 134 l0 -6 M281 146 l0 6 M297 134 l0 -6 M297 146 l0 6 M313 134 l0 -6 M313 146 l0 6 M377 134 l0 -6 M377 146 l0 6 M393 134 l0 -6 M393 146 l0 6 M409 134 l0 -6 M409 146 l0 6 M425 134 l0 -6 M425 146 l0 6 M441 134 l0 -6 M441 146 l0 6" stroke="#534AB7" stroke-width="1.5"/>
<rect x="108" y="62" width="4" height="118" fill="#2C2C2A"/>
<rect x="568" y="62" width="4" height="118" fill="#2C2C2A"/>
<line x1="340.0" y1="64" x2="340.0" y2="178" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text x="110" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">Z線</text>
<text x="570" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">Z線</text>
<text x="340.0" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">M線</text>
<path d="M114 191 L114 196 L225 196 L225 191" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="169.5" y="214" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">I帯</text>
