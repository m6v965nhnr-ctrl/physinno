<rect x="405" y="77" width="165" height="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<rect x="110" y="117" width="165" height="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
