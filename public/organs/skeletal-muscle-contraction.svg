<rect x="225" y="434" width="230" height="12" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<path d="M233 434 l0 -6 M233 446 l0 6 M249 434 l0 -6 M249 446 l0 6 M265 434 l0 -6 M265 446 l0 6 M281 434 l0 -6 M281 446 l0 6 M297 434 l0 -6 M297 446 l0 6 M313 434 l0 -6 M313 446 l0 6 M377 434 l0 -6 M377 446 l0 6 M393 434 l0 -6 M393 446 l0 6 M409 434 l0 -6 M409 446 l0 6 M425 434 l0 -6 M425 446 l0 6 M441 434 l0 -6 M441 446 l0 6" stroke="#534AB7" stroke-width="1.5"/>
