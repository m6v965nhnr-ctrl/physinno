<rect x="528" y="362" width="4" height="118" fill="#2C2C2A"/>
<line x1="340.0" y1="364" x2="340.0" y2="478" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text x="150" y="352" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">Z線</text>
<text x="530" y="352" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">Z線</text>
<text x="340.0" y="352" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">M線</text>
<path d="M154 491 L154 496 L225 496 L225 491" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="189.5" y="514" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">I帯</text>
<path d="M225 491 L225 496 L455 496 L455 491" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="340.0" y="514" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">A帯（太いフィラメントの長さ）</text>
<path d="M455 491 L455 496 L526 496 L526 491" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="490.5" y="514" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">I帯</text>
<path d="M315 535 L315 540 L365 540 L365 535" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="340.0" y="558" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">H帯</text>
<path d="M150 577 L150 582 L530 582 L530 577" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="340.0" y="600" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">筋節（Z線から次のZ線まで）</text>
<rect x="14" y="642" width="26" height="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="48" y="645" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">細いフィラメント（アクチン。トロポニン・トロポミオシンが付く）</text>
<rect x="14" y="664" width="26" height="12" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="48" y="670" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">太いフィラメント（ミオシン。突き出た短い線は頭部。中央には頭部がない）</text>
<text x="14" y="694" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">収縮すると、Z線が近づき、I帯とH帯が小さくなる。A帯の長さは変わらない。</text>
</svg>
