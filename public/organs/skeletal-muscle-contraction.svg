<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 710" width="680" height="710" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>筋節の構造と滑走説（弛緩時と収縮時）</title>
<desc>上が弛緩時、下が収縮時の筋節の模式図。左右のZ線から細いフィラメント（アクチン）が中央へ伸び、中央に太いフィラメント（ミオシン、中央がM線）がある。太いフィラメントの範囲がA帯、Z線側の細いフィラメントだけの範囲がI帯、中央の太いフィラメントだけの範囲がH帯。収縮時は、Z線どうしが近づき、I帯とH帯が小さくなり、A帯の長さは変わらない。</desc>
<rect width="680" height="710" fill="#fff"/>
<text x="14" y="22" text-anchor="start" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">弛緩時</text>
