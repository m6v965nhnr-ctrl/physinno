<text x="340.0" y="214" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">A帯（太いフィラメントの長さ）</text>
<path d="M455 191 L455 196 L566 196 L566 191" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="510.5" y="214" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">I帯</text>
<path d="M275 235 L275 240 L405 240 L405 235" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="340.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">H帯</text>
<path d="M110 277 L110 282 L570 282 L570 277" fill="none" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="340.0" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">筋節（Z線から次のZ線まで）</text>
<text x="14" y="322" text-anchor="start" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">収縮時（細いフィラメントが筋節の中央へ滑り込む）</text>
