<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>発生の流れと三胚葉から分化する器官</title><desc>上段は、卵割、胚盤胞、着床、原腸形成、神経管、器官形成、胎児期という発生の流れ。下段は、外胚葉から神経系・感覚器・表皮・毛・爪、中胚葉から骨格・筋・結合組織・心臓・血管・腎臓、内胚葉から消化管の上皮・肝臓・膵臓・肺ができることを示す。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2C2C2A"/></marker></defs><rect width="680" height="540" fill="#fff"/>
<rect x="17" y="44" width="82" height="84" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="58.0" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">卵割</text><text x="58.0" y="92" text-anchor="middle" font-size="11.5" fill="#2C2C2A">受精後約3日</text><text x="58.0" y="110" text-anchor="middle" font-size="11.5" fill="#2C2C2A">桑実胚</text><line x1="100" y1="86.0" x2="110" y2="86.0" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#a)"/><rect x="111" y="44" width="82" height="84" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="152.0" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">胚盤胞</text><text x="152.0" y="92" text-anchor="middle" font-size="11.5" fill="#2C2C2A">内細胞塊と</text><text x="152.0" y="110" text-anchor="middle" font-size="11.5" fill="#2C2C2A">栄養膜</text><line x1="194" y1="86.0" x2="204" y2="86.0" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#a)"/><rect x="205" y="44" width="82" height="84" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="246.0" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">着床</text><text x="246.0" y="92" text-anchor="middle" font-size="11.5" fill="#2C2C2A">第1〜2週</text><line x1="288" y1="86.0" x2="298" y2="86.0" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#a)"/><rect x="299" y="44" width="82" height="84" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="2"/><text x="340.0" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">原腸形成</text><text x="340.0" y="92" text-anchor="middle" font-size="11.5" fill="#2C2C2A">第3週</text><text x="340.0" y="110" text-anchor="middle" font-size="10.5" fill="#2C2C2A">三胚葉ができる</text><line x1="382" y1="86.0" x2="392" y2="86.0" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#a)"/><rect x="393" y="44" width="82" height="84" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="434.0" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">神経管</text><text x="434.0" y="92" text-anchor="middle" font-size="11.5" fill="#2C2C2A">第4週</text><text x="434.0" y="110" text-anchor="middle" font-size="10.5" fill="#2C2C2A">脳と脊髄の原基</text><line x1="476" y1="86.0" x2="486" y2="86.0" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#a)"/><rect x="487" y="44" width="82" height="84" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="528.0" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">器官形成</text><text x="528.0" y="92" text-anchor="middle" font-size="11.5" fill="#2C2C2A">第8週まで</text><text x="528.0" y="110" text-anchor="middle" font-size="11.5" fill="#2C2C2A">器官の原基</text><line x1="570" y1="86.0" x2="580" y2="86.0" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#a)"/><rect x="581" y="44" width="82" height="84" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="622.0" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">胎児期</text><text x="622.0" y="92" text-anchor="middle" font-size="11.5" fill="#2C2C2A">第9週から</text><text x="622.0" y="110" text-anchor="middle" font-size="11.5" fill="#2C2C2A">器官が成熟</text><text x="20" y="30" font-size="13" font-weight="500" fill="#2C2C2A">発生の流れ（週数は受精からの週数）</text><line x1="340.0" y1="128" x2="340.0" y2="152" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#a)"/><rect x="280.0" y="158" width="120" height="16" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/><text x="340.0" y="166" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A" font-weight="500">外胚葉</text><rect x="280.0" y="176" width="120" height="16" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="340.0" y="184" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A" font-weight="500">中胚葉</text><rect x="280.0" y="194" width="120" height="16" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="340.0" y="202" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#2C2C2A" font-weight="500">内胚葉</text><rect x="20" y="250" width="200" height="226" rx="12" fill="#fff" stroke="#534AB7" stroke-width="1.8"/><path d="M20 262 A12 12 0 0 1 32 250 L208 250 A12 12 0 0 1 220 262 L220 282 L20 282 Z" fill="#CECBF6" stroke="#534AB7" stroke-width="1.8"/><text x="120" y="266" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#2C2C2A">外胚葉から</text><text x="38" y="308" dominant-baseline="central" font-size="14" fill="#2C2C2A">神経系</text><text x="38" y="338" dominant-baseline="central" font-size="14" fill="#2C2C2A">　（脳・脊髄・末梢神経）</text><text x="38" y="368" dominant-baseline="central" font-size="14" fill="#2C2C2A">感覚器</text><text x="38" y="398" dominant-baseline="central" font-size="14" fill="#2C2C2A">表皮・毛・爪</text><rect x="240" y="250" width="200" height="226" rx="12" fill="#fff" stroke="#993C1D" stroke-width="1.8"/><path d="M240 262 A12 12 0 0 1 252 250 L428 250 A12 12 0 0 1 440 262 L440 282 L240 282 Z" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.8"/><text x="340" y="266" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#2C2C2A">中胚葉から</text><text x="258" y="308" dominant-baseline="central" font-size="14" fill="#2C2C2A">骨格</text><text x="258" y="338" dominant-baseline="central" font-size="14" fill="#2C2C2A">筋</text><text x="258" y="368" dominant-baseline="central" font-size="14" fill="#2C2C2A">結合組織</text><text x="258" y="398" dominant-baseline="central" font-size="14" fill="#2C2C2A">心臓・血管</text><text x="258" y="428" dominant-baseline="central" font-size="14" fill="#2C2C2A">腎臓</text><rect x="460" y="250" width="200" height="226" rx="12" fill="#fff" stroke="#0F6E56" stroke-width="1.8"/><path d="M460 262 A12 12 0 0 1 472 250 L648 250 A12 12 0 0 1 660 262 L660 282 L460 282 Z" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.8"/><text x="560" y="266" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#2C2C2A">内胚葉から</text><text x="478" y="308" dominant-baseline="central" font-size="14" fill="#2C2C2A">消化管の上皮</text><text x="478" y="338" dominant-baseline="central" font-size="14" fill="#2C2C2A">肝臓</text><text x="478" y="368" dominant-baseline="central" font-size="14" fill="#2C2C2A">膵臓</text><text x="478" y="398" dominant-baseline="central" font-size="14" fill="#2C2C2A">肺</text><line x1="280.0" y1="166" x2="120" y2="246" stroke="#534AB7" stroke-width="1.6" marker-end="url(#a)"/><path d="M280 184 C256 188 252 216 296 246" fill="none" stroke="#993C1D" stroke-width="1.6" marker-end="url(#a)"/><line x1="400" y1="202" x2="560" y2="246" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#a)"/><text x="20" y="500" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">代表的な例を示した図で、すべての器官を網羅するものではありません。</text><text x="20" y="518" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">神経管と神経堤は外胚葉から、脊索は中胚葉から分かれます。</text>
</svg>
