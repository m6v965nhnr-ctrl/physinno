<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 870" width="680" height="870" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>頭蓋の側面と新生児の頭蓋（上面）</title>
<desc>頭蓋を左から見た図と、新生児の頭蓋を上から見た図。左から見た図では、前頭骨・頭頂骨・側頭骨・後頭骨・蝶形骨の大翼・頬骨・上顎骨・鼻骨・下顎骨を色分けし、冠状縫合、鱗状縫合、ラムダ縫合を赤い線で示す。翼点は前頭骨・頭頂骨・側頭骨・蝶形骨が接する所。新生児の上面図では、前頭骨・頭頂骨・後頭骨と、冠状縫合・矢状縫合・前頭縫合・ラムダ縫合、前に大泉門、後ろに小泉門を示す。</desc>
