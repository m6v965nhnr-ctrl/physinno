<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>赤血球の一生（産生から破壊まで）</title><desc>赤色骨髄でつくられた赤血球は最長約120日循環し、骨髄・肝臓・脾臓のマクロファージに処理される。グロビンはアミノ酸になり再利用される。ヘムの鉄はフェリチンやヘモシデリンとして肝臓や脾臓に貯蔵され、またはトランスフェリンで骨髄に運ばれ再利用される。ヘムの鉄以外の部分はビリルビンとなり、アルブミンと結合して肝臓に運ばれ、胆汁として腸へ出て、便と尿の色素になる。</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker></defs>
<rect width="680" height="680" fill="#fff"/>
<rect x="190" y="16" width="300" height="64" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="340.0" y="39.5" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">赤色骨髄</text>
<text x="340.0" y="56.5" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">赤血球がつくられる</text>
<rect x="20" y="16" width="150" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<text x="95.0" y="31.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">材料</text>
<text x="95.0" y="48.0" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">鉄・銅・亜鉛</text>
<text x="95.0" y="65.0" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">葉酸・ビタミンB12</text>
<rect x="510" y="16" width="150" height="64" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="585.0" y="39.5" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">エリスロポエチン</text>
<text x="585.0" y="56.5" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">腎臓が低酸素で分泌</text>
<path d="M172 48 L188 48" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M508 48 L492 48" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="190" y="120" width="300" height="50" rx="8" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.2" />
<text x="340.0" y="136.5" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">循環する赤血球</text>
<text x="340.0" y="153.5" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">寿命は最長約120日</text>
<path d="M340 82 L340 118" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="190" y="210" width="300" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2" />
<text x="340.0" y="229.5" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">マクロファージが貪食</text>
<text x="340.0" y="246.5" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">骨髄・肝臓・脾臓</text>
<path d="M340 172 L340 208" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="20" y="320" width="190" height="84" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="115.0" y="345.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">グロビン</text>
<text x="115.0" y="362.0" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">アミノ酸になり</text>
<text x="115.0" y="379.0" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">骨髄で再利用</text>
<rect x="245" y="320" width="190" height="84" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2" />
<text x="340.0" y="336.5" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">ヘムの鉄</text>
<text x="340.0" y="353.5" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">肝臓・脾臓に貯蔵</text>
<text x="340.0" y="370.5" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">（フェリチン・ヘモシデリン）</text>
<text x="340.0" y="387.5" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">またはトランスフェリンで骨髄へ</text>
<rect x="470" y="320" width="190" height="84" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="565.0" y="353.5" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">ヘムの鉄以外の部分</text>
<text x="565.0" y="370.5" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">ビリルビンになる</text>
<path d="M260 268 L115 318" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M340 268 L340 318" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M420 268 L565 318" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="470" y="430" width="190" height="44" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="565.0" y="452.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">アルブミンと結合して肝臓へ</text>
<path d="M565 406 L565 428" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="470" y="510" width="190" height="44" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2" />
<text x="565.0" y="532.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">肝臓：胆汁として腸へ</text>
<path d="M565 476 L565 508" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="245" y="510" width="190" height="44" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2" />
<text x="340.0" y="532.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">腸内細菌：ウロビリノゲン</text>
<path d="M468 532 L437 532" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="245" y="590" width="190" height="36" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="340.0" y="608.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">便：ステルコビリン</text>
<rect x="20" y="590" width="190" height="36" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="115.0" y="608.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">尿：ウロビリン</text>
<text x="20" y="642" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">尿のウロビリンは、腎臓が循環中の代謝産物を尿に出したもの。</text>
<path d="M340 556 L340 588" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="20" y="662" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">模式図。鉄は再利用され、ヘムの鉄以外の部分が黄色いビリルビンになる。</text>
</svg>