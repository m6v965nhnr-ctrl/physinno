<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>小腸の壁（輪状ヒダ・絨毛・微絨毛）の模式図</title><desc>左は小腸の壁の断面。粘膜と粘膜下層が盛り上がった輪状ヒダの表面に、毛のような絨毛が並ぶ。右は絨毛1本の拡大で、内部に毛細血管と中心リンパ管があり、その右の拡大図に、上皮細胞の表面の微絨毛（刷子縁）を示す。</desc><rect width="680" height="480" fill="#fff"/>
