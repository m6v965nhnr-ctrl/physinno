<text x="20" y="470" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">拡大の倍率は一定ではありません。壁の断面は粘膜が上、筋層が下です。</text>
</svg>