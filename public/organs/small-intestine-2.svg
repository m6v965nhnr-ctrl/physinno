<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central"><text x="175" y="106" text-anchor="middle">絨毛</text><text x="175" y="270" text-anchor="middle">輪状ヒダ</text><text x="60" y="372">粘膜下層</text><text x="175" y="425" text-anchor="middle">筋層</text><text x="40" y="200">内腔</text></g>
