<text x="482.4" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">6</text>
<line x1="543.2" y1="82" x2="543.2" y2="532" stroke="#D3D1C7" stroke-width="0.8" stroke-dasharray="0"/>
<text x="543.2" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">8</text>
