<text x="14" y="168.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">足底（足趾）把握反射</text>
<text x="292" y="168.0" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">9か月（12か月とも）</text>
<rect x="300.0" y="160" width="273.59999999999997" height="16" rx="3" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<rect x="573.5999999999999" y="160" width="91.19999999999999" height="16" rx="3" fill="#C0DD97" stroke="#3B6D11" stroke-width="1" stroke-dasharray="3 2" fill-opacity="0.35"/>
<text x="14" y="196.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">交叉性伸展反射</text>
