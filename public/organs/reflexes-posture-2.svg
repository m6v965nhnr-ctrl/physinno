<text x="14" y="338.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">非対称性緊張性頸反射</text>
<text x="292" y="338.0" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">4〜6か月</text>
<rect x="300.0" y="330" width="121.6" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<rect x="421.6" y="330" width="60.8" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" stroke-dasharray="3 2" fill-opacity="0.35"/>
<text x="14" y="366.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">対称性緊張性頸反射</text>
<text x="292" y="366.0" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">8〜12か月</text>
<rect x="421.6" y="358" width="60.8" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" stroke-dasharray="3 2" fill-opacity="0.35"/>
<rect x="482.4" y="358" width="60.8" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<rect x="543.2" y="358" width="121.6" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" stroke-dasharray="3 2" fill-opacity="0.35"/>
<text x="14" y="394.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">緊張性迷路反射</text>
<text x="292" y="394.0" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">5〜6か月</text>
<rect x="300.0" y="386" width="152.0" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<rect x="452.0" y="386" width="30.4" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" stroke-dasharray="3 2" fill-opacity="0.35"/>
<text x="14" y="422.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">Moro反射</text>
<text x="292" y="422.0" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">5〜6か月</text>
<rect x="300.0" y="414" width="152.0" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<rect x="452.0" y="414" width="30.4" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" stroke-dasharray="3 2" fill-opacity="0.35"/>
<rect x="8" y="439" width="664" height="22" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" fill-opacity="0.55"/>
<text x="16" y="450.0" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" font-weight="500">中枢のレベルが資料で異なるもの</text>
<text x="14" y="480.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">吸啜反射</text>
<text x="292" y="480.0" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">5〜6か月</text>
<rect x="300.0" y="472" width="152.0" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="452.0" y="472" width="30.4" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 2" fill-opacity="0.35"/>
<text x="14" y="508.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">探索反射</text>
<text x="292" y="508.0" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">5〜6か月</text>
<rect x="300.0" y="500" width="152.0" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="452.0" y="500" width="30.4" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 2" fill-opacity="0.35"/>
<rect x="14" y="552" width="34" height="14" rx="3" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<text x="56" y="559" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">濃い部分：表が示す消失（または終わり）の時期まで</text>
<rect x="14" y="576" width="34" height="14" rx="3" fill="#C0DD97" stroke="#3B6D11" stroke-width="1" stroke-dasharray="3 2" fill-opacity="0.35"/>
<text x="56" y="583" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">薄い部分：表が幅で示している範囲（例：4〜6か月）</text>
<text x="14" y="608" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">対称性緊張性頸反射は4〜6か月に出現し8〜12か月まで（6〜8か月は補って描いた）。</text>
<text x="14" y="626" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">濃淡は表の幅を描き分けた模式。Moro反射は、こども家庭庁のマニュアルでは4か月まで。</text>
</svg>
