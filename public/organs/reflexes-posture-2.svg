<text x="292" y="224.0" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">1〜2か月</text>
<rect x="300.0" y="216" width="30.4" height="16" rx="3" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
