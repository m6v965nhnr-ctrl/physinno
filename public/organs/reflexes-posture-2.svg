<rect x="391.2" y="244" width="152.0" height="16" rx="3" fill="#C0DD97" stroke="#3B6D11" stroke-width="1" stroke-dasharray="3 2" fill-opacity="0.35"/>
<text x="14" y="280.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">Galant反射</text>
