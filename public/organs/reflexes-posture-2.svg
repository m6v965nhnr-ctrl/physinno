<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 632" width="680" height="632" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>原始反射が消える時期</title><desc>横軸は月齢（0〜12か月）。脊髄レベルの反射（手掌把握・足底把握・交叉性伸展・自動歩行・陽性支持・Galant）、脳幹レベルの反射（非対称性緊張性頸反射・対称性緊張性頸反射・緊張性迷路反射・Moro反射）、レベルが資料で異なる吸啜反射と探索反射の消える時期を横棒で示す。足底把握反射が9か月ごろで最も遅い。</desc>
<rect width="680" height="632" fill="#fff"/>
<defs></defs>
<text x="340" y="22" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#2C2C2A" font-weight="500">原始反射が消える時期</text>
<text x="340" y="44" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5F5E5A">小児理学療法学テキストの表より（月齢・模式図）</text>
<line x1="300.0" y1="82" x2="300.0" y2="532" stroke="#D3D1C7" stroke-width="0.8" stroke-dasharray="0"/>
<text x="300.0" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">0</text>
