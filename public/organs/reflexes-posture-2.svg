<text x="292" y="70" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">月齢</text>
<rect x="8" y="99" width="664" height="22" rx="5" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.8" fill-opacity="0.55"/>
<text x="16" y="110.0" text-anchor="start" dominant-baseline="central" font-size="13" fill="#3B6D11" font-weight="500">脊髄レベル</text>
<text x="14" y="140.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">手掌把握反射</text>
<text x="292" y="140.0" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">4〜6か月</text>
