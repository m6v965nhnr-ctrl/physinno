<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>発熱の経過と設定温度（模式図）</title><desc>横軸は時間、縦軸は体温。プロスタグランジンE2により体温の設定温度（セットポイント）が上がると、寒冷反応で体温が上がり、設定温度に達すると保たれる。原因がなくなって設定温度が平熱に戻ると、発汗などの放熱反応で体温が下がる。</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker></defs>
<rect width="680" height="520" fill="#fff"/>
<path d="M80 330 L80 70" stroke="#2C2C2A" stroke-width="1.5" fill="none"/><path d="M72 322 L650 322" stroke="#2C2C2A" stroke-width="1.5" fill="none"/>
<path d="M80 64 l-5 10 h10 z M656 322 l-10 -5 v10 z" fill="#2C2C2A"/>
<text x="26" y="200" text-anchor="middle" font-size="13" fill="#5F5E5A" dominant-baseline="central" transform="rotate(-90 26 200)">体温</text>
<text x="365" y="350" text-anchor="middle" font-size="13" fill="#5F5E5A" dominant-baseline="central">時間</text>
<rect x="210" y="92" width="110" height="230" fill="#B5D4F4" fill-opacity="0.45"/>
<rect x="320" y="92" width="150" height="230" fill="#FAC775" fill-opacity="0.35"/>
<rect x="470" y="92" width="120" height="230" fill="#F5C4B3" fill-opacity="0.5"/>
<text x="265" y="104" text-anchor="middle" font-size="14" font-weight="500" fill="#185FA5" dominant-baseline="central">上昇期</text>
<text x="395" y="104" text-anchor="middle" font-size="14" font-weight="500" fill="#854F0B" dominant-baseline="central">高熱期</text>
<text x="530" y="104" text-anchor="middle" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">解熱期</text>
<path d="M80 270 L210 270 L210 150 L470 150 L470 270 L640 270" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-dasharray="7 5"/>
<path d="M80 270 L210 270 C245 270 285 150 335 150 L470 150 C505 150 540 270 590 270 L640 270" fill="none" stroke="#A32D2D" stroke-width="2.6"/>
<text x="88" y="288" text-anchor="start" font-size="12" fill="#534AB7" dominant-baseline="central">平熱の設定温度</text>
<text x="216" y="132" text-anchor="start" font-size="12" fill="#534AB7" dominant-baseline="central">PGE2で設定温度が上がる</text>
<text x="464" y="200" text-anchor="end" font-size="12" fill="#534AB7" dominant-baseline="central">PGE2の作用が消え</text>
<text x="464" y="217" text-anchor="end" font-size="12" fill="#534AB7" dominant-baseline="central">設定温度が平熱に戻る</text>
<text x="612" y="258" text-anchor="middle" font-size="13" font-weight="500" fill="#A32D2D" dominant-baseline="central">体温</text>
<rect x="15" y="376" width="210" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="120.0" y="396.0" text-anchor="middle" font-size="12" font-weight="500" fill="#185FA5" dominant-baseline="central">上昇期</text>
<text x="120.0" y="412.0" text-anchor="middle" font-size="12" fill="#185FA5" dominant-baseline="central">皮膚血管収縮・ふるえ・悪寒</text>
<rect x="235" y="376" width="210" height="56" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="340.0" y="396.0" text-anchor="middle" font-size="12" font-weight="500" fill="#854F0B" dominant-baseline="central">高熱期</text>
<text x="340.0" y="412.0" text-anchor="middle" font-size="12" fill="#854F0B" dominant-baseline="central">設定温度に達して上がらない</text>
<rect x="455" y="376" width="210" height="56" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="560.0" y="396.0" text-anchor="middle" font-size="12" font-weight="500" fill="#993C1D" dominant-baseline="central">解熱期</text>
<text x="560.0" y="412.0" text-anchor="middle" font-size="12" fill="#993C1D" dominant-baseline="central">皮膚血管拡張・発汗で体温が下がる</text>
<text x="14" y="448" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">点線は体温の設定温度（セットポイント）、実線は実際の体温。</text>
<text x="14" y="468" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">感染や炎症でサイトカインが出ると、脳内でプロスタグランジンE2（PGE2）が増える。</text>
<text x="14" y="488" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">傾向を示す模式図で、実測値ではない。</text>
</svg>