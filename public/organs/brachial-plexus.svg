<text x="110" y="368" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5F5E5A">鎖骨より上（鎖骨上部）</text>
<line x1="373" y1="350" x2="640" y2="350" stroke="#888780" stroke-width="1.2"/>
<line x1="373" y1="344" x2="373" y2="350" stroke="#888780" stroke-width="1.2"/>
<line x1="640" y1="344" x2="640" y2="350" stroke="#888780" stroke-width="1.2"/>
<text x="506" y="368" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5F5E5A">鎖骨より下（鎖骨下部）</text>
<rect x="26" y="391" width="28" height="18" rx="6" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="40" y="400" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A"></text>
<text x="60" y="400" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">C5〜C7：新生児の上位（Erb麻痺）にあたる根（MSDの区分）</text>
<rect x="26" y="417" width="28" height="18" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="40" y="426" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A"></text>
<text x="60" y="426" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">C8・T1：新生児の下位（Klumpke麻痺）にあたる根（MSDの区分）</text>
<text x="14" y="456" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">線の色は、行き先の束の色。外側＝黄、内側＝桃、後＝青。正中神経は外側根と内側根が合わさる。</text>
<text x="14" y="478" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">鎖骨上部の枝（肩甲背神経・肩甲上神経・長胸神経・鎖骨下筋神経）は、図では省略。</text>
</svg>
