<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>腕神経叢の模式図（根・幹・分枝・束・終枝）</title><desc>左から、根（C5〜T1）、幹（上・中・下神経幹）、分枝（各幹の前部と後部）、束（外側・内側・後神経束）、終枝（筋皮・正中・尺骨・橈骨・腋窩神経）の順に並ぶ模式図。</desc>
<rect width="680" height="500" fill="#fff"/>

<text x="50" y="14" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">根</text>
<text x="165" y="14" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">幹</text>
<text x="284" y="14" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">分枝</text>
<text x="415" y="14" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">束</text>
<text x="580" y="14" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">終枝</text>
