<text x="580" y="46" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">筋皮神経</text>
<rect x="520" y="84" width="120" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="580" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">正中神経</text>
<rect x="520" y="138" width="120" height="32" rx="6" fill="#F4C0D1" stroke="#993556" stroke-width="1"/>
<text x="580" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">尺骨神経</text>
<rect x="520" y="206" width="120" height="32" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="580" y="222" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">橈骨神経</text>
<rect x="520" y="246" width="120" height="32" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="580" y="262" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">腋窩神経</text>
<line x1="457" y1="71" x2="520" y2="46" stroke="#854F0B" stroke-width="1.8"/>
<line x1="457" y1="71" x2="520" y2="100" stroke="#854F0B" stroke-width="1.8"/>
