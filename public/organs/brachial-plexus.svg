<rect x="20" y="176" width="60" height="28" rx="6" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="50" y="190" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">C7</text>
<rect x="20" y="254" width="60" height="28" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="50" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">C8</text>
