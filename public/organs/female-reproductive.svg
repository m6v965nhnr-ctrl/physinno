<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>女性生殖器の前額断（卵巣・卵管・子宮・腟）</title><desc>女性の内生殖器を前から見た模式図（広げて描いたもの）。中央に子宮があり、上の丸い部分が子宮底、中ほどが子宮体、下の細い部分が子宮頸で、子宮頸は腟の中に突き出す。子宮の壁は内側から子宮内膜、筋層、外膜。左右の子宮の上外側から卵管が出て、子宮に近い狭い部分が卵管峡部、その外側の広い部分が卵管膨大部、先の広がった部分が卵管漏斗で、指のような卵管采がある。卵管のそばに卵巣があり、固有卵巣索で子宮につながり、卵巣提索で骨盤壁につながる。子宮の両側に子宮広間膜があり、子宮円索は子宮から外側下方に出て大陰唇に至る。</desc><rect width="680" height="600" fill="#fff"/>
