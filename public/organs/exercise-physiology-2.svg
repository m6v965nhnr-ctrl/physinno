<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 614" width="680" height="614" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>動的運動中の主な変化（一覧）</title><desc>動的（有酸素）運動中に、心拍数・1回拍出量・心拍出量・静脈還流・活動筋の血流・皮膚の血流・換気量・体温が上がり、末梢血管抵抗は下がり、平均血圧はわずかに上がる。運動に必要性の少ない臓器の血流は減る。</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker></defs>
<rect width="680" height="614" fill="#fff"/>
<rect x="15" y="14" width="335" height="44" rx="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="27" y="36.0" text-anchor="start" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">心拍数</text>
<text x="340" y="36.0" text-anchor="end" font-size="16" font-weight="500" fill="#993C1D" dominant-baseline="central">↑</text>
<rect x="356" y="14" width="309" height="44" rx="7" fill="#fff" stroke="#993C1D" stroke-width="1" />
<text x="366" y="36.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">交感神経↑・副交感神経の活動低下</text>
<rect x="15" y="64" width="335" height="44" rx="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="27" y="86.0" text-anchor="start" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">1回拍出量</text>
<text x="340" y="86.0" text-anchor="end" font-size="16" font-weight="500" fill="#993C1D" dominant-baseline="central">↑→頭打ち</text>
<rect x="356" y="64" width="309" height="44" rx="7" fill="#fff" stroke="#993C1D" stroke-width="1" />
<text x="366" y="86.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">高心拍数では充満時間が短くなり頭打ち〜低下</text>
<rect x="15" y="114" width="335" height="44" rx="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="27" y="136.0" text-anchor="start" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">心拍出量</text>
<text x="340" y="136.0" text-anchor="end" font-size="16" font-weight="500" fill="#993C1D" dominant-baseline="central">↑</text>
<rect x="356" y="114" width="309" height="44" rx="7" fill="#fff" stroke="#993C1D" stroke-width="1" />
<text x="366" y="136.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">酸素摂取量に比例して増える</text>
<rect x="15" y="164" width="335" height="44" rx="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="27" y="186.0" text-anchor="start" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">静脈還流</text>
<text x="340" y="186.0" text-anchor="end" font-size="16" font-weight="500" fill="#993C1D" dominant-baseline="central">↑</text>
<rect x="356" y="164" width="309" height="44" rx="7" fill="#fff" stroke="#993C1D" stroke-width="1" />
<text x="366" y="186.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">心臓へ戻る血液量が増える</text>
<rect x="15" y="214" width="335" height="44" rx="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="27" y="236.0" text-anchor="start" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">活動筋の血流</text>
<text x="340" y="236.0" text-anchor="end" font-size="16" font-weight="500" fill="#993C1D" dominant-baseline="central">↑</text>
<rect x="356" y="214" width="309" height="44" rx="7" fill="#fff" stroke="#993C1D" stroke-width="1" />
<text x="366" y="236.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">β2作用による血管拡張</text>
<rect x="15" y="264" width="335" height="44" rx="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="27" y="286.0" text-anchor="start" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">皮膚の血流</text>
<text x="340" y="286.0" text-anchor="end" font-size="16" font-weight="500" fill="#993C1D" dominant-baseline="central">↑</text>
<rect x="356" y="264" width="309" height="44" rx="7" fill="#fff" stroke="#993C1D" stroke-width="1" />
<text x="366" y="286.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">放熱のため（顔が赤くなる）</text>
<rect x="15" y="314" width="335" height="44" rx="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="27" y="336.0" text-anchor="start" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">換気量</text>
<text x="340" y="336.0" text-anchor="end" font-size="16" font-weight="500" fill="#993C1D" dominant-baseline="central">↑</text>
<rect x="356" y="314" width="309" height="44" rx="7" fill="#fff" stroke="#993C1D" stroke-width="1" />
<text x="366" y="336.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">強い運動でAT付近から急増</text>
<rect x="15" y="364" width="335" height="44" rx="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="27" y="386.0" text-anchor="start" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">体温</text>
<text x="340" y="386.0" text-anchor="end" font-size="16" font-weight="500" fill="#993C1D" dominant-baseline="central">↑</text>
<rect x="356" y="364" width="309" height="44" rx="7" fill="#fff" stroke="#993C1D" stroke-width="1" />
<text x="366" y="386.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">熱産生が増える</text>
<rect x="15" y="414" width="335" height="44" rx="7" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="27" y="436.0" text-anchor="start" font-size="14" font-weight="500" fill="#185FA5" dominant-baseline="central">末梢血管抵抗</text>
<text x="340" y="436.0" text-anchor="end" font-size="16" font-weight="500" fill="#185FA5" dominant-baseline="central">↓</text>
<rect x="356" y="414" width="309" height="44" rx="7" fill="#fff" stroke="#185FA5" stroke-width="1" />
<text x="366" y="436.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">筋の代謝性血管拡張</text>
<rect x="15" y="464" width="335" height="44" rx="7" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="27" y="486.0" text-anchor="start" font-size="14" font-weight="500" fill="#185FA5" dominant-baseline="central">運動に必要性の少ない臓器の血流</text>
<text x="340" y="486.0" text-anchor="end" font-size="16" font-weight="500" fill="#185FA5" dominant-baseline="central">↓</text>
<rect x="356" y="464" width="309" height="44" rx="7" fill="#fff" stroke="#185FA5" stroke-width="1" />
<text x="366" y="486.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">α1作用による血管収縮</text>
<rect x="15" y="514" width="335" height="44" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<text x="27" y="536.0" text-anchor="start" font-size="14" font-weight="500" fill="#5F5E5A" dominant-baseline="central">平均血圧</text>
<text x="340" y="536.0" text-anchor="end" font-size="16" font-weight="500" fill="#5F5E5A" dominant-baseline="central">わずかに↑</text>
<rect x="356" y="514" width="309" height="44" rx="7" fill="#fff" stroke="#5F5E5A" stroke-width="1" />
<text x="366" y="536.0" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">動的運動。等尺性運動では上がっていく</text>
<text x="15" y="578" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">矢印は変化の向きを示す一覧で、大きさは示していない。</text>
<text x="15" y="598" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">主な出典: OpenStax、近畿大学の講義資料、広島大学の教材、Biomed Res Int総説。</text>
</svg>