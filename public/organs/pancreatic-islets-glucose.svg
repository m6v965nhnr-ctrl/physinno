<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>膵島（ランゲルハンス島）の細胞とホルモン</title><desc>膵島の模式図。膵島はβ細胞（約75％、インスリン）、α細胞（約20％、グルカゴン）、δ細胞（約4％、ソマトスタチン）、PP細胞（約1％、膵ポリペプチド）からなる。インスリンは血糖を下げ、グルカゴンは血糖を上げ、ソマトスタチンはインスリンとグルカゴンの分泌を抑える。</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#854F0B"/></marker></defs><rect width="680" height="420" fill="#fff"/><circle cx="160" cy="210" r="140" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><circle cx="110" cy="130" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="170" cy="110" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="225" cy="140" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="80" cy="190" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="140" cy="170" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="200" cy="195" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="255" cy="215" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="100" cy="250" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="160" cy="240" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="220" cy="270" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="130" cy="310" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="190" cy="320" r="17" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><circle cx="215" cy="235" r="16" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><circle cx="95" cy="215" r="16" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><circle cx="150" cy="285" r="16" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><circle cx="250" cy="255" r="16" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><circle cx="60" cy="150" r="13" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><circle cx="62" cy="238" r="11" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><text x="160" y="28" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">膵島（ランゲルハンス島）</text><circle cx="350" cy="72" r="12" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="374" y="60" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">β細胞（約75％）</text><text x="374" y="84" font-size="13" fill="#2C2C2A" dominant-baseline="central">インスリン：血糖を下げる</text><circle cx="350" cy="160" r="12" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="374" y="148" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">α細胞（約20％）</text><text x="374" y="172" font-size="13" fill="#2C2C2A" dominant-baseline="central">グルカゴン：血糖を上げる</text><circle cx="350" cy="248" r="12" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><text x="374" y="236" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">δ細胞（約4％）</text><text x="374" y="260" font-size="13" fill="#2C2C2A" dominant-baseline="central">ソマトスタチン</text><text x="374" y="282" font-size="12.5" fill="#5F5E5A" dominant-baseline="central">インスリン・グルカゴンの分泌を抑える</text><circle cx="350" cy="336" r="12" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/><text x="374" y="324" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">PP細胞（約1％）</text><text x="374" y="348" font-size="13" fill="#2C2C2A" dominant-baseline="central">膵ポリペプチド</text><text x="374" y="370" font-size="12.5" fill="#5F5E5A" dominant-baseline="central">食欲や膵の分泌に関わると考えられている</text></svg>