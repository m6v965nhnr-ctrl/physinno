<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 730" width="680" height="730" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>手の骨（右手を手のひら側から見た模式図）</title><desc>右手を手のひら側から見た図。母指（親指）が左。下から、橈骨と尺骨の下端、その上に8個の手根骨が2列に並ぶ。近位列は、母指側から舟状骨・月状骨・三角骨・豆状骨（豆状骨は三角骨の手のひら側）。遠位列は、母指側から大菱形骨・小菱形骨・有頭骨・有鉤骨で、有鉤骨には手のひら側へ突き出る鉤がある。舟状骨の腰部に骨折線を、血行の向き（遠位から近位）を矢印で示す。手根骨の上に、第1〜5の5本の中手骨、その先に指骨がある。母指の指骨は2節、ほかの4本の指は3節（基節骨・中節骨・末節骨）。</desc><rect width="680" height="730" fill="#fff"/><text x="340" y="28" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">右手（手のひら側から見る）</text>
