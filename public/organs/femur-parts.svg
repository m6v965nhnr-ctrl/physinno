<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 900" width="680" height="900" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>大腿骨の各部（前面）と頸体角・前捻角（模式図）</title><desc>右大腿骨を前から見た模式図。上内側に大腿骨頭（頭窩を含む）、頭と体をつなぐ大腿骨頸、頸の上外側に大転子、内側縁に小転子、前面に転子間線。遠位は内側顆・外側顆とその外側の内側上顆・外側上顆、内側上顆の上に内転筋結節、前面中央に膝蓋面。赤い点線は大腿骨近位部骨折の部位（頸部・転子部・転子下）。下段は、前から見た頸体角（約120〜130°の目安）と、上から見た前捻角（約15°）の模式図。</desc>
