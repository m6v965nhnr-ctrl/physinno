<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>ホルモン分泌の調節（視床下部—下垂体—標的腺と負のフィードバック）</title><desc>視床下部の放出ホルモンが下垂体前葉を刺激し、下垂体前葉の刺激ホルモンが甲状腺・副腎皮質・性腺などの標的腺を刺激し、標的腺のホルモンが標的組織に作用する。標的腺のホルモンが増えると、視床下部と下垂体前葉に作用して分泌を抑える（負のフィードバック）。例として、TRH→TSH→T3・T4、CRH→ACTH→コルチゾール、GnRH→LH・FSH→性ホルモン。</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#854F0B"/></marker></defs><rect width="680" height="580" fill="#fff"/><rect x="200" y="24" width="200" height="54" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="300" y="51.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">視床下部</text><rect x="200" y="160" width="200" height="54" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><text x="300" y="187.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">下垂体前葉</text><rect x="200" y="296" width="200" height="54" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="300" y="316" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">標的腺</text><text x="300" y="336" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">甲状腺・副腎皮質・性腺など</text><rect x="200" y="432" width="200" height="54" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="300" y="452" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">標的組織</text><text x="300" y="472" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">（ホルモンの作用を受ける）</text><path d="M300 80 L300 158" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><text x="286" y="96" text-anchor="end" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">放出ホルモン</text><text x="286" y="116" text-anchor="end" font-size="13" fill="#2C2C2A" dominant-baseline="central">（TRH・CRH・GnRH</text><text x="286" y="136" text-anchor="end" font-size="13" fill="#2C2C2A" dominant-baseline="central">・GHRHなど）</text><path d="M300 216 L300 294" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><text x="286" y="232" text-anchor="end" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">刺激ホルモン</text><text x="286" y="252" text-anchor="end" font-size="13" fill="#2C2C2A" dominant-baseline="central">（TSH・ACTH</text><text x="286" y="272" text-anchor="end" font-size="13" fill="#2C2C2A" dominant-baseline="central">・LH・FSH）</text><path d="M300 352 L300 430" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><text x="286" y="368" text-anchor="end" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">標的腺のホルモン</text><text x="286" y="388" text-anchor="end" font-size="13" fill="#2C2C2A" dominant-baseline="central">（T3・T4・コルチゾール</text><text x="286" y="408" text-anchor="end" font-size="13" fill="#2C2C2A" dominant-baseline="central">・性ホルモンなど）</text><path d="M400 316 L452 316 L452 190 L402 190" fill="none" stroke="#A32D2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><path d="M400 330 L508 330 L508 50 L402 50" fill="none" stroke="#A32D2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="520" y="190" font-size="13" font-weight="500" fill="#A32D2D" dominant-baseline="central">負のフィードバック（−）</text><text x="520" y="214" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">増えると視床下部・</text><text x="520" y="233" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">下垂体に作用して</text><text x="520" y="252" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">分泌を抑える</text><rect x="20" y="508" width="640" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="34" y="524" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">例</text><text x="70" y="524" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">甲状腺：TRH → TSH → T3・T4　／　副腎皮質：CRH → ACTH → コルチゾール</text><text x="70" y="546" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">性腺：GnRH → LH・FSH → 性ホルモン</text></svg>