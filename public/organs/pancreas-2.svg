<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>膵臓の外分泌部と内分泌部（模式図）</title><desc>外分泌部は、腺房が導管につながり、導管が主膵管に集まって、酵素と重炭酸を含む膵液を十二指腸へ運ぶ。内分泌部は、腺房の間にある膵島で、α細胞がグルカゴン、β細胞がインスリン、δ細胞がソマトスタチンを血液中に出す。</desc><rect width="680" height="540" fill="#fff"/>
<text x="20" y="30" font-size="14" font-weight="500" fill="#5F5E5A">外分泌部（膵液）</text>
<path d="M40 110 L250 110" stroke="#854F0B" stroke-width="12" stroke-linecap="round"/><path d="M40 110 L250 110" stroke="#FAC775" stroke-width="9" stroke-linecap="round"/>
<path d="M250 110 L330 110" stroke="#534AB7" stroke-width="14" stroke-linecap="round"/><path d="M250 110 L330 110" stroke="#CECBF6" stroke-width="11" stroke-linecap="round"/>
<g stroke="#854F0B" stroke-width="1" fill="#FAC775"><path d="M90 110 L90 70"/><path d="M150 110 L150 70"/><path d="M210 110 L210 70"/><path d="M120 110 L120 150"/><path d="M180 110 L180 150"/>
<circle cx="90" cy="56" r="14"/><circle cx="76" cy="66" r="11"/><circle cx="104" cy="66" r="11"/><circle cx="150" cy="56" r="14"/><circle cx="136" cy="66" r="11"/><circle cx="164" cy="66" r="11"/><circle cx="210" cy="56" r="14"/><circle cx="196" cy="66" r="11"/><circle cx="224" cy="66" r="11"/><circle cx="120" cy="164" r="14"/><circle cx="106" cy="154" r="11"/><circle cx="134" cy="154" r="11"/><circle cx="180" cy="164" r="14"/><circle cx="166" cy="154" r="11"/><circle cx="194" cy="154" r="11"/></g>
<g fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"><line x1="290" y1="104" x2="290" y2="80"/></g>
<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central"><text x="40" y="205">腺房（酵素を作る）</text><text x="20" y="235" font-size="12" fill="#5F5E5A">→ 導管 → 主膵管 → 十二指腸</text><text x="290" y="68" text-anchor="middle">十二指腸</text><text x="150" y="132" font-size="12" fill="#5F5E5A" text-anchor="middle"></text><text x="206" y="134" font-size="12" fill="#854F0B">主膵管・導管</text></g>
<text x="20" y="285" font-size="12" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">膵液：水・重炭酸（酸の中和）・消化酵素（アミラーゼ・リパーゼ・蛋白分解酵素の前駆体）</text>
<line x1="20" y1="305" x2="660" y2="305" stroke="#D3D1C7" stroke-width="1"/>
<text x="20" y="335" font-size="14" font-weight="500" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">内分泌部（膵島：ランゲルハンス島）</text>
<ellipse cx="170" cy="430" rx="110" ry="62" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" opacity="0.5"/>
<g stroke-width="1" ><circle cx="125" cy="415" r="15" fill="#CECBF6" stroke="#534AB7"/><circle cx="160" cy="400" r="15" fill="#CECBF6" stroke="#534AB7"/><circle cx="195" cy="418" r="15" fill="#CECBF6" stroke="#534AB7"/><circle cx="145" cy="448" r="15" fill="#CECBF6" stroke="#534AB7"/><circle cx="180" cy="452" r="15" fill="#CECBF6" stroke="#534AB7"/><circle cx="215" cy="446" r="15" fill="#CECBF6" stroke="#534AB7"/><circle cx="108" cy="445" r="9" fill="#F4C0D1" stroke="#993556"/><circle cx="232" cy="420" r="9" fill="#9FE1CB" stroke="#0F6E56"/></g>
<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central"><text x="320" y="390" fill="#534AB7">β細胞（紫・多数）：インスリン</text><text x="320" y="414" font-size="12" fill="#5F5E5A">膵島の約75%。血糖を下げる</text><text x="320" y="442" fill="#993556">α細胞（桃）：グルカゴン</text><text x="320" y="466" font-size="12" fill="#5F5E5A">膵島の約20%。血糖を上げる</text><text x="320" y="494" fill="#0F6E56">δ細胞（緑）：ソマトスタチン</text><text x="320" y="518" font-size="12" fill="#5F5E5A">膵島の約4%。インスリンとグルカゴンの分泌を抑える</text></g>
</svg>
