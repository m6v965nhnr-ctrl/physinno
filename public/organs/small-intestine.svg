<text x="20" y="465" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">空腸と回腸の境ははっきりしません。蛇行する腸管は、区分を示すための単純な形です。</text>
</svg>
