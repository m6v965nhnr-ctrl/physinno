<circle cx="162" cy="150" r="5" fill="#E24B4A" stroke="#A32D2D" stroke-width="0.5"/>
<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central"><text x="272" y="64">胃（幽門側）</text><text x="225" y="148" text-anchor="middle">膵頭</text><g text-anchor="end"><text x="100" y="150">十二指腸乳頭</text><text x="100" y="200">十二指腸</text><text x="100" y="385">盲腸（大腸）</text></g><text x="505" y="205">空腸</text><text x="505" y="310">回腸</text><text x="205" y="430">回盲弁</text></g>
