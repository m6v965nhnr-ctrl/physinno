<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>小腸の区分（前から見た模式図）</title><desc>胃の幽門に続く十二指腸が、膵頭を囲むC字形をつくり、空腸、回腸と続いて、回盲弁で盲腸につながる。十二指腸乳頭は十二指腸の壁にある（図では下行部の内側に描くが、位置は目安）。</desc><rect width="680" height="480" fill="#fff"/>
