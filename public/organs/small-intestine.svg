<path d="M300 170 L480 170 L480 205 L340 205 L340 240 L480 240" stroke="#0F6E56" stroke-width="22"/><path d="M300 170 L480 170 L480 205 L340 205 L340 240 L480 240" stroke="#9FE1CB" stroke-width="19"/>
