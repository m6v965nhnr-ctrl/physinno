<g font-size="12" fill="#5F5E5A"><text x="20" y="534" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">塩基: A アデニン（橙）・T チミン（黄）・G グアニン（緑）・C シトシン（青）・U ウラシル（桃）</text><text x="20" y="552" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">RNAにはチミンの代わりにウラシルがあります。塩基の並びは模式的な例で、実在の遺伝子の配列ではありません。</text><text x="20" y="570" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">mRNAのコドンAUGに、tRNAのアンチコドンUACが相補的に結合します。</text></g>
