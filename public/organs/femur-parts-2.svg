<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>大腿骨の各部（後面）（模式図）</title><desc>右大腿骨を後ろから見た模式図。左が内側。上内側に大腿骨頭、頭と体をつなぐ大腿骨頸。頸の外側に大転子、その内側のくぼみが転子窩。大転子と小転子を後ろでつなぐ隆起が転子間稜。小転子の下縁に沿って恥骨筋線。大転子の下から続く粗い面が殿筋粗面で、後面中央を縦に走る粗線は内側唇と外側唇に分かれ、遠位で内側・外側の顆上線に分かれて、その間が膝窩面。遠位は内側顆・外側顆、その間の深いくぼみが顆間窩。内側上顆の上に内転筋結節。</desc>
