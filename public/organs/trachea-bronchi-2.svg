<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="680" height="490" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>肺胞の壁とガス交換（模式図）</title><desc>肺胞の空気と毛細血管の血液が、Ⅰ型肺胞上皮・基底膜・毛細血管内皮からなる呼吸膜で隔てられている。酸素は肺胞から血液へ、二酸化炭素は血液から肺胞へ拡散する。Ⅱ型肺胞上皮はサーファクタントを分泌し、肺胞マクロファージは肺胞内の異物を処理する。</desc><rect width="680" height="490" fill="#fff"/>
<rect x="40" y="50" width="290" height="370" rx="40" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="360" y="50" width="250" height="370" rx="40" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<rect x="330" y="50" width="30" height="370" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<rect x="296" y="120" width="40" height="58" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/>
<g fill="#854F0B"><circle cx="284" cy="132" r="2.5"/><circle cx="278" cy="148" r="2.5"/><circle cx="284" cy="164" r="2.5"/><circle cx="270" cy="140" r="2.5"/><circle cx="270" cy="158" r="2.5"/></g>
<circle cx="236" cy="356" r="24" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/><circle cx="236" cy="356" r="7" fill="#3B6D11"/>
<g fill="#E24B4A" stroke="#A32D2D" stroke-width="0.8"><ellipse cx="470" cy="110" rx="26" ry="11"/><ellipse cx="520" cy="330" rx="26" ry="11"/><ellipse cx="440" cy="380" rx="26" ry="11"/></g>
<g fill="none" stroke-width="2.2"><line x1="150" y1="238" x2="470" y2="238" stroke="#185FA5"/><line x1="470" y1="296" x2="150" y2="296" stroke="#993C1D"/></g><polygon points="480,238 466,231 466,245" fill="#185FA5"/><polygon points="140,296 154,289 154,303" fill="#993C1D"/>
<g font-size="14" fill="#2C2C2A" dominant-baseline="central"><text x="60" y="76" font-weight="500">肺胞（空気の入る腔）</text><text x="380" y="76" font-weight="500">毛細血管</text><text x="156" y="216" fill="#185FA5" font-weight="500">O₂：肺胞 → 血液</text><text x="156" y="320" fill="#993C1D" font-weight="500">CO₂：血液 → 肺胞</text>
<text x="345" y="452" font-weight="500" text-anchor="middle">呼吸膜：Ⅰ型肺胞上皮＋基底膜＋毛細血管内皮</text><text x="60" y="108">Ⅱ型肺胞上皮</text><text x="60" y="130" font-size="14">（サーファクタントを分泌）</text><text x="236" y="398" text-anchor="middle">肺胞マクロファージ</text><text x="456" y="156">赤血球</text></g>
<g stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"><line x1="152" y1="108" x2="296" y2="140"/><line x1="236" y1="388" x2="236" y2="381"/><line x1="476" y1="146" x2="472" y2="122"/><line x1="345" y1="422" x2="345" y2="438"/></g></svg>