<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 664" width="680" height="664" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>上腕骨の各部（前面と後面の模式図）</title><desc>右の上腕骨を前から見た図（左）と後ろから見た図（右）。前面では、上端の内側に上腕骨頭、そのふちが解剖頸。外側に大結節、前の内側に小結節、その間に結節間溝。結節の下の細くなる所が外科頸。体の外側の中ほどに三角筋粗面。下端は、外側から外側上顆、上腕骨小頭、上腕骨滑車、内側上顆の順で、小頭の上に橈骨窩、滑車の上に鈎突窩がある。後面では、橈骨神経溝が体の後ろを斜めに外側へ下り、下端の後ろに大きなくぼみの肘頭窩がある。</desc><rect width="680" height="664" fill="#fff"/><defs><clipPath id="ca"><path d="M 120,140 Q 118,108 148,100 Q 178,80 218,88 Q 250,108 236,148 Q 228,172 204,192 Q 192,215 192,250 L 192,490 Q 196,520 222,556 L 236,592 Q 234,618 210,622 L 144,622 Q 120,622 120,598 Q 124,562 140,536 Q 148,512 148,490 L 148,250 Q 146,222 128,194 Q 118,172 120,140 Z"/></clipPath><clipPath id="cp"><path d="M 545,140 Q 547,108 517,100 Q 487,80 447,88 Q 415,108 429,148 Q 437,172 461,192 Q 473,215 473,250 L 473,490 Q 469,520 443,556 L 429,592 Q 431,618 455,622 L 521,622 Q 545,622 545,598 Q 541,562 525,536 Q 517,512 517,490 L 517,250 Q 519,222 537,194 Q 547,172 545,140 Z"/></clipPath></defs><path d="M 120,140 Q 118,108 148,100 Q 178,80 218,88 Q 250,108 236,148 Q 228,172 204,192 Q 192,215 192,250 L 192,490 Q 196,520 222,556 L 236,592 Q 234,618 210,622 L 144,622 Q 120,622 120,598 Q 124,562 140,536 Q 148,512 148,490 L 148,250 Q 146,222 128,194 Q 118,172 120,140 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4" stroke-linejoin="round"/>
