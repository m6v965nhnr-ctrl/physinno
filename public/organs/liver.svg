<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>肝臓の位置と葉（前から見た模式図）</title><desc>横隔膜の下の右上腹部にある肝臓を前から見た模式図。体の右側（図の左）に大きな右葉、左側に小さな左葉があり、鎌状間膜が前面で両葉を分け、その下縁に肝円索が付く。胆嚢は右葉の下縁の近くに見える。</desc><rect width="680" height="440" fill="#fff"/>
<path d="M150 70 Q340 20 530 70 L530 80 Q340 40 150 80 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<path d="M150 100 C150 70 270 62 410 70 L410 268 C300 292 165 272 150 200 Z" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/>
<path d="M410 70 C460 68 515 82 530 115 C538 145 500 190 410 268 Z" fill="#FAC775" stroke="#854F0B" stroke-width="1.5"/>
<line x1="410" y1="68" x2="410" y2="270" stroke="#534AB7" stroke-width="3"/>
<path d="M265 278 C265 305 285 335 305 335 C325 335 335 310 322 280 Z" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/>
<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central"><text x="270" y="175" text-anchor="middle">右葉</text><text x="470" y="150" text-anchor="middle">左葉</text><text x="20" y="75">横隔膜</text><text x="600" y="205">鎌状間膜</text><text x="600" y="320">肝円索</text><text x="235" y="372" text-anchor="middle">胆嚢</text></g>
<g stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"><line x1="80" y1="75" x2="150" y2="75"/><line x1="596" y1="205" x2="412" y2="205"/><line x1="596" y1="320" x2="412" y2="320"/><line x1="256" y1="364" x2="290" y2="330"/></g>
<line x1="410" y1="270" x2="410" y2="345" stroke="#534AB7" stroke-width="2" stroke-dasharray="1 3" stroke-linecap="round"/>
<text x="20" y="420" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">前から見た図です。方形葉・尾状葉、肝門は、この図では見えません。</text>
</svg>
