<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>寛骨の各部（外面）（模式図）</title><desc>右の寛骨を外側から見た模式図。前が右。上の扇形が腸骨で、上縁が腸骨稜、前端が上前腸骨棘、その下に下前腸骨棘、後ろの端が上後腸骨棘、その下に下後腸骨棘。後縁には、下後腸骨棘の下に大坐骨切痕、その下に坐骨棘、さらに下に小坐骨切痕、その下が坐骨結節。外側中央のくぼみが寛骨臼で、腸骨・坐骨・恥骨が集まる。点線は小児で3つの骨の間にある軟骨（Y字軟骨）の位置で、前上方（腸骨と恥骨の間）・後方（腸骨と坐骨の間）・下方（恥骨と坐骨の間）に伸びる。寛骨臼の下に閉鎖孔、前下方に恥骨と恥骨結節。</desc>
