<line x1="576" y1="592" x2="346" y2="568" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="354" y="44" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">腹大動脈</text>
<text x="480" y="402" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">総腸骨動脈</text>
<text x="520" y="200" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">① 腎盂尿管移行部</text>
<line x1="516" y1="196" x2="498" y2="180" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="500" y="312" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">② 腸骨血管との交差部</text>
<line x1="496" y1="312" x2="451" y2="312" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="500" y="478" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">③ 膀胱壁を貫く部</text>
