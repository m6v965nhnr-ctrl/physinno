<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 740" width="680" height="740" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>尿路全体（男性・前から見た模式図）</title><desc>尿路全体を前から見た模式図。左右の腎臓から腎盂を経て尿管が下り、膀胱に入る。図の右側の尿管に、教科書（Dartmouth）で尿管の狭窄部とされる3か所（腎盂尿管移行部、骨盤入口で腸骨血管と交差する部、膀胱壁を貫く部）に番号を付けた。膀胱の底に左右の尿管口と内尿道口を結ぶ膀胱三角があり、尿道は男性では前立腺を貫いて続く。</desc>
