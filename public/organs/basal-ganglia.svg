<line x1="340" y1="410" x2="340" y2="336.8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="20" y="462" font-size="13" fill="#5F5E5A" dominant-baseline="central">※視床の高さの前頭断（前から見た図）。左右は対称に描き、ラベルは両側に分けて付けた。</text>
<text x="20" y="484" font-size="13" fill="#5F5E5A" dominant-baseline="central">※黒質は中脳にあり、この断面には現れない。視床下核の位置は模式的。</text>
<text x="20" y="506" font-size="13" fill="#5F5E5A" dominant-baseline="central">※内包（後脚）は、この高さでは内側の視床と、外側の淡蒼球・被殻のあいだを通る白質。</text>
</svg>
