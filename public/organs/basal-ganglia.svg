<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>大脳基底核と視床の位置（前頭断の模式図）</title><desc>視床の高さで大脳を前頭断にした模式図。中央に第三脳室があり、その両側に視床がある。視床のすぐ下に視床下部と視床下核がある。視床の外側に内包（後脚）が通り、さらに外側に淡蒼球、その外側に被殻が並ぶ。側脳室の外側壁に沿って尾状核がある。脳梁は側脳室の上にある。</desc>
