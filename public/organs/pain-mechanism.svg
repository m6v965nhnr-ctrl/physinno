<text x="170" y="508" text-anchor="start" dominant-baseline="central" font-size="13" fill="#185FA5" font-weight="500">C</text>
<rect x="40" y="322" width="120" height="46" rx="6" fill="#E3E1D6" stroke="#5F5E5A" stroke-width="1"/>
