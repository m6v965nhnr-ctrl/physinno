<rect x="313" y="182" width="144" height="48" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="385.0" y="206.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">髄板内核群</text>
<rect x="500" y="115" width="160" height="56" rx="6" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="580.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">第1次</text>
<text x="580.0" y="152.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">体性感覚野</text>
<text x="580" y="186" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#5F5E5A">識別性の感覚</text>
<rect x="500" y="205" width="160" height="56" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
