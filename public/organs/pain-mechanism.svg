<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>痛みの伝導路</title><desc>皮膚の自由神経終末（侵害受容器）から、Aδ線維（一次痛）とC線維（二次痛）が後根神経節を経て脊髄後角に入り、二次ニューロンに換わって脊髄内で対側へ交叉し、外側脊髄視床路は視床の腹側基底核群から第1次体性感覚野へ、前脊髄視床路は視床の髄板内核群から大脳辺縁系へ向かう（脳科学辞典の記述）。右下の表は一次痛（Aδ）と二次痛（C）の違いで、どちらの線維がどちらの路を通るかは図では区別していない。</desc>
<rect width="680" height="640" fill="#fff"/>
<defs><marker id="m0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker></defs>
<text x="150" y="20" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5F5E5A" font-weight="500">末梢・脊髄</text>
<text x="385" y="20" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5F5E5A" font-weight="500">視床</text>
<text x="580" y="20" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5F5E5A" font-weight="500">大脳</text>
<rect x="20" y="215" width="268" height="165" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="30" y="230" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">脊髄</text>
<rect x="20" y="540" width="200" height="56" rx="6" fill="#F4C0D1" stroke="#993556" stroke-width="1"/>
<text x="120.0" y="559.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">皮膚の侵害受容器</text>
<text x="120.0" y="577.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">（自由神経終末）</text>
<rect x="20" y="425" width="200" height="50" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
