<text x="100.0" y="353.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">（二次ニューロン）</text>
<path d="M100 425 L100 370" fill="none" stroke="#185FA5" stroke-width="2.5" marker-end="url(#m1)"/>
<path d="M80 322 C80 285 160 305 160 255 L160 150 L311 150" fill="none" stroke="#993C1D" stroke-width="2.5" marker-end="url(#m0)"/>
<path d="M125 322 C125 295 205 310 205 262 L205 205 L311 205" fill="none" stroke="#534AB7" stroke-width="2.5" marker-end="url(#m2)"/>
<circle cx="122" cy="296" r="6" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/>
<circle cx="172" cy="296" r="6" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/>
<text x="156" y="250" text-anchor="end" dominant-baseline="central" font-size="12" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">外側</text>
<text x="156" y="266" text-anchor="end" dominant-baseline="central" font-size="12" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">脊髄視床路</text>
<text x="212" y="250" text-anchor="start" dominant-baseline="central" font-size="12" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">前</text>
<text x="212" y="266" text-anchor="start" dominant-baseline="central" font-size="12" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">脊髄視床路</text>
<rect x="305" y="45" width="160" height="210" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="385" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="500">視床</text>
<rect x="313" y="125" width="144" height="48" rx="6" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
