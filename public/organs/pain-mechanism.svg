<text x="335.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#2C2C2A" font-weight="500"></text>
<rect x="372" y="330" width="136" height="28" rx="4" fill="#E3E1D6" stroke="#5F5E5A" stroke-width="1"/>
<text x="440.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#2C2C2A" font-weight="500">一次痛</text>
<rect x="510" y="330" width="148" height="28" rx="4" fill="#E3E1D6" stroke="#5F5E5A" stroke-width="1"/>
<text x="584.0" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#2C2C2A" font-weight="500">二次痛</text>
<rect x="300" y="360" width="70" height="28" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="335.0" y="374.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">線維</text>
<rect x="372" y="360" width="136" height="28" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="440.0" y="374.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">Aδ（有髄・細い）</text>
<rect x="510" y="360" width="148" height="28" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="584.0" y="374.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">C（無髄）</text>
<rect x="300" y="390" width="70" height="42" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="335.0" y="411.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">痛みの性質</text>
<rect x="372" y="390" width="136" height="42" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="440.0" y="404.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">針で刺すような</text>
<text x="440.0" y="420.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">鋭い痛み</text>
<rect x="510" y="390" width="148" height="42" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="584.0" y="404.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">内臓痛・癌痛・歯痛</text>
<text x="584.0" y="420.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">のような鈍い痛み</text>
<rect x="300" y="434" width="70" height="28" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="335.0" y="448.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">受容器</text>
<rect x="372" y="434" width="136" height="28" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="440.0" y="448.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">高閾値機械受容器</text>
<rect x="510" y="434" width="148" height="28" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="584.0" y="448.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">ポリモーダル受容器</text>
<rect x="300" y="464" width="70" height="28" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="335.0" y="478.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">伝導速度</text>
<rect x="372" y="464" width="136" height="28" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="440.0" y="478.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">約10〜20 m/s</text>
<rect x="510" y="464" width="148" height="28" rx="3" fill="#fff" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="584.0" y="478.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">約0.5〜2 m/s</text>
<text x="20" y="610" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">矢印は信号の向き。赤い丸は、脊髄の中で左右が入れ替わる場所。簡略化した模式図で、視床以降は一部を省略。</text><text x="20" y="628" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">Aδ線維の速度は出典により4〜36 m/sとも。Aδ・Cがどちらの路を通るかは区別していない。</text>
</svg>
