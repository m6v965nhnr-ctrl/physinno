<text x="380" y="270.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">④</text>
<circle cx="402" cy="334" r="11" fill="#fff" stroke="#2C2C2A" stroke-width="1.2"/>
<text x="402" y="334.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">⑤</text>
<circle cx="160" cy="262" r="11" fill="#fff" stroke="#2C2C2A" stroke-width="1.2"/>
<text x="160" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">⑥</text>
<text x="24" y="438" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">① 活動電位が軸索終末に到達する</text>
<text x="24" y="464" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">② 電位依存性Ca²⁺チャネルが開き、Ca²⁺が終末内に流入する</text>
<text x="24" y="490" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">③ シナプス小胞が前膜と融合し、神経伝達物質が間隙に放出される（開口放出）</text>
<text x="24" y="516" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">④ 伝達物質が間隙を拡散し、後膜の受容体に結合する</text>
<text x="24" y="542" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">⑤ 後膜の膜電位が変わる（脱分極＝EPSP、過分極＝IPSP）</text>
<text x="24" y="568" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">⑥ 伝達物質が、酵素による分解や、再取り込みで取り除かれる</text>
</svg>
