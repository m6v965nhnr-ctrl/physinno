<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" width="680" height="690" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>脳幹の高さ別の脳神経核（一覧）</title><desc>脳幹の高さ別の脳神経核の一覧。中脳には動眼神経核、滑車神経核、動眼神経副核（自律性）、三叉神経中脳路核がある。橋には外転神経核、三叉神経運動核、顔面神経核、三叉神経主知覚核、前庭神経核、蝸牛神経核がある。延髄には舌下神経核、疑核、迷走神経背側運動核（自律性）、孤束核、三叉神経脊髄路核がある。</desc>
<rect width="680" height="690" fill="#fff"/>
<rect x="20" y="40" width="640" height="104" rx="10" fill="#FAC775" fill-opacity="0.35" stroke="#854F0B" stroke-width="1"/>
<rect x="20" y="40" width="84" height="104" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="62" y="92" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#2C2C2A">中脳</text>
<rect x="120" y="52" width="252" height="36" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1"/>
<text x="246" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">動眼神経核（Ⅲ）</text>
<rect x="384" y="52" width="252" height="36" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1"/>
<text x="510" y="70" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">滑車神経核（Ⅳ）</text>
<rect x="120" y="96" width="252" height="36" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<text x="246" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">動眼神経副核（Ⅲ）</text>
<rect x="384" y="96" width="252" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="510" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">三叉神経中脳路核（Ⅴ）</text>
<rect x="20" y="176" width="640" height="148" rx="10" fill="#9FE1CB" fill-opacity="0.35" stroke="#0F6E56" stroke-width="1"/>
<rect x="20" y="176" width="84" height="148" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="62" y="250" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#2C2C2A">橋</text>
<rect x="120" y="188" width="252" height="36" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1"/>
<text x="246" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">外転神経核（Ⅵ）</text>
<rect x="384" y="188" width="252" height="36" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="510" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">三叉神経運動核（Ⅴ）</text>
<rect x="120" y="232" width="252" height="36" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="246" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">顔面神経核（Ⅶ）</text>
<rect x="384" y="232" width="252" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="510" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">三叉神経主知覚核（Ⅴ）</text>
<rect x="120" y="276" width="252" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="246" y="294" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">前庭神経核（Ⅷ）</text>
<rect x="384" y="276" width="252" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="510" y="294" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">蝸牛神経核（Ⅷ）</text>
<rect x="20" y="352" width="640" height="148" rx="10" fill="#F5C4B3" fill-opacity="0.35" stroke="#993C1D" stroke-width="1"/>
<rect x="20" y="352" width="84" height="148" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="62" y="426" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#2C2C2A">延髄</text>
<rect x="120" y="364" width="252" height="36" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1"/>
<text x="246" y="382" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">舌下神経核（Ⅻ）</text>
<rect x="384" y="364" width="252" height="36" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="510" y="382" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">疑核（Ⅸ・Ⅹ・Ⅺ）</text>
<rect x="120" y="408" width="252" height="36" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<text x="246" y="426" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">迷走神経背側運動核（Ⅹ）</text>
<rect x="384" y="408" width="252" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="510" y="426" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">孤束核（Ⅶ・Ⅸ・Ⅹ）</text>
<rect x="120" y="452" width="252" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="246" y="470" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">三叉神経脊髄路核（Ⅴ）</text>
<text x="24" y="554" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">色は核の性質：</text>
<rect x="24" y="565" width="22" height="18" rx="4" fill="#F4C0D1" stroke="#993556" stroke-width="1"/>
<text x="54" y="574" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">眼・舌を動かす核</text>
<rect x="200" y="565" width="22" height="18" rx="4" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="230" y="574" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">咀嚼・表情・咽頭喉頭を動かす核</text>
<rect x="24" y="591" width="22" height="18" rx="4" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<text x="54" y="600" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">自律性の核</text>
<rect x="200" y="591" width="22" height="18" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="230" y="600" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">感覚の核</text>
<text x="24" y="654" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">（ ）内はその核に関係する脳神経。上が吻側（頭側）、下が尾側。</text>
<text x="24" y="676" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">三叉神経中脳路核は橋の高さから中脳まで、三叉神経脊髄路核は延髄から第2頸髄まで伸びる。</text>
</svg>
