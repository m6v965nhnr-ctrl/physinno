<g font-size="12" fill="#2C2C2A" dominant-baseline="central"><text x="182" y="160" text-anchor="start">DNAの複製（S期）</text><text x="522" y="160" text-anchor="start">DNAの複製（S期）</text><text x="182" y="280" text-anchor="start">前期・中期</text><text x="182" y="400" text-anchor="start">後期・終期＋細胞質分裂</text><text x="522" y="280" text-anchor="start">第一減数分裂</text><text x="522" y="400" text-anchor="start">第二減数分裂</text></g>
<g font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central"><text x="170" y="52">染色体が複製される前の細胞（2n）</text><text x="510" y="52">生殖細胞のもとになる細胞（2n）</text><text x="170" y="300" dy="-2" fill="#5F5E5A" font-size="11"></text><text x="170" y="500">2個の二倍体の細胞（2n）</text><text x="510" y="500">4個の半数体の細胞（n）</text><text x="170" y="394" font-size="11" fill="#5F5E5A"></text><text x="522" y="295" font-size="11" fill="#5F5E5A" text-anchor="start">相同染色体が分かれる</text><text x="522" y="414" font-size="11" fill="#5F5E5A" text-anchor="start">染色分体が分かれる</text></g>
<g font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central"><text x="252" y="338">赤道面に整列</text></g>
<line x1="340" y1="40" x2="340" y2="520" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 4"/>
<text x="20" y="530" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">赤と青は、母方と父方の相同染色体です（長い2本が1対、短い2本が1対）。</text>
<text x="20" y="548" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">2本の棒が並んだ形は、複製された染色体（2本の染色分体）です。</text>
<text x="20" y="566" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">簡略図です。実際のヒトの体細胞は23対（46本）、精子・卵子は23本です。</text>
</svg>
