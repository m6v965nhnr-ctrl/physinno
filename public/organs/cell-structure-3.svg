<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 586" width="680" height="586" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>体細胞分裂と減数分裂の流れ（模式図）</title><desc>左は体細胞分裂。染色体が複製され、中期に赤道面に並び、後期に染色分体が分かれて、同じ染色体数の2個の細胞ができる。右は減数分裂。染色体が複製されたあと、第一減数分裂で相同染色体が分かれ、第二減数分裂で染色分体が分かれて、染色体数が半分の4個の細胞ができる。染色体は2対（4本）で示した簡略図。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2C2C2A"/></marker></defs><rect width="680" height="586" fill="#fff"/>
