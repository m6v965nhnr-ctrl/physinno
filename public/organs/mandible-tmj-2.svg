<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 730" width="680" height="730" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>顎関節の矢状断（口を閉じた状態・開けた状態・前方脱臼）</title>
<desc>顎関節を横から見た断面の模式図を3段に並べた図。顔は左向き。1段目は口を閉じた状態で、下顎頭と関節円板が側頭骨の下顎窩に収まり、前に関節結節がある。2段目は口を開けた状態で、下顎頭と関節円板がともに前方へ滑って関節結節の下に移り、下顎が下向きに回る。3段目は前方脱臼で、下顎頭が関節結節を越えてその前に外れる。</desc>
<rect width="680" height="730" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker></defs>
<text x="20" y="34" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="500" fill="#2C2C2A">① 口を閉じた状態</text>
<text x="20" y="264" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="500" fill="#2C2C2A">② 口を開けた状態</text>
<text x="20" y="494" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="500" fill="#2C2C2A">③ 前方脱臼（口が閉じなくなる）</text>
<g transform="translate(230 40)">
<path d="M0 105 C20 112 38 138 62 138 C84 138 92 104 118 96 C144 90 160 110 166 128 L172 128 L220 128 L220 0 L0 0 Z" fill="#9FE1CB" stroke="#2C2C2A" stroke-width="1.5"/>
<circle cx="196" cy="104" r="9" fill="#fff" stroke="#2C2C2A" stroke-width="1.3"/>
</g>
<g transform="translate(230 40) rotate(0 114 122)">
<path d="M97 130 L87 170 M131 130 L141 170" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
<path d="M97 130 L131 130 L141 170 L87 170 Z" fill="#B5D4F4" stroke="none"/>
<ellipse cx="114" cy="122" rx="28" ry="13" fill="#B5D4F4" stroke="#2C2C2A" stroke-width="1.5"/>
</g>
<ellipse cx="344" cy="144" rx="28" ry="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.3"/>
<g transform="translate(230 270)">
<path d="M0 105 C20 112 38 138 62 138 C84 138 92 104 118 96 C144 90 160 110 166 128 L172 128 L220 128 L220 0 L0 0 Z" fill="#9FE1CB" stroke="#2C2C2A" stroke-width="1.5"/>
<circle cx="196" cy="104" r="9" fill="#fff" stroke="#2C2C2A" stroke-width="1.3"/>
</g>
<g transform="translate(230 270) rotate(0 114 122)">


<ellipse cx="114" cy="122" rx="28" ry="13" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="5 4"/>
</g>
<g transform="translate(230 270) rotate(-20 66 160)">
<path d="M49 168 L39 208 M83 168 L93 208" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
<path d="M49 168 L83 168 L93 208 L39 208 Z" fill="#B5D4F4" stroke="none"/>
<ellipse cx="66" cy="160" rx="28" ry="13" fill="#B5D4F4" stroke="#2C2C2A" stroke-width="1.5"/>
</g>
<ellipse cx="295" cy="412" rx="26" ry="5" fill="#FAC775" stroke="#854F0B" stroke-width="1.3"/>
<line x1="334" y1="400" x2="310" y2="420" stroke="#A32D2D" stroke-width="2" marker-end="url(#ar)"/>
<g transform="translate(230 500)">
<path d="M0 105 C20 112 38 138 62 138 C84 138 92 104 118 96 C144 90 160 110 166 128 L172 128 L220 128 L220 0 L0 0 Z" fill="#9FE1CB" stroke="#2C2C2A" stroke-width="1.5"/>
<circle cx="196" cy="104" r="9" fill="#fff" stroke="#2C2C2A" stroke-width="1.3"/>
</g>
<g transform="translate(230 500) rotate(-25 22 152)">
<path d="M5 160 L-5 200 M39 160 L49 200" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
<path d="M5 160 L39 160 L49 200 L-5 200 Z" fill="#B5D4F4" stroke="none"/>
<ellipse cx="22" cy="152" rx="28" ry="13" fill="#B5D4F4" stroke="#2C2C2A" stroke-width="1.5"/>
</g>
<path d="M330 628 C310 670 280 670 270 658" fill="none" stroke="#A32D2D" stroke-width="2" marker-end="url(#ar)"/>
<g stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none">
<line x1="150" y1="80" x2="290" y2="80"/>
<line x1="150" y1="150" x2="280" y2="162"/>
<line x1="470" y1="74" x2="435" y2="140"/>
<line x1="470" y1="108" x2="380" y2="140"/>
<line x1="470" y1="144" x2="370" y2="146"/>
<line x1="470" y1="180" x2="368" y2="172"/>
<line x1="470" y1="215" x2="365" y2="200"/>
</g>
<text x="660" y="14" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">左が前（顔の側）、右が後ろ</text>
<text x="20" y="80" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">側頭骨</text>
<text x="20" y="150" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">関節結節（関節隆起）</text>
<text x="478" y="74" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">外耳孔</text>
<text x="478" y="108" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">下顎窩</text>
<text x="478" y="144" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">関節円板</text>
<text x="478" y="180" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">下顎頭</text>
<text x="478" y="215" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">下顎骨（関節突起）</text>
<g stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none">
<line x1="150" y1="380" x2="280" y2="392"/>
<line x1="470" y1="374" x2="320" y2="412"/>
<line x1="470" y1="420" x2="322" y2="438"/>
</g>
<text x="20" y="380" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">関節結節（関節隆起）</text>
<text x="478" y="374" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">関節円板</text>
<text x="478" y="420" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">下顎頭</text>
<text x="478" y="300" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#A32D2D">下顎頭と円板が前方へ滑る</text>
<text x="478" y="320" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">（点線＝閉口位の下顎頭）</text>
<text x="20" y="430" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#A32D2D">下顎は下向きに回る</text>
<g stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none">
<line x1="150" y1="610" x2="280" y2="622"/>
<line x1="470" y1="650" x2="266" y2="670"/>
</g>
<text x="20" y="610" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">関節結節（関節隆起）</text>
<text x="478" y="650" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">下顎頭（結節の前にはずれる）</text>
<text x="478" y="540" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">関節円板は省略</text>
</svg>