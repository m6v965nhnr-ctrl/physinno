<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>Papez回路（海馬から海馬へ戻る閉じた回路）</title><desc>海馬から脳弓、乳頭体、乳頭体視床路、視床前核、帯状回を経て、再び海馬へ戻る回路を、箱と矢印で示した模式図。</desc><rect width="680" height="420" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker></defs>
<rect x="60" y="60" width="190" height="70" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/><text x="155.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#2C2C2A">海馬</text>
<rect x="430" y="60" width="190" height="70" rx="10" fill="#F4C0D1" stroke="#993556" stroke-width="1.5"/><text x="525.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#2C2C2A">乳頭体</text>
<rect x="430" y="250" width="190" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text x="525.0" y="285.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#2C2C2A">視床前核</text>
<rect x="60" y="250" width="190" height="70" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="1.5"/><text x="155.0" y="276.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#2C2C2A">帯状回</text><text x="155.0" y="298.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5F5E5A">ブロードマン24野</text>
<g stroke="#2C2C2A" stroke-width="2" fill="none" marker-end="url(#ar)"><line x1="252" y1="95" x2="426" y2="95"/><line x1="525" y1="132" x2="525" y2="246"/><line x1="428" y1="285" x2="254" y2="285"/><line x1="155" y1="246" x2="155" y2="134"/></g>
<g font-size="14" fill="#2C2C2A" text-anchor="middle"><text x="340" y="82">脳弓</text><text x="540" y="195" text-anchor="start">乳頭体視床路</text><text x="155" y="205" text-anchor="start" dx="10">（帯状回から海馬へ）</text></g>
<g font-size="14" fill="#5F5E5A"><text x="20" y="362">※矢印は信号の流れの向き。Papezが、情動の回路として提唱した。</text><text x="20" y="384">※記憶の回路としても知られる（健忘症候群）。</text></g></svg>