<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>呼吸の調節の流れ（模式図）</title><desc>延髄と橋の呼吸中枢が、化学受容器、肺の伸展受容器、運動時の入力、大脳皮質、視床下部・辺縁系からの情報を受けて、脊髄を通じて横隔膜と外肋間筋を動かし、換気を調節する。換気による血液ガスの変化は化学受容器が感知し、呼吸中枢にもどる。</desc><rect width="680" height="520" fill="#fff"/><g font-size="14" fill="#2C2C2A" dominant-baseline="central"><rect x="30" y="20" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="180.0" y="42.0" text-anchor="middle" font-weight="500">大脳皮質：随意的な調節</text><rect x="350" y="20" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="500.0" y="42.0" text-anchor="middle" font-weight="500">視床下部・辺縁系：情動・痛み・体温</text><line x1="260" y1="64" x2="260.0" y2="93.0" stroke="#5F5E5A" stroke-width="1.8"/><polygon points="260,100 265.5,90.0 254.5,90.0" fill="#5F5E5A"/><line x1="420" y1="64" x2="420.0" y2="93.0" stroke="#5F5E5A" stroke-width="1.8"/><polygon points="420,100 425.5,90.0 414.5,90.0" fill="#5F5E5A"/><rect x="210" y="100" width="260" height="290" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/><text x="340" y="122" text-anchor="middle" font-weight="500">呼吸中枢</text><rect x="224" y="140" width="232" height="96" rx="8" fill="#fff" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="167.0" text-anchor="middle" font-weight="500">橋</text><text x="340.0" y="188.0" text-anchor="middle" >持続性吸息中枢・呼吸調節中枢</text><text x="340.0" y="209.0" text-anchor="middle" >吸息の深さと回数を調節</text><rect x="224" y="256" width="232" height="120" rx="8" fill="#fff" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="295.0" text-anchor="middle" font-weight="500">延髄</text><text x="340.0" y="316.0" text-anchor="middle" >背側呼吸群（入力を統合）</text><text x="340.0" y="337.0" text-anchor="middle" >腹側呼吸群（リズムをつくる）</text><line x1="318" y1="256" x2="318.0" y2="245.0" stroke="#534AB7" stroke-width="1.8"/><polygon points="318,238 312.5,248.0 323.5,248.0" fill="#534AB7"/><line x1="362" y1="238" x2="362.0" y2="249.0" stroke="#534AB7" stroke-width="1.8"/><polygon points="362,256 367.5,246.0 356.5,246.0" fill="#534AB7"/><rect x="20" y="104" width="172" height="70" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="30" y="128.5"  font-weight="500">肺伸展受容器</text><text x="30" y="149.5"  >肺の伸展→吸息を抑える</text><line x1="192" y1="139" x2="203.0" y2="139.0" stroke="#185FA5" stroke-width="1.8"/><polygon points="210,139 200.0,133.5 200.0,144.5" fill="#185FA5"/><rect x="20" y="184" width="172" height="70" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="30" y="208.5"  font-weight="500">運動時の入力</text><text x="30" y="229.5"  >運動の意志・固有受容器</text><line x1="192" y1="219" x2="203.0" y2="219.0" stroke="#185FA5" stroke-width="1.8"/><polygon points="210,219 200.0,213.5 200.0,224.5" fill="#185FA5"/><rect x="20" y="264" width="172" height="70" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="30" y="282.0"  font-weight="500">末梢化学受容器</text><text x="30" y="301.0"  >頸動脈小体・大動脈小体</text><text x="30" y="320.0"  >主に PaO₂↓で興奮</text><line x1="192" y1="299" x2="203.0" y2="299.0" stroke="#185FA5" stroke-width="1.8"/><polygon points="210,299 200.0,293.5 200.0,304.5" fill="#185FA5"/><rect x="20" y="344" width="172" height="70" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="30" y="368.5"  font-weight="500">中枢化学受容器（延髄）</text><text x="30" y="389.5"  >PaCO₂↑・H⁺↑で興奮</text><line x1="192" y1="379" x2="203.0" y2="379.0" stroke="#185FA5" stroke-width="1.8"/><polygon points="210,379 200.0,373.5 200.0,384.5" fill="#185FA5"/><line x1="470" y1="172" x2="493.0" y2="172.0" stroke="#5F5E5A" stroke-width="1.8"/><polygon points="500,172 490.0,166.5 490.0,177.5" fill="#5F5E5A"/><rect x="500" y="150" width="150" height="44" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><text x="575.0" y="172.0" text-anchor="middle" font-weight="500">脊髄</text><rect x="500" y="234" width="150" height="44" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><text x="575.0" y="256.0" text-anchor="middle" font-weight="500">横隔膜・外肋間筋</text><rect x="500" y="318" width="150" height="44" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><text x="575.0" y="340.0" text-anchor="middle" font-weight="500">換気（深さ・回数）</text><line x1="575" y1="194" x2="575.0" y2="227.0" stroke="#5F5E5A" stroke-width="1.8"/><polygon points="575,234 580.5,224.0 569.5,224.0" fill="#5F5E5A"/><line x1="575" y1="278" x2="575.0" y2="311.0" stroke="#5F5E5A" stroke-width="1.8"/><polygon points="575,318 580.5,308.0 569.5,308.0" fill="#5F5E5A"/><rect x="210" y="450" width="260" height="44" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1"/><text x="340.0" y="472.0" text-anchor="middle" font-weight="500">血液ガス：PaO₂・PaCO₂・pH</text><path d="M575 362 L575 472 L478 472" fill="none" stroke="#5F5E5A" stroke-width="1.8"/><polygon points="470,472 480,466.5 480,477.5" fill="#5F5E5A"/><path d="M210 472 L10 472 L10 299" fill="none" stroke="#993556" stroke-width="1.8"/><line x1="10" y1="379" x2="14" y2="379" stroke="#993556" stroke-width="1.8"/><line x1="10" y1="299" x2="13.0" y2="299.0" stroke="#993556" stroke-width="1.8"/><polygon points="20,299 10.0,293.5 10.0,304.5" fill="#993556"/><line x1="10" y1="379" x2="13.0" y2="379.0" stroke="#993556" stroke-width="1.8"/><polygon points="20,379 10.0,373.5 10.0,384.5" fill="#993556"/><text x="22" y="436" fill="#993556" font-weight="500">変化を化学受容器が感知（フィードバック）</text></g></svg>