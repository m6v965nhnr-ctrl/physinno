<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 830" width="680" height="830" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>主な静脈と門脈系（模式図）</title><desc>上半身の静脈血は上大静脈、下半身の静脈血は下大静脈に集まって右心房に入る。奇静脈（体の右側）と半奇静脈（左側）は胸壁などの血液を集めて上大静脈・腕頭静脈に入る。胃・小腸・大腸・脾臓などの血液は、上腸間膜静脈と脾静脈が合流した門脈を通って肝臓に入り、肝静脈から下大静脈へ出る。</desc>
