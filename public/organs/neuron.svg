<text x="24" y="281" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">　　　　　　　　　末梢神経系＝シュワン細胞（1つの細胞が1つの軸索の1つの節だけを包む）</text>
<text x="14" y="326" text-anchor="start" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">興奮の伝わり方</text>
<text x="14" y="358" text-anchor="start" dominant-baseline="central" font-size="14" fill="#854F0B" font-weight="500">有髄線維：跳躍伝導（絞輪から絞輪へ）</text>
