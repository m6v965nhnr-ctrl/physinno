<title>EPSP・IPSPと加重</title><desc>横軸は時間、縦軸は膜電位。EPSPが重なる加重で閾値−55 mVを超えると活動電位が起こる。IPSPは膜電位を静止膜電位より下げ、閾値から遠ざける。</desc>
