<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>卵胞の発育と黄体（卵巣内の変化）</title><desc>卵巣の中での卵胞の変化を順に並べた模式図。原始卵胞（卵母細胞を扁平な顆粒膜細胞1層が囲む）、一次卵胞（顆粒膜細胞が立方形になる）、二次卵胞（顆粒膜細胞が重なり、外側に莢膜細胞ができ、卵母細胞に透明帯ができる）、三次卵胞（卵胞腔ができる）、成熟卵胞（排卵直前の主席卵胞）。LHサージで排卵し、卵胞に残った細胞が黄体になってプロゲステロンを分泌し、妊娠しなければ白体になる。FSHは卵胞の発育を促す。</desc><defs><marker id="ah2C2C2A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker></defs><rect width="680" height="640" fill="#fff"/>
<circle cx="70" cy="150" r="13" fill="#fff" stroke="#854F0B" stroke-width="1.6" />
<circle cx="70" cy="150" r="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="70" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">原始卵胞</text>
<text x="70" y="240" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">顆粒膜細胞が</text>
<text x="70" y="258" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">扁平で1層</text>
<line x1="104" y1="150" x2="157" y2="150" stroke="#2C2C2A" stroke-width="1.6" marker-end="url(#ah2C2C2A)"/>
<circle cx="205" cy="150" r="19" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<circle cx="205" cy="150" r="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="205" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">一次卵胞</text>
<text x="205" y="240" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">顆粒膜細胞が</text>
<text x="205" y="258" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">立方形になる</text>
<line x1="239" y1="150" x2="292" y2="150" stroke="#2C2C2A" stroke-width="1.6" marker-end="url(#ah2C2C2A)"/>
<circle cx="340" cy="150" r="32" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<circle cx="340" cy="150" r="27" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<circle cx="340" cy="150" r="15" fill="#fff" stroke="#D4537E" stroke-width="1.6" />
<circle cx="340" cy="150" r="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="340" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">二次卵胞</text>
<text x="340" y="240" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">顆粒膜細胞が増える</text>
<text x="340" y="258" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">莢膜細胞ができる</text>
<text x="340" y="276" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">透明帯ができる</text>
<line x1="400" y1="150" x2="415" y2="150" stroke="#2C2C2A" stroke-width="1.6" marker-end="url(#ah2C2C2A)"/>
<circle cx="475" cy="150" r="46" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<circle cx="475" cy="150" r="40" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<ellipse cx="479" cy="148" rx="27" ry="25" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2" />
<circle cx="461" cy="168" r="14" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<circle cx="461" cy="168" r="9" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="475" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">三次卵胞</text>
<text x="475" y="236" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">（胞状卵胞）</text>
<text x="475" y="254" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">卵胞腔（卵胞液）</text>
<text x="475" y="272" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">が大きくなる</text>
<line x1="535" y1="150" x2="550" y2="150" stroke="#2C2C2A" stroke-width="1.6" marker-end="url(#ah2C2C2A)"/>
<circle cx="610" cy="150" r="52" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<circle cx="610" cy="150" r="46" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<ellipse cx="613" cy="148" rx="34" ry="32" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2" />
<circle cx="590" cy="172" r="15" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<circle cx="590" cy="172" r="9" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="610" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">成熟卵胞</text>
<text x="610" y="236" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">（主席卵胞）</text>
<text x="610" y="254" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">1個だけが残る</text>
<text x="610" y="272" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">排卵の直前</text>
<line x1="420" y1="76" x2="665" y2="76" stroke="#185FA5" stroke-width="2" />
<line x1="420" y1="76" x2="420" y2="88" stroke="#185FA5" stroke-width="2" />
<line x1="665" y1="76" x2="665" y2="88" stroke="#185FA5" stroke-width="2" />
<text x="490" y="32" text-anchor="middle" font-size="13.5" font-weight="500" fill="#185FA5" dominant-baseline="central">FSH：卵胞が育つ</text>
<text x="490" y="54" text-anchor="middle" font-size="13.5" font-weight="500" fill="#185FA5" dominant-baseline="central">LH：顆粒膜細胞・莢膜細胞のエストロゲン産生を促す</text>
<circle cx="130" cy="420" r="34" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<ellipse cx="136" cy="416" rx="17" ry="15" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2" />
<path d="M156,396 L174,382" stroke="#fff" stroke-width="7"/>
<circle cx="188" cy="368" r="9" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<circle cx="188" cy="368" r="13" fill="none" stroke="#854F0B" stroke-width="2" />
<text x="130" y="478" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">排卵</text>
<text x="130" y="500" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">LHサージで卵胞が破れ</text>
<text x="130" y="518" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">二次卵母細胞が出る</text>
<path d="M306,420 C300,390 326,380 340,386 C360,376 382,396 374,422 C384,446 356,460 340,452 C320,462 298,442 306,420Z" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<ellipse cx="340" cy="420" rx="10" ry="8" fill="#fff" stroke="#854F0B" stroke-width="1" />
<text x="340" y="478" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">黄体</text>
<text x="340" y="500" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">残った顆粒膜細胞・莢膜細胞が</text>
<text x="340" y="518" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">黄体化し、プロゲステロンを</text>
<text x="340" y="536" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">多く分泌する（LHの作用）</text>
<path d="M532,420 C532,406 558,400 568,414 C572,432 552,440 540,434 C534,430 532,426 532,420Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<text x="550" y="478" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">白体</text>
<text x="550" y="500" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">妊娠しないと黄体が</text>
<text x="550" y="518" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">退縮して白体になる</text>
<line x1="450" y1="420" x2="520" y2="420" stroke="#2C2C2A" stroke-width="1.6" marker-end="url(#ah2C2C2A)"/>
<line x1="205" y1="420" x2="296" y2="420" stroke="#2C2C2A" stroke-width="1.6" marker-end="url(#ah2C2C2A)"/>
<path d="M610,306 L610,334 L130,334 L130,366" fill="none" stroke="#2C2C2A" stroke-width="1.6" marker-end="url(#ah2C2C2A)"/>
<text x="370" y="320" text-anchor="middle" font-size="13.5" font-weight="500" fill="#A32D2D" dominant-baseline="central">LHサージ</text>
<circle cx="120" cy="612" r="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="134" y="612" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">卵母細胞</text>
<circle cx="250" cy="612" r="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="264" y="612" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">顆粒膜細胞</text>
<circle cx="380" cy="612" r="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="394" y="612" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">莢膜細胞</text>
<circle cx="510" cy="612" r="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2" />
<text x="524" y="612" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">卵胞腔</text>
</svg>
