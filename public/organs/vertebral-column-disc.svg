<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 740" width="680" height="740" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>脊柱を横から見た模式図（区分と生理的弯曲）</title><desc>成人の脊柱を側面（左が前）から見た模式図。上から頸椎7個（C1〜C7）、胸椎12個（T1〜T12）、腰椎5個（L1〜L5）、仙骨（5個の仙椎が癒合）、尾骨（尾椎が癒合）が並ぶ。椎骨の間には椎間板がある。側面から見ると、頸部は前方に凸（前弯）、胸部は後方に凸（後弯）、腰部は前方に凸（前弯）、仙骨部は後方に凸（後弯）のS字状の弯曲をもつ。</desc><rect width="680" height="740" fill="#fff"/><rect x="282.8" y="62" width="22" height="8" rx="3" fill="#fff" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="3 2" transform="rotate(21.7 293.8 66)"/>
