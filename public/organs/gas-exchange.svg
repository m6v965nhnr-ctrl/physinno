<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>外呼吸と内呼吸のガスの動き（模式図）</title><desc>外呼吸では、酸素が肺胞気から肺毛細血管の血液へ、二酸化炭素が血液から肺胞気へ、分圧の高い方から低い方へ拡散する。内呼吸では、酸素が血液から組織へ、二酸化炭素が組織から血液へ移る。分圧の単位はmmHg。</desc><rect width="680" height="440" fill="#fff"/><g font-size="14" fill="#2C2C2A" dominant-baseline="central">
<text x="30" y="30" font-weight="500" font-size="15">外呼吸（肺：肺胞と血液のあいだ）　分圧の単位は mmHg</text>
<rect x="30" y="50" width="230" height="100" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="44" y="74" font-weight="500">肺胞気</text><text x="44" y="100" >PO₂ 約104</text><text x="44" y="126" >PCO₂ 約40</text><rect x="360" y="50" width="290" height="100" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><text x="374" y="74" font-weight="500">肺毛細血管の血液</text><text x="374" y="100" >流入時（静脈血）PO₂ 約40・PCO₂ 約45</text><text x="374" y="126" >流出時（肺静脈）PO₂ 約100</text>
<line x1="270" y1="84" x2="342" y2="84" stroke="#185FA5" stroke-width="2.4"/><polygon points="350,84 341,78 341,90" fill="#185FA5"/><text x="310.0" y="66" text-anchor="middle" fill="#185FA5" font-weight="500">O₂</text><line x1="350" y1="126" x2="278" y2="126" stroke="#993C1D" stroke-width="2.4"/><polygon points="270,126 279,120 279,132" fill="#993C1D"/><text x="310.0" y="146" text-anchor="middle" fill="#993C1D" font-weight="500">CO₂</text>
<text x="30" y="178">分圧差は O₂ が約64、CO₂ が約5。CO₂ は溶けやすさが酸素の約20倍なので、同じ程度の量が移る。</text>
<text x="30" y="236" font-weight="500" font-size="15">内呼吸（組織：血液と組織のあいだ）</text>
<rect x="30" y="256" width="230" height="100" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><text x="44" y="280" font-weight="500">組織</text><text x="44" y="306" >PO₂ 約40</text><text x="44" y="332" >PCO₂ は血液より高い</text><rect x="360" y="256" width="290" height="100" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><text x="374" y="280" font-weight="500">毛細血管の血液</text><text x="374" y="306" >流入時（動脈血）PO₂ 約100</text><text x="374" y="332" >流出時（静脈血）PO₂ 約40・PCO₂ 約45</text>
<line x1="350" y1="290" x2="278" y2="290" stroke="#185FA5" stroke-width="2.4"/><polygon points="270,290 279,284 279,296" fill="#185FA5"/><text x="310.0" y="272" text-anchor="middle" fill="#185FA5" font-weight="500">O₂</text><line x1="270" y1="332" x2="342" y2="332" stroke="#993C1D" stroke-width="2.4"/><polygon points="350,332 341,326 341,338" fill="#993C1D"/><text x="310.0" y="352" text-anchor="middle" fill="#993C1D" font-weight="500">CO₂</text>
<text x="30" y="386">どちらも、エネルギーを使わない単純拡散で、分圧の高い方から低い方へ移る。</text><text x="30" y="412">活動している筋では、組織の PO₂ が約20まで下がり、血液から出る酸素が増える。</text></g></svg>