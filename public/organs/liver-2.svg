<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>肝小葉の血液と胆汁の流れ（模式図）</title><desc>六角形の肝小葉の周辺の3か所に、門脈の枝・肝動脈の枝・胆管からなる門脈三管がある。門脈の枝と肝動脈の枝の血液は類洞で混ざり、小葉の中心の中心静脈へ流れ、肝静脈を経て下大静脈へ向かう。胆汁は毛細胆管を通って、血液とは逆向きに周辺の胆管へ流れる。</desc><rect width="680" height="560" fill="#fff"/>
<defs><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#185FA5"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0F6E56"/></marker></defs>
<polygon points="320,60 460,140 460,300 320,380 180,300 180,140" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/>
<g stroke="#185FA5" stroke-width="2.5" fill="none"><line x1="313" y1="94" x2="313" y2="192" marker-end="url(#ab)"/><line x1="429" y1="275" x2="348" y2="228" marker-end="url(#ab)"/><line x1="218" y1="287" x2="299" y2="240" marker-end="url(#ab)"/></g>
<g stroke="#0F6E56" stroke-width="2" fill="none" stroke-dasharray="6 3"><line x1="329" y1="190" x2="329" y2="98" marker-end="url(#ag)"/><line x1="341" y1="243" x2="418" y2="287" marker-end="url(#ag)"/><line x1="290" y1="227" x2="213" y2="271" marker-end="url(#ag)"/></g>
<circle cx="320" cy="68" r="15" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><circle cx="300" cy="64" r="5" fill="#E24B4A" stroke="#A32D2D" stroke-width="0.6"/><circle cx="340" cy="64" r="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><circle cx="448" cy="294" r="15" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><circle cx="461" cy="279" r="5" fill="#E24B4A" stroke="#A32D2D" stroke-width="0.6"/><circle cx="441" cy="313" r="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><circle cx="192" cy="294" r="15" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><circle cx="199" cy="313" r="5" fill="#E24B4A" stroke="#A32D2D" stroke-width="0.6"/><circle cx="179" cy="279" r="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<circle cx="320" cy="220" r="29" fill="#fff" stroke="#185FA5" stroke-width="2.5"/>
<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central"><text x="320" y="220" text-anchor="middle" font-size="12">中心静脈</text><text x="20" y="60">門脈三管（周辺の3か所）</text><text x="20" y="82" font-size="12" fill="#5F5E5A">青の大きな円：門脈の枝</text><text x="20" y="100" font-size="12" fill="#5F5E5A">赤の小さな円：肝動脈の枝</text><text x="20" y="118" font-size="12" fill="#5F5E5A">緑の円：胆管</text><text x="486" y="200" fill="#185FA5">青の矢印：血液の流れ</text><text x="486" y="226" fill="#0F6E56">緑の点線：胆汁の流れ</text><text x="486" y="248" font-size="12" fill="#5F5E5A">（肝細胞の間の毛細胆管を通る）</text><text x="486" y="290" font-size="12" fill="#5F5E5A">矢印のあいだの肝細胞が並ぶ</text><text x="486" y="308" font-size="12" fill="#5F5E5A">場所に、類洞（血液腔）がある</text></g>
<g font-size="13" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><text x="20" y="430">血液：門脈・肝動脈 → 類洞 → 中心静脈 → 肝静脈 → 下大静脈</text><text x="20" y="455">胆汁：肝細胞 → 毛細胆管 → 周辺の胆管 → 肝管（血液とは逆向き）</text></g>
<text x="20" y="500" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">門脈三管は周辺に多数あり、図には3か所だけ示しています。六角形は模式的な形です。</text>
</svg>