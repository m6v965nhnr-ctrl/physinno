<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>手根管の断面（模式図）</title><desc>右手の手根管の断面の模式図。上が手のひら側、下が手の甲側、左が母指側、右が小指側。手根骨（大菱形骨・小菱形骨・有頭骨・有鉤骨）がU字の壁と床をつくり、母指側の大菱形骨結節と小指側の有鉤骨鉤の間に、屈筋支帯が屋根のように張られる。この管の中を、正中神経と9本の屈筋腱が通る。尺骨神経は屈筋支帯の手のひら側を通り、手根管の外にある。</desc><rect width="680" height="450" fill="#fff"/><text x="340" y="28" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">手根管の断面（右手・手のひらを上）</text>
<text x="340" y="62" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">掌側（手のひら側）</text>
<g transform="translate(70,0)">
