<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>足のアーチ：内側縦アーチと外側縦アーチ（模式図）</title><desc>足を内側から見た図（上）と外側から見た図（下）。内側縦アーチは、踵骨・距骨・舟状骨・楔状骨・中足骨（第1〜3）でつくられ、距骨が頂点にあり、後ろは踵骨、前は中足骨頭が地面で支える。外側縦アーチは、踵骨・立方骨・中足骨（第4・5）でつくられ、内側より低く平ら。踵骨の内側に、距骨を支える載距突起。</desc>
