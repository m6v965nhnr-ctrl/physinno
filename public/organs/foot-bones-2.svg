<path d="M 92,246 C 104,150 130,100 160,98 C 200,96 230,112 262,126 C 330,150 410,190 476,232" fill="none" stroke="#A32D2D" stroke-width="2.4" stroke-dasharray="7 4"/>
<line x1="50" y1="612" x2="620" y2="612" stroke="#888780" stroke-width="1.4"/>
<polygon points="78,612 78,560 100,524 148,510 192,518 214,560 218,612" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" stroke-linejoin="round"/>
