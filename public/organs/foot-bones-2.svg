<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">
<text x="40" y="28" text-anchor="start" font-size="14" fill="#2C2C2A" font-weight="500">内側から見た足（内側縦アーチ）</text>
<text x="330" y="108" text-anchor="middle" font-size="14" fill="#A32D2D" font-weight="500">内側縦アーチ</text>
<text x="60" y="300" text-anchor="end">踵骨</text>
<text x="100" y="70" text-anchor="end">距骨</text>
<text x="150" y="300" text-anchor="end">載距突起</text>
<text x="250" y="320" text-anchor="end">舟状骨</text>
<text x="330" y="320" text-anchor="end">内側楔状骨</text>
<text x="450" y="320" text-anchor="end">第1中足骨</text>
<text x="60" y="330" text-anchor="end">踵骨隆起</text>
<text x="40" y="376" text-anchor="start" font-size="12" fill="#5F5E5A">アーチの前の端（中足骨頭）と後ろの端（踵骨）が地面で支える。足底の靱帯が、前後の端を結び付ける。</text>
<text x="40" y="410" text-anchor="start" font-size="14" fill="#2C2C2A" font-weight="500">外側から見た足（外側縦アーチ）</text>
<text x="400" y="520" text-anchor="middle" font-size="14" fill="#A32D2D" font-weight="500">外側縦アーチ（内側より低く平ら）</text>
<text x="60" y="648" text-anchor="end">踵骨</text>
<text x="250" y="648" text-anchor="end">立方骨</text>
<text x="440" y="648" text-anchor="end">第5中足骨</text>
<text x="146" y="484" text-anchor="middle" font-size="12" fill="#534AB7">距骨（上に重なる）</text>
<text x="78" y="676" text-anchor="start" font-size="13" fill="#5F5E5A">近位（かかと）</text>
<text x="560" y="676" text-anchor="end" font-size="13" fill="#5F5E5A">遠位（つま先）</text>
</g>
</svg>
