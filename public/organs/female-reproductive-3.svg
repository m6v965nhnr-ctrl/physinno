<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>乳房の構造（側面の断面）</title><desc>乳房を横から見た断面の模式図（左が胸壁、右が乳頭）。乳房は主に脂肪組織と結合組織で、その中に乳腺が放射状に並ぶ。乳腺は十数個の葉に分かれ、葉の中の腺房（乳汁をつくる細胞のかたまり）から出る乳管が乳頭に向かって集まり、乳頭近くで乳管洞になって乳頭に開く。乳頭のまわりの色素の濃い部分が乳輪。乳房提靱帯が乳房の組織を皮膚の真皮につなぐ。</desc><rect width="680" height="440" fill="#fff"/>
