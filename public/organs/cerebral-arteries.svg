<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>大脳動脈輪（ウィリス動脈輪）と椎骨動脈・脳底動脈</title>
<desc>脳を下から見た模式図。上が前、下が後ろ。左右の内頸動脈から前大脳動脈と中大脳動脈が出て、左右の前大脳動脈は前交通動脈でつながる。左右の椎骨動脈が合流して脳底動脈になり、脳底動脈は左右の後大脳動脈に分かれる。後大脳動脈と内頸動脈の末端は後交通動脈でつながり、輪になる。脳底動脈の枝として上小脳動脈と前下小脳動脈、椎骨動脈の枝として後下小脳動脈を示す。</desc>
