<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>ストレスに対する副腎の反応（短期と長期）</title><desc>短期のストレスでは、視床下部から交感神経を介して副腎髄質が刺激され、アドレナリンとノルアドレナリンが出て、心拍数と血圧の上昇、気管支の拡張、血糖の上昇などが起こる。長期のストレスでは、視床下部のCRHが下垂体前葉のACTHを増やし、ACTHが副腎皮質のコルチゾールを増やして、血糖の上昇、脂肪・筋タンパクの異化、免疫と炎症の抑制などが起こる。コルチゾールは視床下部と下垂体に負のフィードバックをかける。</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#854F0B"/></marker></defs><rect width="680" height="560" fill="#fff"/><rect x="180" y="16" width="320" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="340" y="36" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">ストレス（身体的・精神的）</text><path d="M270 58 L170 100" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><path d="M410 58 L510 100" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><text x="20" y="86" font-size="13" font-weight="500" fill="#993C1D" dominant-baseline="central">短期（警告反応）</text><text x="660" y="86" text-anchor="end" font-size="13" font-weight="500" fill="#185FA5" dominant-baseline="central">長期</text><rect x="20" y="102" width="300" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="170.0" y="124" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">視床下部</text><path d="M170.0 148 L170.0 176" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><text x="180.0" y="162" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">交感神経（胸髄からの神経）</text><rect x="20" y="178" width="300" height="44" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/><text x="170.0" y="200" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">副腎髄質</text><path d="M170.0 224 L170.0 254" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="20" y="256" width="300" height="44" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/><text x="170.0" y="278" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">アドレナリン・ノルアドレナリン</text><path d="M170.0 302 L170.0 330" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="20" y="332" width="300" height="176" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="170.0" y="352" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">主な作用</text><text x="36" y="380" font-size="13" fill="#2C2C2A" dominant-baseline="central">心拍数↑・血圧↑</text><text x="36" y="401" font-size="13" fill="#2C2C2A" dominant-baseline="central">気管支の拡張</text><text x="36" y="422" font-size="13" fill="#2C2C2A" dominant-baseline="central">肝・骨格筋のグリコーゲン分解→血糖↑</text><text x="36" y="443" font-size="13" fill="#2C2C2A" dominant-baseline="central">内臓・皮膚の血管収縮</text><text x="36" y="464" font-size="13" fill="#2C2C2A" dominant-baseline="central">骨格筋の血管拡張</text><text x="36" y="485" font-size="13" fill="#2C2C2A" dominant-baseline="central">脂肪分解</text><rect x="360" y="102" width="300" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="510.0" y="124" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">視床下部</text><path d="M510.0 148 L510.0 176" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><text x="520.0" y="162" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">CRH</text><rect x="360" y="178" width="300" height="44" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><text x="510.0" y="200" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">下垂体前葉</text><path d="M510.0 224 L510.0 254" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><text x="520.0" y="240" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">ACTH</text><rect x="360" y="256" width="300" height="44" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="510.0" y="278" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">副腎皮質（束状層）</text><path d="M510.0 302 L510.0 330" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><text x="520.0" y="316" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">コルチゾール</text><rect x="360" y="332" width="300" height="176" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="510.0" y="352" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">主な作用</text><text x="376" y="380" font-size="13" fill="#2C2C2A" dominant-baseline="central">肝の糖新生・グリコーゲン分解→血糖↑</text><text x="376" y="401" font-size="13" fill="#2C2C2A" dominant-baseline="central">脂肪・筋タンパクの異化</text><text x="376" y="422" font-size="13" fill="#2C2C2A" dominant-baseline="central">免疫・炎症の抑制</text><text x="376" y="443" font-size="13" fill="#2C2C2A" dominant-baseline="central">循環血液量・血圧の維持</text><path d="M660 278 L674 278 L674 124 L662 124" fill="none" stroke="#A32D2D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><path d="M674 200 L662 200" fill="none" stroke="#A32D2D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="340" y="538" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">コルチゾールは視床下部と下垂体に負のフィードバック（点線）をかける</text></svg>