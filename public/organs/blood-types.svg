<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>ABO式血液型の抗原と抗体、赤血球の凝集の表</title><desc>A型は赤血球にA抗原、血漿に抗B抗体をもつ。B型は赤血球にB抗原、血漿に抗A抗体をもつ。AB型は赤血球にA抗原とB抗原の両方をもち、血漿に抗A・抗Bのどちらの抗体もない。O型は赤血球にA・B抗原がなく、血漿に抗A抗体と抗B抗体の両方をもつ。供血者の赤血球の抗原と、受血者の血漿の抗体が合うと凝集する。</desc>
