<text x="34" y="582" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Rh式：D抗原がある＝Rh陽性、ない＝Rh陰性（Rhマイナス）</text>
<text x="34" y="604" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">ABOと違い、Rhには生まれつきの抗体（規則抗体）がなく、</text>
<text x="34" y="622" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">輸血や妊娠で抗原にふれると抗体がつくられる（感作）。</text>
<text x="20" y="672" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">模式図。赤血球の凝集だけを示した表で、実際の輸血はABO同型が原則。Rhや不規則抗体も確認する。</text>
