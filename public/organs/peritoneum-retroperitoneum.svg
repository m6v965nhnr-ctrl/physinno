<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" width="680" height="570" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>腹膜と後腹膜器官の位置関係（矢状断の模式図）</title><desc>腹部を横から見た正中矢状断の模式図。左が前。腹膜腔の中に、胃・横行結腸・小腸が腹膜内器官として間膜や網でつながって入っている。後壁の壁側腹膜の後ろ（後腹膜腔）に、膵臓・十二指腸・腹大動脈と下大静脈がある。</desc><rect width="680" height="570" fill="#fff"/>
