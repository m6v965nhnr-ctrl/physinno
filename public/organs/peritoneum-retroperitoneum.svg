<text x="20" y="520" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">青い線が腹膜、緑が腹膜内器官、橙が後腹膜器官です。左が前。胃・横行結腸・小腸の位置関係は簡略化した模式図です。</text>
<text x="20" y="540" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">正中より外側にある腎臓・副腎・上行結腸・下行結腸は、次の水平断の図に示します。</text>
