<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 586" width="680" height="586" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>前庭神経核からの出力と前庭動眼反射</title><desc>前庭器官から前庭神経を通って脳幹の前庭神経核に入り、そこから眼球運動の神経核（動眼・滑車・外転神経核。前庭動眼反射）、脊髄（前庭脊髄路。姿勢・平衡）、小脳、網様体、視床を経て大脳皮質（平衡の意識的な知覚。OpenStaxの記述で、北大の教科書では皮質への投射系は不明とされる）へ出力が向かう流れ図。</desc>
<rect width="680" height="586" fill="#fff"/>
<rect x="20" y="30" width="210" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/><text x="125.0" y="49.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">前庭器官</text><text x="125.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">半規管・耳石器</text><rect x="20" y="126" width="210" height="56" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><text x="125.0" y="145.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">前庭神経</text><text x="125.0" y="165.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">内耳神経の一部</text><rect x="20" y="222" width="210" height="70" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="125.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">前庭神経核</text><text x="125.0" y="268.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">脳幹（橋〜延髄）</text><line x1="125" y1="86" x2="125.0" y2="117.0" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="125,126 120.0,117.0 130.0,117.0" fill="#5F5E5A"/><line x1="125" y1="182" x2="125.0" y2="213.0" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="125,222 120.0,213.0 130.0,213.0" fill="#5F5E5A"/><rect x="300" y="20" width="340" height="68" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="470" y="37" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">動眼・滑車・外転神経の核</text><text x="470" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">内側縦束で連絡 → 眼球運動</text><text x="470" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">前庭動眼反射</text><line x1="230" y1="257" x2="297.0660838501254" y2="62.50835683463645" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="300,54 301.8,64.1 292.3,60.9" fill="#5F5E5A"/><rect x="300" y="112" width="340" height="68" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="470" y="129" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">脊髄</text><text x="470" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">前庭脊髄路（外側前庭神経核から）</text><text x="470" y="168" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">姿勢・平衡の保持</text><line x1="230" y1="257" x2="295.19922484628427" y2="153.61265774374925" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="300,146 299.4,156.3 291.0,150.9" fill="#5F5E5A"/><rect x="300" y="204" width="340" height="68" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/><text x="470" y="221" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">小脳</text><text x="470" y="242" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">前庭神経から直接も入る</text><text x="470" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">平衡情報をもとに運動を開始</text><line x1="230" y1="257" x2="291.3142685286852" y2="240.35755568507116" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="300,238 292.6,245.2 290.0,235.5" fill="#5F5E5A"/><rect x="300" y="296" width="340" height="68" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/><text x="470" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">網様体</text><text x="470" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">呼吸・循環への影響</text><line x1="230" y1="257" x2="293.77091925989464" y2="323.5039586567473" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="300,330 290.2,327.0 297.4,320.0" fill="#5F5E5A"/><rect x="300" y="388" width="340" height="68" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="470" y="412" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">視床 → 大脳皮質</text><text x="470" y="436" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">平衡の意識的な知覚（OpenStaxの記述）</text><line x1="230" y1="257" x2="296.4850513782945" y2="413.71476396312266" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="300,422 291.9,415.7 301.1,411.8" fill="#5F5E5A"/><text x="20" y="480" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">前庭動眼反射：頭が動くと、眼を頭の動きと反対の向きに動かして、網膜の像を安定させる。</text><text x="20" y="504" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">眼振：前庭の障害で起こる。ゆっくり一方へ動く相（緩徐相）と、素早く戻る相（急速相）があり、</text><text x="20" y="526" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">眼振の向きは急速相の向きで表す。</text><text x="20" y="556" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">経路を単純化した模式図です。核の位置・太さ・形は実物と異なります。</text>
<text x="20" y="574" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視床・大脳皮質への経路は、北大の教科書では「大脳皮質への投射系は不明」とされ、記述が分かれる。</text>
</svg>
