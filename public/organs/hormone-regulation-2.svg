<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>ホルモンの受容体と作用のしくみ（水溶性と脂溶性）</title><desc>左は水溶性ホルモン（ペプチド・タンパク質・カテコールアミン）で、細胞膜の受容体に結合し、Gタンパク質を介してcAMPなどの第2メッセンジャーが作られ、タンパク質のリン酸化で細胞が反応する。右は脂溶性ホルモン（ステロイド・甲状腺ホルモン）で、細胞膜を通って細胞内の受容体に結合し、DNAに結合して遺伝子の転写を起こし、タンパク質が合成される。</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#854F0B"/></marker></defs><rect width="680" height="520" fill="#fff"/><text x="170.0" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A" dominant-baseline="central">水溶性ホルモン</text><text x="170.0" y="46" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">ペプチド・タンパク質・カテコールアミン</text><rect x="20" y="150" width="300" height="300" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><rect x="50" y="176" width="240" height="50" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="170.0" y="193" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">細胞膜の受容体に結合</text><text x="170.0" y="212" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">（Gタンパク質が活性化）</text><path d="M170.0 228 L170.0 242" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="50" y="244" width="240" height="50" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="170.0" y="261" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">アデニル酸シクラーゼ</text><text x="170.0" y="280" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">→ cAMP（第2メッセンジャー）</text><path d="M170.0 296 L170.0 310" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="50" y="312" width="240" height="50" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="170.0" y="329" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">プロテインキナーゼ</text><text x="170.0" y="348" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">→ タンパク質のリン酸化</text><path d="M170.0 364 L170.0 378" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="50" y="380" width="240" height="50" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="170.0" y="397" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">細胞の反応</text><text x="170.0" y="416" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">（酵素の活性化など）</text><text x="170.0" y="468" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">例：グルカゴン・TSH・カルシトニン（cAMP）</text><text x="170.0" y="486" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">cAMPはすぐ分解され、反応は短時間</text><circle cx="170" cy="112" r="14" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.4"/><text x="196" y="112" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">ホルモン</text><rect x="148" y="142" width="44" height="16" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="60" y="128" font-size="12.5" font-weight="500" fill="#185FA5" dominant-baseline="central">膜受容体</text><path d="M104 128 L148 148" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><path d="M170 128 L170 140" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><circle cx="420" cy="112" r="14" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.4"/><text x="444" y="112" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">ホルモン</text><text x="444" y="132" font-size="11.5" fill="#5F5E5A" dominant-baseline="central">血中では輸送タンパクと結合</text><path d="M420 128 L420 168" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><text x="510.0" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A" dominant-baseline="central">脂溶性ホルモン</text><text x="510.0" y="46" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">ステロイド・甲状腺ホルモン</text><rect x="360" y="150" width="300" height="300" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><rect x="390" y="176" width="240" height="50" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/><text x="510.0" y="193" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">細胞膜を通過して</text><text x="510.0" y="212" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">細胞内に入る</text><path d="M510.0 228 L510.0 242" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="390" y="244" width="240" height="50" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/><text x="510.0" y="269" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">細胞内（核内）受容体に結合</text><path d="M510.0 296 L510.0 310" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="390" y="312" width="240" height="50" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/><text x="510.0" y="329" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">DNAに結合して</text><text x="510.0" y="348" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">遺伝子の転写を起こす</text><path d="M510.0 364 L510.0 378" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="390" y="380" width="240" height="50" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/><text x="510.0" y="405" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">mRNA → タンパク質の合成</text><text x="510.0" y="468" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">例：コルチゾール・アルドステロン・</text><text x="510.0" y="486" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">性ホルモン・T3・T4</text><text x="510.0" y="504" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">作用の発現も消失も、ゆっくり</text></svg>