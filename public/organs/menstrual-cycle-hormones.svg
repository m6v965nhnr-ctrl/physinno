<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>月経周期と性ホルモンの変化（模式図）</title><desc>28日周期の例で、月経開始日を1日目として時間軸をそろえた模式図。上から、卵巣周期（卵胞期・黄体期）と月経周期（月経期・増殖期・分泌期）、下垂体ホルモン（FSHは周期の初めにわずかに上がり、LHは排卵の直前に急上昇する）、卵巣ホルモン（エストロゲンは排卵の前に高まり、黄体期にもう一度高まる。プロゲステロンは排卵後の黄体期だけ高い）、子宮内膜の厚さ（月経期に薄くなり、増殖期に厚くなり、分泌期にさらに厚くなる）、基礎体温（卵胞期は低く、排卵後の黄体期は少し高い二相性）。数値は示さず、傾向だけを表す。</desc><rect width="680" height="640" fill="#fff"/>
