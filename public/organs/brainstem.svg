<line x1="504" y1="334" x2="417" y2="316" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="417" cy="316" r="2.2" fill="#2C2C2A"/><text x="508" y="334" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">舌咽神経（Ⅸ）</text>
