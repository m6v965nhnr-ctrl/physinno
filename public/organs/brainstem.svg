<line x1="504" y1="390" x2="415" y2="360" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="415" cy="360" r="2.2" fill="#2C2C2A"/><text x="508" y="390" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">副神経（Ⅺ）</text>
