<line x1="216" y1="62" x2="304" y2="70" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="304" cy="70" r="2.2" fill="#2C2C2A"/><text x="212" y="62" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">大脳脚</text>
<line x1="216" y1="108" x2="337" y2="128" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="337" cy="128" r="2.2" fill="#2C2C2A"/><text x="212" y="108" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">脚間窩</text>
