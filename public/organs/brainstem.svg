<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 602" width="680" height="602" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>脳幹を前面から見た模式図（中脳・橋・延髄と出る脳神経）</title><desc>脳幹を前から見た模式図。上から中脳（左右の大脳脚とその間の脚間窩）、橋（横縞のある膨らみと中小脳脚）、延髄（錐体、オリーブ、下端の錐体交叉）が並び、脊髄へ続く。脳神経が出る位置として、動眼神経は脚間窩、三叉神経は橋の外側、外転神経は橋と延髄の境の正中付近、顔面神経と内耳神経は橋と延髄の境の外側、舌咽神経・迷走神経・副神経はオリーブの背側、舌下神経はオリーブと錐体の間を示す。滑車神経は背側から出るため描いていない。</desc>
