<text x="24" y="556" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">滑車神経（Ⅳ）は背側から出るため、この前面図には現れない。赤い丸は脳神経が脳幹から出る位置。</text>
<text x="24" y="580" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">顔面神経（Ⅶ）と内耳神経（Ⅷ）の並びは出典に細かい記述がなく、概略。</text>
