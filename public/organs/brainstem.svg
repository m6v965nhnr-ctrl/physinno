<line x1="216" y1="392" x2="284" y2="392" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="284" cy="392" r="2.2" fill="#2C2C2A"/><text x="212" y="392" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">オリーブ</text>
