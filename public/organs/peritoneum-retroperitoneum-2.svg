<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">
<text x="340" y="398" text-anchor="middle" font-size="12">腰椎</text>
<g text-anchor="end"><text x="92" y="110">壁側腹膜</text><text x="92" y="150">肝臓</text><text x="92" y="240">十二指腸</text><text x="92" y="302">上行結腸</text><text x="92" y="352">右腎</text></g>
<g text-anchor="start"><text x="590" y="150">胃</text><text x="590" y="205">腸間膜</text><text x="590" y="250">膵臓</text><text x="590" y="302">下行結腸</text><text x="590" y="352">左腎</text></g>
<text x="340" y="30" text-anchor="middle">小腸・結腸（腹膜内器官）</text><text x="250" y="482" text-anchor="middle">下大静脈</text><text x="430" y="482" text-anchor="middle">腹大動脈</text><text x="392" y="412">後腹膜腔</text><text x="340" y="118" text-anchor="middle" fill="#185FA5">腹膜腔</text>
</g>
<g stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"><line x1="98" y1="110" x2="196" y2="104"/><line x1="98" y1="150" x2="190" y2="170"/><line x1="98" y1="240" x2="246" y2="304"/><line x1="98" y1="302" x2="146" y2="302"/><line x1="98" y1="352" x2="178" y2="352"/><line x1="584" y1="150" x2="520" y2="164"/><line x1="584" y1="205" x2="396" y2="232"/><line x1="584" y1="250" x2="424" y2="302"/><line x1="584" y1="302" x2="536" y2="302"/><line x1="584" y1="352" x2="504" y2="352"/><line x1="340" y1="38" x2="348" y2="143"/><line x1="250" y1="472" x2="310" y2="364"/><line x1="430" y1="472" x2="356" y2="364"/></g>
<text x="20" y="508" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">上が前、左が患者の右（足側から見た図）。青い線が腹膜で、緑・黄は腹膜内、橙は後腹膜にある器官です。</text>
<text x="20" y="528" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">位置関係を示す模式図です。大きさ・形は実物と異なります。肝臓の腹膜との関係は、この図では区別していません。</text>
</svg>
