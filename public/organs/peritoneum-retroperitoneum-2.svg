<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 548" width="680" height="548" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>腹膜内器官と後腹膜器官（水平断の模式図）</title><desc>上腹部の水平断の模式図。上が前、左が患者の右。壁側腹膜の線より前の腹膜腔に、肝臓・胃・小腸や結腸が間膜でつながって入っている。壁側腹膜の後ろの後腹膜腔に、膵臓、十二指腸、上行結腸、下行結腸、腎臓、下大静脈、腹大動脈がある。</desc><rect width="680" height="548" fill="#fff"/>
