<path d="M330 286 L352 286 L402 240 L322 214 Z" fill="#B5D4F4" fill-opacity="0.7" stroke="#185FA5" stroke-width="1.3"/>
<g fill="#C0DD97" stroke="#3B6D11" stroke-width="1.5"><circle cx="350" cy="160" r="17"/><circle cx="392" cy="188" r="17"/><circle cx="330" cy="200" r="17"/><circle cx="372" cy="226" r="16"/><circle cx="312" cy="164" r="15"/></g>
<g fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"><path d="M280 302 C300 292 380 290 420 300 C432 306 428 318 410 320 C380 324 320 326 290 320 C274 316 272 308 280 302 Z"/><ellipse cx="256" cy="308" rx="15" ry="12"/><circle cx="164" cy="302" r="17"/><circle cx="518" cy="302" r="16"/><ellipse cx="214" cy="352" rx="38" ry="30"/><ellipse cx="466" cy="352" rx="38" ry="30"/><ellipse cx="310" cy="354" rx="14" ry="10"/><circle cx="354" cy="354" r="11"/></g>
