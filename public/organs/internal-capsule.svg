<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>内包の前脚・膝・後脚（水平断の模式図）</title><desc>大脳を上から見た水平断の模式図。上が前。内包は「く」の字に曲がり、曲がりの頂点（膝）が正中側を向く。前脚は尾状核頭とレンズ核（淡蒼球・被殻）のあいだ、後脚は視床とレンズ核のあいだを通る。前脚には前頭橋路と前視床脚、膝には皮質核路と皮質網様体路、後脚には皮質脊髄路と上視床脚（体性感覚の線維）が通る。</desc>
<rect width="680" height="540" fill="#fff"/>
<path d="M340 44 C230 44 150 110 142 220 C138 320 190 420 260 440 C290 448 320 444 340 440 C360 444 390 448 420 440 C490 420 542 320 538 220 C530 110 450 44 340 44 Z" fill="#FBFAF6" stroke="#2C2C2A" stroke-width="1.8"/>
<path d="M346 96 L366 96 L376 118 L366 196 L346 196 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>
<rect x="337" y="240" width="6" height="140" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<path d="M418.2 231.8 L446.6 164.4 C480.6 150.4 520 170 524 240 C526 300 506 336 451.0 302.6 Z" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/>
