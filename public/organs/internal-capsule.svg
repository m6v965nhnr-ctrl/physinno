<ellipse cx="388.7" cy="299.1" rx="34" ry="66" transform="rotate(-12 388.7 299.1)" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.5"/>
<path d="M464.0 123.0 L418.2 231.8 L477.8 360.5 L454.2 371.5 L389.8 232.2 L440.0 113.0 Z" fill="#E9E6DB" stroke="#2C2C2A" stroke-width="1.3" stroke-linejoin="round"/>
<g transform="translate(680 0) scale(-1 1)">
<path d="M346 96 L366 96 L376 118 L366 196 L346 196 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>
