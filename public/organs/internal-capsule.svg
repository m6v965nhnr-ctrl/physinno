<path d="M418.2 231.8 L436.5 188.3 C456.5 190.3 462.2 205 462.2 240 C462.2 268 456.5 271.5 438.5 275.5 Z" fill="#FAC775" stroke="#854F0B" stroke-width="1.5"/>
