<path d="M464.0 123.0 L418.2 231.8 L477.8 360.5 L454.2 371.5 L389.8 232.2 L440.0 113.0 Z" fill="#E9E6DB" stroke="#2C2C2A" stroke-width="1.3" stroke-linejoin="round"/>
</g>
<text x="560" y="98" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">前脚</text>
<text x="560" y="118" font-size="13" fill="#5F5E5A" dominant-baseline="central">前頭橋路</text>
<text x="560" y="136" font-size="13" fill="#5F5E5A" dominant-baseline="central">前視床脚</text>
<line x1="556" y1="102" x2="441.6" y2="152.2" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="441.6" cy="152.2" r="2.6" fill="#5F5E5A"/>
<text x="560" y="200" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">膝</text>
<text x="560" y="220" font-size="13" fill="#5F5E5A" dominant-baseline="central">皮質核路</text>
<text x="560" y="238" font-size="13" fill="#5F5E5A" dominant-baseline="central">皮質網様体路</text>
<line x1="556" y1="204" x2="414" y2="228" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="414.0" cy="228.0" r="2.6" fill="#5F5E5A"/>
<text x="560" y="338" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">後脚</text>
<text x="560" y="358" font-size="13" fill="#5F5E5A" dominant-baseline="central">皮質脊髄路</text>
<text x="560" y="376" font-size="13" fill="#5F5E5A" dominant-baseline="central">上視床脚（感覚）</text>
<line x1="556" y1="342" x2="444.1" y2="305.7" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="444.1" cy="305.7" r="2.6" fill="#5F5E5A"/>
<text x="300" y="20" text-anchor="end" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">尾状核頭</text>
<line x1="298" y1="28" x2="277.0680175807129" y2="118.28630854604955" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="380" y="20" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">側脳室前角</text>
<line x1="376" y1="28" x2="358" y2="100" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="291.2921663191521" y="299.06897921070896" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">視床</text>
<text x="388.7078336808479" y="299.06897921070896" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">視床</text>
<text x="124" y="386" text-anchor="end" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">レンズ核</text>
<text x="124" y="406" text-anchor="end" font-size="13" fill="#5F5E5A" dominant-baseline="central">（淡蒼球・被殻）</text>
<line x1="128" y1="390" x2="175" y2="300" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="175.0" cy="300.0" r="2.6" fill="#5F5E5A"/>
<text x="124" y="330" text-anchor="end" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">内包</text>
<line x1="128" y1="332" x2="212" y2="346" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="212.0" cy="346.0" r="2.6" fill="#5F5E5A"/>
<text x="340" y="466" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">第三脳室</text>
<line x1="340" y1="456" x2="340" y2="380" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="20" y="490" font-size="12.5" fill="#5F5E5A" dominant-baseline="central">※前が上の水平断（上から見た図）。左右は対称に描き、ラベルは両側に分けて付けた。</text>
<text x="20" y="510" font-size="12.5" fill="#5F5E5A" dominant-baseline="central">※前脚は尾状核頭とレンズ核のあいだ、後脚は視床とレンズ核のあいだ。通る線維は主なものだけ。</text>
<text x="20" y="530" font-size="12.5" fill="#5F5E5A" dominant-baseline="central">※後脚の後方・下方には視放線・聴放線なども通る（図では省略）。</text>
</svg>
