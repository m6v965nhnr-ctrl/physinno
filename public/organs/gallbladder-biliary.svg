<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>肝臓・胆嚢・膵臓・十二指腸の位置関係と胆道（前から見た模式図）</title><desc>肝臓から出る右肝管と左肝管が合流して総肝管になり、胆嚢から出る胆嚢管と合流して総胆管になる。総胆管は、膵頭の近くを下り、膵管と合流して十二指腸乳頭に開口する。膵臓は頭部が十二指腸のC字のくぼみにはまり、体部が左へ伸び、尾部が脾臓に接する。</desc><rect width="680" height="560" fill="#fff"/>
