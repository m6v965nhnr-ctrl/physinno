<g text-anchor="end"><text x="112" y="262">胆嚢</text><text x="215" y="337">肝膵膨大部</text><text x="215" y="355">（ファーター膨大部）</text><text x="215" y="393">十二指腸乳頭</text><text x="232" y="445">十二指腸</text></g></g>
