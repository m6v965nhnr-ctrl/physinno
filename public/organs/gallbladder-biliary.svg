<text x="20" y="515" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">胃は省いています（膵臓は胃の後ろにあります）。空腸側へ続く十二指腸の上行部は図の右下で終わります。</text>
<text x="20" y="535" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">総胆管と主膵管は、十二指腸の壁の中で合流して十二指腸乳頭（赤い点）に開きます。</text>
