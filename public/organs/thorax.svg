<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>胸郭（胸骨と肋骨）を前から見た模式図</title><desc>胸郭を前から見た模式図。中央に胸骨があり、上から胸骨柄、胸骨体、剣状突起に分かれる。胸骨柄と胸骨体の境が胸骨角で、第2肋骨が付く。肋骨は左右12対。第1〜7肋骨は真肋で、肋軟骨が直接胸骨に付く。第8〜10肋骨は仮肋で、肋軟骨が1つ上の肋軟骨に付く。第11・12肋骨は浮遊肋で、胸骨に付かない。</desc>
