<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" height="590" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>網膜の層構造</title><desc>網膜の層を、光の入る内側（硝子体側）から外側へ並べた模式図。視神経線維層、神経節細胞層、内側のシナプス層、内顆粒層（双極細胞など）、外側のシナプス層、外顆粒層、視細胞の外節（杆体と錐体）、色素上皮細胞、脈絡膜の順。信号は視細胞から双極細胞、神経節細胞へ伝わる。</desc>
<rect width="680" height="590" fill="#fff"/>
<g transform="translate(-110,0)"><rect x="150" y="70" width="280" height="34" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><rect x="150" y="104" width="280" height="46" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><rect x="150" y="150" width="280" height="36" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="150" y="186" width="280" height="52" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><rect x="150" y="238" width="280" height="36" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="150" y="274" width="280" height="44" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><rect x="150" y="318" width="280" height="78" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><rect x="150" y="396" width="280" height="30" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><rect x="150" y="426" width="280" height="40" fill="#F4C0D1" stroke="#993556" stroke-width="1"/><line x1="156" y1="80" x2="424" y2="80" stroke="#185FA5" stroke-width="1" /><line x1="156" y1="87" x2="424" y2="87" stroke="#185FA5" stroke-width="1" /><line x1="156" y1="94" x2="424" y2="94" stroke="#185FA5" stroke-width="1" /><circle cx="200" cy="127" r="13" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><line x1="200" y1="114" x2="200" y2="104" stroke="#3B6D11" stroke-width="1.2" /><circle cx="300" cy="127" r="13" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><line x1="300" y1="114" x2="300" y2="104" stroke="#3B6D11" stroke-width="1.2" /><circle cx="400" cy="127" r="13" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><line x1="400" y1="114" x2="400" y2="104" stroke="#3B6D11" stroke-width="1.2" /><circle cx="210" cy="168" r="2.5" fill="#5F5E5A"/><circle cx="245" cy="168" r="2.5" fill="#5F5E5A"/><circle cx="290" cy="168" r="2.5" fill="#5F5E5A"/><circle cx="335" cy="168" r="2.5" fill="#5F5E5A"/><circle cx="380" cy="168" r="2.5" fill="#5F5E5A"/><circle cx="405" cy="168" r="2.5" fill="#5F5E5A"/><ellipse cx="200" cy="212" rx="11" ry="16" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><line x1="200" y1="196" x2="200" y2="150" stroke="#0F6E56" stroke-width="1.2" /><line x1="200" y1="228" x2="200" y2="256" stroke="#0F6E56" stroke-width="1.2" /><ellipse cx="300" cy="212" rx="11" ry="16" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><line x1="300" y1="196" x2="300" y2="150" stroke="#0F6E56" stroke-width="1.2" /><line x1="300" y1="228" x2="300" y2="256" stroke="#0F6E56" stroke-width="1.2" /><ellipse cx="400" cy="212" rx="11" ry="16" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><line x1="400" y1="196" x2="400" y2="150" stroke="#0F6E56" stroke-width="1.2" /><line x1="400" y1="228" x2="400" y2="256" stroke="#0F6E56" stroke-width="1.2" /><circle cx="200" cy="256" r="2.5" fill="#5F5E5A"/><circle cx="250" cy="256" r="2.5" fill="#5F5E5A"/><circle cx="300" cy="256" r="2.5" fill="#5F5E5A"/><circle cx="350" cy="256" r="2.5" fill="#5F5E5A"/><circle cx="400" cy="256" r="2.5" fill="#5F5E5A"/><circle cx="200" cy="296" r="9" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><rect x="194" y="305" width="12" height="82" rx="3" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><circle cx="250" cy="296" r="9" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><rect x="244" y="305" width="12" height="82" rx="3" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><circle cx="300" cy="296" r="9" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><path d="M292 305 L308 305 L302 380 L298 380 Z" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><circle cx="400" cy="296" r="9" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><path d="M392 305 L408 305 L402 380 L398 380 Z" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><text x="225" y="350" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">杆体</text><text x="350" y="350" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">錐体</text><rect x="158" y="400" width="22" height="22" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><rect x="188" y="400" width="22" height="22" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><rect x="218" y="400" width="22" height="22" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><rect x="248" y="400" width="22" height="22" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><rect x="278" y="400" width="22" height="22" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><rect x="308" y="400" width="22" height="22" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><rect x="338" y="400" width="22" height="22" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><rect x="368" y="400" width="22" height="22" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><rect x="398" y="400" width="22" height="22" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><ellipse cx="210" cy="446" rx="14" ry="7" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/><ellipse cx="300" cy="446" rx="14" ry="7" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/><ellipse cx="390" cy="446" rx="14" ry="7" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/><path d="M290 14 L290 60" stroke="#854F0B" stroke-width="3" fill="none"/><polygon points="282,56 298,56 290,68" fill="#854F0B"/><text x="310" y="30" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">光は網膜の内側（硝子体側）から入る</text></g><line x1="320" y1="87" x2="334" y2="87" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="338" y="87" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視神経線維層（神経節細胞の軸索）</text><line x1="320" y1="127" x2="334" y2="127" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="338" y="127" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">神経節細胞層</text><line x1="320" y1="168" x2="334" y2="168" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="338" y="168" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">内側のシナプス層（アマクリン細胞）</text><line x1="320" y1="212" x2="334" y2="212" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="338" y="212" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">内顆粒層（双極細胞・水平細胞・アマクリン細胞）</text><line x1="320" y1="256" x2="334" y2="256" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="338" y="256" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">外側のシナプス層</text><line x1="320" y1="296" x2="334" y2="296" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="338" y="296" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">外顆粒層（視細胞の細胞体）</text><line x1="320" y1="340" x2="334" y2="340" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="338" y="340" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視細胞の外節（光を受ける部分）</text><line x1="320" y1="411" x2="334" y2="411" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="338" y="411" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">色素上皮細胞</text><line x1="320" y1="446" x2="334" y2="446" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="338" y="446" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">脈絡膜</text><text x="20" y="500" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">網膜の層構造の模式図。光は神経節細胞や双極細胞の層を通り抜けて、いちばん外側の視細胞に届く。</text><text x="20" y="524" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視細胞（杆体・錐体）→ 双極細胞 → 神経節細胞の順に信号が伝わり、神経節細胞の軸索が視神経になる。</text><text x="20" y="560" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">層の厚さ・細胞の数や大きさは実物と異なります。</text>
</svg>
