<line x1="54" y1="124" x2="316" y2="140" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="20" y="296" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">パイエル板（小腸）</text>
<line x1="152" y1="296" x2="304" y2="294" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
