<line x1="542" y1="116" x2="342" y2="140" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="660" y="262" text-anchor="end" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">脾臓（腹部の左上）</text>
<line x1="528" y1="262" x2="402" y2="262" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="660" y="410" text-anchor="end" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">赤色骨髄（大腿骨の近位端）</text>
<line x1="472" y1="410" x2="388" y2="400" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="660" y="196" text-anchor="end" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">赤色骨髄（上腕骨の近位端）</text>
<line x1="472" y1="196" x2="420" y2="163" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
<circle cx="28" cy="604" r="6" fill="#FAC775" stroke="#854F0B" stroke-width="1.5"/>
<text x="44" y="604" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">黄色の丸はリンパ節（頸部・腋窩の例。鼠径部などにもある。リンパ系のカードを参照）</text>
<text x="20" y="630" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">赤色骨髄は成人の主な部位だけを示し、椎骨は省略した。胸腺は胸骨の後ろにある。</text>
<text x="20" y="650" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">模式図。位置関係を示すもので、大きさ・形は実物と異なります。</text>
<text x="660" y="650" text-anchor="end" font-size="12" fill="#2C2C2A" dominant-baseline="central">図の左が体の右側</text>
</svg>