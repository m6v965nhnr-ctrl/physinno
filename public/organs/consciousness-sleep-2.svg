<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 438" width="680" height="438" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>概日リズムの経路</title><desc>光の情報は網膜から網膜視床下部路を通って、視床下部の視交叉上核（体内時計の中枢）に直接伝わる。視交叉上核は、睡眠・行動・内分泌などのリズムを制御し、松果体のメラトニン分泌のリズムも制御する。メラトニンは夜間に多く昼間に少なく、血流にのって全身に時刻情報を伝え、視交叉上核にもフィードバックされる。</desc>
<rect width="680" height="438" fill="#fff"/>
<defs><marker id="m0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#854F0B"/></marker><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker></defs>
<g transform="translate(0,-40)"><circle cx="48" cy="124" r="24" fill="#FAC775" stroke="#854F0B" stroke-width="1.5"/>
<text x="48" y="124" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#2C2C2A" font-weight="500">光</text>
<path d="M74 124 L96 124" fill="none" stroke="#854F0B" stroke-width="2.5" marker-end="url(#m0)"/>
<rect x="92" y="96" width="114" height="56" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="149.0" y="115.75" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">網膜</text>
<text x="149.0" y="132.25" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（メラノプシン細胞）</text>
<path d="M208 124 L298 124" fill="none" stroke="#185FA5" stroke-width="2.5" marker-end="url(#m1)"/>
<text x="246" y="106" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">網膜視床下部路</text>
<rect x="292" y="62" width="190" height="118" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="300" y="76" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">視床下部</text>
<rect x="306" y="92" width="162" height="60" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="387.0" y="113.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">視交叉上核</text>
<text x="387.0" y="131.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">（体内時計の中枢）</text>
<path d="M474 122 L520 122" fill="none" stroke="#534AB7" stroke-width="2.5" marker-end="url(#m2)"/>
<rect x="522" y="92" width="140" height="60" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="592.0" y="113.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">睡眠・行動・</text>
<text x="592.0" y="130.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">内分泌のリズム</text>
<path d="M387 182 L387 246" fill="none" stroke="#534AB7" stroke-width="2.5" marker-end="url(#m2)"/>
<text x="399" y="214" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">分泌リズムを制御</text>
<rect x="306" y="248" width="162" height="56" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="387.0" y="267.75" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">松果体</text>
<text x="387.0" y="284.25" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（メラトニンを合成・分泌）</text>
<rect x="508" y="236" width="154" height="92" rx="6" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<rect x="542" y="240" width="86" height="66" rx="2" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0" fill-opacity="0.8"/>
