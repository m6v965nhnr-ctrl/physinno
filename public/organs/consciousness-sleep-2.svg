<text x="525" y="319" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">昼</text>
<text x="585" y="319" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">夜</text>
<text x="645" y="319" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">昼</text>
<text x="585.0" y="342" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">メラトニンの分泌（模式）</text>
<path d="M470 276 L506 276" fill="none" stroke="#854F0B" stroke-width="2.5" marker-end="url(#m0)"/>
<path d="M585 234 L585 196 L430 196 L430 154" fill="none" stroke="#0F6E56" stroke-width="2" marker-end="url(#m3)" stroke-dasharray="5 3"/>
<text x="507" y="184" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#0F6E56" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">フィードバック</text>
<text x="24" y="354" text-anchor="start" dominant-baseline="central" font-size="13.5" fill="#2C2C2A">光は、体内時計の位相をリセットする最も強力な同調因子。</text>
<text x="24" y="376" text-anchor="start" dominant-baseline="central" font-size="13.5" fill="#2C2C2A">朝に光を浴びるとリズムは前進し、夕方に光を浴びるとリズムは後退する。</text>
<text x="24" y="402" text-anchor="start" dominant-baseline="central" font-size="13.5" fill="#2C2C2A">メラトニンは血流にのって時刻情報を全身に伝え、睡眠の誘導などの概日リズムを生む。</text>
<text x="24" y="424" text-anchor="start" dominant-baseline="central" font-size="13.5" fill="#2C2C2A">視交叉上核にもメラトニン受容体があり、松果体からフィードバックを受ける。</text>
<text x="24" y="452" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">矢印は信号・指令の向き。位置関係を示す簡略図で、大きさ・形は実物と異なります。</text></g>
</svg>
