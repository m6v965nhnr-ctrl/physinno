<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>血球の形と大きさ（模式図）</title><desc>赤血球、好中球、好酸球、好塩基球、単球、リンパ球、血小板を、直径の目安に比例した大きさで並べた模式図。赤血球は核のない両面凹円板で直径約7〜8マイクロメートル。好中球と好酸球は10〜12、好塩基球は8〜10、単球は12〜20、小型のリンパ球は6〜9、血小板は2〜4マイクロメートル。</desc>
