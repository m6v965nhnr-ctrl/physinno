<text x="70" y="235" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">赤血球</text>
<text x="70" y="255" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">7〜8 μm</text>
<text x="70" y="278" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">核なし</text>
<text x="70" y="296" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">中央がくぼむ円板</text>
<text x="165" y="235" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">好中球</text>
<text x="165" y="255" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">10〜12 μm</text>
<text x="165" y="278" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">核は2〜5葉</text>
<text x="165" y="296" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">顆粒は淡い紫</text>
<text x="260" y="235" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">好酸球</text>
<text x="260" y="255" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">10〜12 μm</text>
<text x="260" y="278" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">核は2〜3葉</text>
<text x="260" y="296" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">顆粒は赤橙色</text>
<text x="350" y="235" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">好塩基球</text>
<text x="350" y="255" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">8〜10 μm</text>
<text x="350" y="278" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">顆粒は濃青〜紫</text>
<text x="350" y="296" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">核は見えにくい</text>
<text x="450" y="235" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">単球</text>
<text x="450" y="255" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">12〜20 μm</text>
<text x="450" y="278" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">核はくぼみ・馬蹄形</text>
<text x="450" y="296" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">白血球で大きい方</text>
<text x="548" y="235" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">リンパ球</text>
<text x="548" y="255" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">6〜9 μm</text>
<text x="548" y="278" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">小型の例</text>
<text x="548" y="296" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">核が大きい</text>
<text x="625" y="235" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">血小板</text>
<text x="625" y="255" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">2〜4 μm</text>
<text x="625" y="278" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">核なし</text>
<text x="625" y="296" text-anchor="middle" font-size="11" fill="#2C2C2A" dominant-baseline="central">巨核球の断片</text>
<line x1="20" y1="385" x2="80.0" y2="385" stroke="#2C2C2A" stroke-width="2"/>
<text x="90.0" y="385" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">10 μm</text>
<text x="20" y="415" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">直径は教科書（OpenStax）の値。円の大きさは直径に比例（1 μm＝6 px）。</text>
<text x="20" y="435" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">模式図。核の形や顆粒の色は染色標本での見え方の目安で、実物とは異なります。</text>
<text x="20" y="34" text-anchor="start" font-size="15" font-weight="500" fill="#2C2C2A" dominant-baseline="central">血球の大きさの比較（直径に比例）</text>
</svg>