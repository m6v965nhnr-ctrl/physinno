<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 792" width="680" height="792" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>姿勢反応が現れる時期</title><desc>横軸は月齢（0〜18か月）。立ち直り反応（頸・体・迷路性・視覚性）は3〜7か月ごろに現れる。傾斜反応は臥位・座位7〜8か月、四つ這い9〜12か月、立位12か月。保護伸展反応は下方6か月、前方6〜7か月、側方7〜8か月、後方9〜10か月。背屈反応は10〜12か月、ホップ反応は15〜18か月、シーソー反応は約15か月、ステッピング反応は1歳6か月ごろに完成する。右向きの矢印は、発現後も続くことを示す。</desc>
