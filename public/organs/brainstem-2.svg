<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 810" width="680" height="810" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>脳幹の断面の模式図（中脳と橋）</title><desc>脳幹の断面の模式図。上は中脳の上丘の高さ。背側に上丘（中脳蓋）、その腹側に中脳水道を囲む中心灰白質、その腹側に動眼神経核。被蓋には赤核があり、赤核の外方に内側毛帯が位置する。動眼神経根は赤核を貫いて腹側の脚間窩へ向かう。腹側には大脳脚があり、大脳脚のすぐ背側に黒質がある。下は橋の尾側。背側に第四脳室があり、その底の正中寄りに外転神経核（顔面神経丘の下）と内側縦束、外側に前庭神経核、さらに外側に三叉神経脊髄路核、その腹内側に顔面神経核がある。橋網様体は被蓋の中央にあり、被蓋の腹側縁に内側毛帯が水平に広がる。内側毛帯より腹側が橋腹側部（橋底部）で、橋核、縦橋線維、横橋線維があり、横橋線維は中小脳脚へ続く。</desc>
