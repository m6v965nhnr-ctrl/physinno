<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" width="680" height="650" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>三大栄養素の代謝の全体像（模式図）</title><desc>糖質・脂質・たんぱく質がアセチルCoAを経てクエン酸回路・電子伝達系に合流しATPができる流れ。解糖でピルビン酸、酸素不足なら乳酸。脂肪酸はβ酸化でアセチルCoA、グリセロールは解糖系へ。アミノ酸は脱アミノしアンモニアは尿素回路で尿素。過剰なアセチルCoAはケトン体。乳酸・グリセロール・アミノ酸からの糖新生は点線。</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker></defs>
<rect width="680" height="650" fill="#fff"/>
<rect x="40" y="20" width="150" height="50" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="115.0" y="36.0" text-anchor="middle" font-size="14" font-weight="500" fill="#854F0B" dominant-baseline="central">糖質</text>
<text x="115.0" y="54.0" text-anchor="middle" font-size="14" fill="#854F0B" dominant-baseline="central">グルコース</text>
<rect x="265" y="20" width="150" height="50" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="340.0" y="36.0" text-anchor="middle" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">脂質</text>
<text x="340.0" y="54.0" text-anchor="middle" font-size="14" fill="#993C1D" dominant-baseline="central">脂肪酸・グリセロール</text>
<rect x="490" y="20" width="150" height="50" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="565.0" y="36.0" text-anchor="middle" font-size="14" font-weight="500" fill="#185FA5" dominant-baseline="central">たんぱく質</text>
<text x="565.0" y="54.0" text-anchor="middle" font-size="14" fill="#185FA5" dominant-baseline="central">アミノ酸</text>
<rect x="40" y="100" width="150" height="38" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="115.0" y="119.0" text-anchor="middle" font-size="14" fill="#854F0B" dominant-baseline="central">解糖（細胞質）</text>
<rect x="265" y="100" width="150" height="38" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="340.0" y="119.0" text-anchor="middle" font-size="14" fill="#993C1D" dominant-baseline="central">β酸化</text>
<rect x="490" y="100" width="150" height="38" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="565.0" y="119.0" text-anchor="middle" font-size="14" fill="#185FA5" dominant-baseline="central">脱アミノ</text>
<path d="M115 70 L115 98" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M340 70 L340 98" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M565 70 L565 98" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="40" y="170" width="130" height="38" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="105.0" y="189.0" text-anchor="middle" font-size="14" fill="#854F0B" dominant-baseline="central">ピルビン酸</text>
<path d="M105 138 L105 168" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
