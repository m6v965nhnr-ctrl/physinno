<text x="230" y="222" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">（酸素不足）</text>
<path d="M265 58 L226 58 L226 119 L192 119" fill="none" stroke="#993C1D" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="232" y="92" text-anchor="start" font-size="11" fill="#993C1D" dominant-baseline="central">グリセロール</text>
