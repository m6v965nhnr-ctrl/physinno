<rect x="490" y="170" width="150" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<text x="565.0" y="189.0" text-anchor="middle" font-size="13" fill="#5F5E5A" dominant-baseline="central">尿素回路（肝）→尿素</text>
<path d="M565 138 L565 168" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="574" y="153" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">アンモニウム</text>
<rect x="240" y="250" width="200" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2" />
<text x="340.0" y="270.0" text-anchor="middle" font-size="15" font-weight="500" fill="#534AB7" dominant-baseline="central">アセチルCoA</text>
<path d="M105 208 C105 245 165 268 238 270" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="112" y="266" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">酸素あり</text>
<path d="M340 138 L340 248" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M510 138 C468 170 470 222 436 250" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="455" y="220" text-anchor="end" font-size="12" fill="#185FA5" dominant-baseline="central">炭素骨格</text>
<rect x="490" y="250" width="150" height="40" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2" />
<text x="565.0" y="270.0" text-anchor="middle" font-size="14" fill="#993556" dominant-baseline="central">ケトン体（肝）</text>
<path d="M442 270 L488 270" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="465" y="286" text-anchor="middle" font-size="12" fill="#993556" dominant-baseline="central">過剰時</text>
<rect x="210" y="330" width="260" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2" />
<text x="340.0" y="343.0" text-anchor="middle" font-size="14" font-weight="500" fill="#0F6E56" dominant-baseline="central">クエン酸回路（TCA回路）</text>
<text x="340.0" y="361.0" text-anchor="middle" font-size="14" fill="#0F6E56" dominant-baseline="central">ミトコンドリアのマトリックス</text>
<path d="M340 290 L340 328" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M472 352 L520 352" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="528" y="352" text-anchor="start" font-size="14" fill="#2C2C2A" dominant-baseline="central">CO2</text>
<rect x="210" y="430" width="260" height="44" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2" />
<text x="340.0" y="443.0" text-anchor="middle" font-size="14" font-weight="500" fill="#3B6D11" dominant-baseline="central">電子伝達系（酸化的リン酸化）</text>
<text x="340.0" y="461.0" text-anchor="middle" font-size="14" fill="#3B6D11" dominant-baseline="central">ミトコンドリアの内膜</text>
<path d="M340 374 L340 428" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="350" y="401" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">NADH・FADH2</text>
<rect x="40" y="430" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<text x="105.0" y="452.0" text-anchor="middle" font-size="14" fill="#5F5E5A" dominant-baseline="central">O2 → H2O</text>
<path d="M172 452 L208 452" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="265" y="520" width="150" height="42" rx="8" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.2" />
<text x="340.0" y="541.0" text-anchor="middle" font-size="18" font-weight="500" fill="#fff" dominant-baseline="central">ATP</text>
<path d="M340 474 L340 518" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="14" y="588" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">実線は主な異化の流れ、点線は糖新生とグリセロールの経路。</text>
<text x="14" y="608" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">解糖で正味2ATP。有酸素では全体で正味36ATP（OpenStaxの数え方）。</text>
<text x="14" y="628" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">中間体は省略した模式図。ミトコンドリアのない赤血球は、ピルビン酸を乳酸にしてATPを得る。</text>
</svg>