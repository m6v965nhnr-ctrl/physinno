<g font-size="14" fill="#2C2C2A" dominant-baseline="central"><text x="260.0" y="428" text-anchor="middle">酸素分圧 PO₂（mmHg）</text><text transform="translate(24 220.0) rotate(-90)" text-anchor="middle">酸素飽和度（%）</text>
<text x="80" y="456">● P50＝約27 mmHg（飽和度50%になる PO₂。曲線上の黒い点）</text><text x="304.0" y="336" font-size="13" fill="#5F5E5A">PO₂ 60 mmHg → 約90%</text>
<line x1="340" y1="236" x2="368" y2="236" stroke="#993C1D" stroke-width="2.4"/><text x="376" y="236">右方移動</text><line x1="340" y1="260" x2="368" y2="260" stroke="#2C2C2A" stroke-width="2.8"/><text x="376" y="260">標準</text><line x1="340" y1="284" x2="368" y2="284" stroke="#185FA5" stroke-width="2.4"/><text x="376" y="284">左方移動</text>
<rect x="468" y="60" width="200" height="158" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><text x="480" y="82" font-weight="500">右方移動</text><text x="480" y="106" >酸素親和性が低下し、</text><text x="480" y="130" >組織で酸素を離しやすい</text><text x="480" y="154" >H⁺↑（pH低下）</text><text x="480" y="178" >PCO₂↑・体温↑</text><text x="480" y="202" >2,3-DPG↑</text><rect x="468" y="260" width="200" height="86" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="480" y="282" font-weight="500">左方移動</text><text x="480" y="306" >酸素親和性が上昇</text><text x="480" y="330" >（上の要因が低下したとき）</text></g></svg>