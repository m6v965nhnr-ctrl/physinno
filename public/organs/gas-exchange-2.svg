<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>酸素解離曲線とその移動（模式図）</title><desc>横軸が酸素分圧、縦軸がヘモグロビン酸素飽和度のS字曲線。標準の曲線では飽和度50%のPO2（P50）が約27 mmHg。H+上昇、PCO2上昇、体温上昇、2,3-DPG増加で曲線は右方へ移動し、酸素を離しやすくなる。逆の変化では左方へ移動する。曲線の位置の移動量は模式的。</desc><rect width="680" height="470" fill="#fff"/>
