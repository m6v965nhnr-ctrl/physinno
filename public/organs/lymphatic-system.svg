<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" width="680" height="690" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>リンパの流れと主なリンパ節（模式図）</title><desc>人体の輪郭の模式図。頭頸部の右側、胸部の右側、右上肢のリンパは右リンパ本幹に集まり右の鎖骨下静脈に注ぐ。それ以外の全身のリンパは乳び槽から胸管に集まり、左の鎖骨下静脈に注ぐ。リンパ節は頸部、腋窩、鼠径部に多い。</desc>
