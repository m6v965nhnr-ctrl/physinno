<g fill="none" stroke="#E24B4A" stroke-width="2.5"><ellipse cx="341" cy="100" rx="19" ry="6"/><ellipse cx="341" cy="240" rx="19" ry="6"/><ellipse cx="359" cy="372" rx="17" ry="6"/></g>
<g stroke="#5F5E5A" stroke-width="1.2" fill="none"><path d="M158 90 L150 90 L150 150 L158 150"/><path d="M158 154 L150 154 L150 366 L158 366"/><path d="M158 372 L150 372 L150 438 L158 438"/></g>
<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central"><g text-anchor="end"><text x="285" y="55">咽頭</text><text x="305" y="150">気管</text><text x="292" y="305">右主気管支</text><text x="140" y="120">頸部食道</text><text x="140" y="260">胸部食道</text><text x="140" y="405">腹部食道</text><text x="335" y="455">噴門</text></g><text x="482" y="262">左主気管支</text><text x="520" y="368">横隔膜</text><text x="398" y="100">第1狭窄部：食道入口部</text><text x="400" y="305">第2狭窄部：左主気管支との交差部</text><text x="400" y="338">第3狭窄部：横隔膜の食道裂孔</text><text x="470" y="480" text-anchor="middle">胃</text></g>
<g stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"><line x1="288" y1="55" x2="316" y2="55"/><line x1="308" y1="150" x2="322" y2="150"/><line x1="296" y1="298" x2="262" y2="274"/><line x1="338" y1="455" x2="352" y2="446"/><line x1="362" y1="100" x2="395" y2="100"/><line x1="352" y1="244" x2="397" y2="302"/><line x1="372" y1="374" x2="397" y2="336"/></g>
<text x="20" y="540" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">赤い輪が3か所の狭窄部です。頸部・胸部の境は目安で、決まった位置を示す図ではありません。</text>
