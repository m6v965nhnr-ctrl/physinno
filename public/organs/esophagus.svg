<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>食道と3か所の狭窄部（前から見た模式図）</title><desc>咽頭から胃の噴門までの食道を前から見た模式図。食道は気管の後ろを通り、食道入口部、左主気管支との交差部、横隔膜の食道裂孔の3か所が狭窄部になる。頸部・胸部・腹部の区分を示す。</desc><rect width="680" height="560" fill="#fff"/>
