<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>腎臓の割面と腎動脈・腎静脈（右腎を後ろから見た模式図）</title><desc>右腎を後ろから見た割面の模式図。外側が腎皮質、内側に腎錐体と、錐体のあいだの腎柱がある。錐体の先端（腎乳頭）を小腎杯が包み、小腎杯が集まって腎盂、尿管へ続く（大腎杯は省略）。腹大動脈から腎動脈が、下大静脈へ腎静脈が腎門に出入りし、腎動脈は下大静脈の後ろを通る。腎動脈の枝の葉間動脈は腎柱を通って皮質へ向かう。</desc>
