<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" width="680" height="596" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>蝸牛の断面と音の伝わり</title><desc>ほどいた蝸牛の模式図と、蝸牛管の断面。アブミ骨の振動が卵円窓から前庭階の液体に伝わり、先端で鼓室階へ折り返して正円窓に至る。蝸牛管と鼓室階の間の基底膜の上にコルチ器（有毛細胞）があり、上に蓋膜がかぶさる。高い音は底に近い部分、低い音は頂に近い部分の基底膜を動かす。</desc>
<rect width="680" height="596" fill="#fff"/>
<text x="20" y="24" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">蝸牛をまっすぐにのばした模式図</text><path d="M110 62 L560 62 L560 90 L110 98 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><path d="M110 98 L530 90 L530 124 L110 118 Z" fill="#F4C0D1" stroke="#993556" stroke-width="1"/><path d="M110 118 L530 124 L560 124 L560 150 L110 150 Z" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><path d="M560 62 C600 62 600 150 560 150" fill="none" stroke="#2C2C2A" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="110" y1="118" x2="530" y2="124" stroke="#993556" stroke-width="3" /><rect x="88" y="64" width="22" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="82" y="80" text-anchor="end" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">アブミ骨</text><rect x="102" y="126" width="8" height="22" fill="#888780" stroke="#5F5E5A"/><text x="96" y="138" text-anchor="end" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">正円窓</text><path d="M50 90 L84 90" fill="none" stroke="#E24B4A" stroke-width="2.5" /><polygon points="84,85 94,90 84,95" fill="#E24B4A"/><text x="114" y="172" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">底（卵円窓に近い側）</text><text x="114" y="192" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">高い音（約20,000 Hz）</text><text x="596" y="172" text-anchor="end" dominant-baseline="central" font-size="13" fill="#2C2C2A">頂（先端）</text><text x="596" y="192" text-anchor="end" dominant-baseline="central" font-size="13" fill="#2C2C2A">低い音（約20 Hz）</text><path d="M120 206 L590 206" fill="none" stroke="#5F5E5A" stroke-width="1.5" /><polygon points="590,201 600,206 590,211" fill="#5F5E5A"/><text x="250" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">前庭階</text><text x="250" y="108" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">蝸牛管</text><text x="250" y="138" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">鼓室階</text><text x="20" y="250" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">蝸牛の断面（一部を拡大）</text><path d="M200 280 L480 280 L480 328 L200 328 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><path d="M200 328 L480 328 L480 400 L200 400 Z" fill="#F4C0D1" stroke="#993556" stroke-width="1"/><path d="M200 400 L480 400 L480 470 L200 470 Z" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><line x1="200" y1="328" x2="480" y2="328" stroke="#993556" stroke-width="1.2" stroke-dasharray="5 3"/><line x1="260" y1="400" x2="480" y2="400" stroke="#993556" stroke-width="4" /><path d="M290 398 L420 398 L410 370 L300 370 Z" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><ellipse cx="325" cy="380" rx="9" ry="14" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="320" y1="367" x2="321" y2="354" stroke="#854F0B" stroke-width="1.2" /><line x1="325" y1="367" x2="326" y2="354" stroke="#854F0B" stroke-width="1.2" /><line x1="330" y1="367" x2="331" y2="354" stroke="#854F0B" stroke-width="1.2" /><ellipse cx="365" cy="380" rx="9" ry="14" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="360" y1="367" x2="361" y2="354" stroke="#854F0B" stroke-width="1.2" /><line x1="365" y1="367" x2="366" y2="354" stroke="#854F0B" stroke-width="1.2" /><line x1="370" y1="367" x2="371" y2="354" stroke="#854F0B" stroke-width="1.2" /><ellipse cx="400" cy="380" rx="9" ry="14" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="395" y1="367" x2="396" y2="354" stroke="#854F0B" stroke-width="1.2" /><line x1="400" y1="367" x2="401" y2="354" stroke="#854F0B" stroke-width="1.2" /><line x1="405" y1="367" x2="406" y2="354" stroke="#854F0B" stroke-width="1.2" /><path d="M200 380 C240 350 270 342 340 348 C390 350 425 354 426 364 L390 358 L290 364 L200 396 Z" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><ellipse cx="220" cy="420" rx="18" ry="12" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><path d="M238 418 C260 418 300 410 322 398" fill="none" stroke="#854F0B" stroke-width="1.5" /><path d="M202 422 L160 440" fill="none" stroke="#854F0B" stroke-width="3" /><line x1="490" y1="304" x2="480" y2="304" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="480" cy="304" r="2.2" fill="#2C2C2A"/><text x="494" y="304" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">前庭階</text><line x1="490" y1="350" x2="470" y2="350" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="470" cy="350" r="2.2" fill="#2C2C2A"/><text x="494" y="350" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">蝸牛管</text><line x1="490" y1="436" x2="480" y2="436" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="480" cy="436" r="2.2" fill="#2C2C2A"/><text x="494" y="436" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">鼓室階</text><line x1="490" y1="400" x2="460" y2="400" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="460" cy="400" r="2.2" fill="#2C2C2A"/><text x="494" y="400" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">基底膜</text><line x1="490" y1="376" x2="410" y2="384" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="410" cy="384" r="2.2" fill="#2C2C2A"/><text x="494" y="376" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">コルチ器</text><line x1="124" y1="350" x2="240" y2="362" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="240" cy="362" r="2.2" fill="#2C2C2A"/><text x="120" y="350" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">蓋膜</text><line x1="306" y1="482" x2="365" y2="388" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="365" cy="388" r="2.2" fill="#2C2C2A"/><text x="310" y="482" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">有毛細胞</text><line x1="124" y1="446" x2="220" y2="422" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="220" cy="422" r="2.2" fill="#2C2C2A"/><text x="120" y="446" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ラセン神経節</text><text x="20" y="516" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">音の高さに応じて、基底膜の動く場所が変わる（高い音は底の側、低い音は頂の側）。</text><text x="20" y="540" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">有毛細胞の不動毛は蓋膜に接する。基底膜が動くと蓋膜との間でずれて不動毛が曲がり、有毛細胞が興奮する。</text><text x="20" y="566" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">模式図。大きさ・形は実物と異なります。</text>
</svg>
