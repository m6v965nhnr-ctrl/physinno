<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>橈骨と尺骨の各部（前面の模式図）</title><desc>右の前腕を前から見た図（回外位）。外側（母指側）が橈骨、内側（小指側）が尺骨。橈骨は上端に橈骨頭、その下に橈骨頸、その下の内側に橈骨粗面。下端は外側に茎状突起、内側に尺骨切痕、底面が手根骨と関節する手根関節面。尺骨は上端に肘頭、前面に滑車切痕、その下のふちが鈎状突起、さらに下に尺骨粗面。滑車切痕の外側の下に橈骨切痕があり、橈骨頭と関節する。下端は尺骨頭と茎状突起。両骨の向かい合う縁が骨間縁で、その間を骨間膜が結ぶ。橈骨の茎状突起は尺骨のものより遠位にある。</desc><rect width="680" height="700" fill="#fff"/><defs><clipPath id="u"><path d="M 350,76 L 414,76 Q 426,80 426,104 L 424,166 Q 420,214 410,262 L 402,540 Q 404,560 410,574 Q 418,588 412,606 Q 404,616 388,614 Q 366,612 366,592 Q 366,570 372,540 L 358,262 Q 340,214 334,170 L 332,112 Q 332,84 350,76 Z"/></clipPath><clipPath id="r"><path d="M 252,146 Q 252,134 282,134 Q 312,134 312,146 L 312,156 Q 300,162 296,176 L 298,200 Q 304,260 308,330 Q 310,420 310,500 L 314,548 Q 320,572 316,592 L 310,624 L 246,632 L 234,652 Q 226,612 232,570 Q 244,520 252,440 Q 258,340 262,260 Q 266,210 268,176 Q 262,162 252,156 Z"/></clipPath></defs><polygon points="305,270 359,270 370,525 311,525" fill="#9FE1CB" fill-opacity="0.55" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<text x="335" y="398" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">骨間膜</text>
