<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>鎖骨（上から見た模式図）と肩鎖関節・胸鎖関節</title><desc>右の鎖骨を上から見た模式図。上が前、左が体の中央（胸骨側）、右が肩の側。内側の端が胸骨端で、胸骨柄と胸鎖関節をつくる。外側の端が肩峰端で、肩甲骨の肩峰と肩鎖関節をつくる。内側の約3分の2は前に凸、外側の約3分の1は前に凹の、S字のカーブをしている。2つの湾曲の境の付近が骨折しやすい。外側の約3分の1の下面には、烏口突起と結ぶ烏口鎖骨靱帯（円錐靱帯と菱形靱帯）がつく。</desc><rect width="680" height="470" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5F5E5A"/></marker></defs><text x="340" y="30" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">右の鎖骨を上から見た図</text>
<text x="40" y="60" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">前</text>
<path d="M 40,92 L 40,70" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
