<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 990" width="680" height="990" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>全身の主な動脈（前から見た模式図）</title><desc>大動脈とその主な枝を前から見た模式図。左心室から出る上行大動脈が大動脈弓となり、腕頭動脈、左総頸動脈、左鎖骨下動脈を出して下行大動脈になる。腹大動脈からは腹腔動脈、上腸間膜動脈、腎動脈、下腸間膜動脈が出て、第4腰椎の高さで左右の総腸骨動脈に分かれ、下肢の動脈へ続く。上肢は鎖骨下動脈から腋窩動脈、上腕動脈、橈骨動脈と尺骨動脈へ続く。図の左が体の右側。</desc>
