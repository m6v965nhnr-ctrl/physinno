<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 730" width="680" height="730" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>脳神経が脳幹に出入りする位置（脳を下から見た模式図）</title>
<desc>脳を下から見た模式図。上に嗅球と視神経・視交叉、中央に脳幹（中脳・橋・延髄）と脊髄。動眼神経は中脳の脚間窩、滑車神経は中脳の背側、三叉神経は橋、外転神経と顔面神経と内耳神経は橋と延髄の境、舌咽神経と迷走神経と副神経は延髄のオリーブの背側、舌下神経はオリーブと錐体の間から出る。感覚・運動・混合を色分けし、動眼・顔面・舌咽・迷走神経には副交感線維を含む印を付けた。</desc>
