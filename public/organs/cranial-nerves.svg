<text x="20" y="704" dominant-baseline="central" font-size="13" fill="#2C2C2A">滑車神経（点線）は脳幹の背側から出ます。神経は左右一対ですが、片側だけを描いています。</text>
<text x="20" y="724" dominant-baseline="central" font-size="13" fill="#5F5E5A">出る位置の順序を示す模式図。大きさ・長さ・走行は実物と異なります。</text>
