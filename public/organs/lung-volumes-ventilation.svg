<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>スパイログラムと肺気量分画（模式図）</title><desc>安静呼吸の波、最大吸気、最大呼気を記録したスパイログラムの模式図。予備吸気量、1回換気量、予備呼気量、残気量の4つの1次分画と、全肺気量、肺活量、最大吸気量、機能的残気量の4つの2次分画の関係を示す。残気量はスパイロメトリーでは直接測れない。</desc><rect width="680" height="520" fill="#fff"/>
<rect x="70" y="335" width="360" height="70" fill="#F1EFE8" stroke="none"/><g stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"><line x1="70" y1="80" x2="430" y2="80"/><line x1="70" y1="205" x2="430" y2="205"/><line x1="70" y1="250" x2="430" y2="250"/><line x1="70" y1="335" x2="430" y2="335"/><line x1="70" y1="405" x2="430" y2="405" stroke="#5F5E5A" stroke-dasharray="none"/></g>
<line x1="70" y1="60" x2="70" y2="405" stroke="#5F5E5A" stroke-width="1.5"/><path d="M70 250 C80 250 80 205 90 205 C100 205 100 250 110 250 C120 250 120 205 130 205 C140 205 140 250 150 250 C160 250 160 205 170 205 C180 205 180 250 190 250 C205 250 215 80 230 80 L250 80 C265 80 275 335 290 335 L310 335 C322 335 322 250 332 250 C342 250 342 205 352 205 C362 205 362 250 372 250 C382 250 382 205 392 205" fill="none" stroke="#2C2C2A" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="430" y="80" width="82" height="125" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="471.0" y="142.5" text-anchor="middle" font-size="14">予備吸気量</text><rect x="430" y="205" width="82" height="45" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><text x="471.0" y="227.5" text-anchor="middle" font-size="14">1回換気量</text><rect x="430" y="250" width="82" height="85" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><text x="471.0" y="292.5" text-anchor="middle" font-size="14">予備呼気量</text><rect x="430" y="335" width="82" height="70" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="471.0" y="370.0" text-anchor="middle" font-size="14">残気量</text><rect x="534" y="80" width="30" height="325" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><rect x="570" y="80" width="30" height="255" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><rect x="606" y="80" width="30" height="170" fill="#F4C0D1" stroke="#993556" stroke-width="1"/><rect x="642" y="250" width="30" height="155" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><g font-size="14" fill="#2C2C2A" dominant-baseline="central"><text x="471" y="58" text-anchor="middle" font-weight="500">1次分画</text><text x="600" y="38" text-anchor="middle" font-weight="500">2次分画</text><text x="549" y="58" text-anchor="middle" font-size="13">TLC</text><text x="585" y="58" text-anchor="middle" font-size="13">VC</text><text x="621" y="58" text-anchor="middle" font-size="13">IC</text><text x="657" y="58" text-anchor="middle" font-size="13">FRC</text>
<text x="20" y="40" font-weight="500">肺気量 ↑</text><text x="76" y="182">安静呼吸</text><text x="196" y="62">最大吸気位</text><text x="262" y="354">最大呼気位</text><text x="80" y="382" fill="#5F5E5A">残気量（スパイロメトリーでは直接測れない）</text><text x="250" y="428" fill="#5F5E5A">時間 →</text>
<text x="340" y="462" text-anchor="middle">TLC＝全肺気量　VC＝肺活量　IC＝最大吸気量　FRC＝機能的残気量</text><text x="340" y="488" text-anchor="middle" fill="#5F5E5A">VC＝予備吸気量＋1回換気量＋予備呼気量　IC＝1回換気量＋予備吸気量　FRC＝予備呼気量＋残気量</text></g></svg>