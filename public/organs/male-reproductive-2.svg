<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>精子形成の模式図</title><desc>精細管の壁を、下の基底膜から上の内腔に向かって見た模式図。基底膜に接する精祖細胞（2n）が有糸分裂し、一部は一次精母細胞（2n）になる。一次精母細胞は減数分裂Iで2個の二次精母細胞（n）に、減数分裂IIで4個の精子細胞（n）になり、精子細胞が精子になって内腔へ放出される。セルトリ細胞は全段階の細胞を取り囲んで支える。精細管のあいだ（間質）にライディッヒ細胞がある。下にLH・FSHの作用を示す。</desc><defs><marker id="ah5F5E5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5F5E5A"/></marker><marker id="ah2C2C2A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker></defs><rect width="680" height="640" fill="#fff"/>
