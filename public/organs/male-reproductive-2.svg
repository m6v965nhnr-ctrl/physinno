<text x="345" y="397" text-anchor="start" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">有糸分裂（1個は精祖細胞のまま残る）</text>
<text x="345" y="358" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">一次精母細胞　2n</text>
<text x="345" y="314" text-anchor="start" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">減数分裂 I（2個の二次精母細胞になる）</text>
<text x="345" y="278" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">二次精母細胞　n（23本）×2</text>
