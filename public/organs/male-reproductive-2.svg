<text x="345" y="198" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">精子細胞　n ×4</text>
<text x="345" y="153" text-anchor="start" font-size="12.5" font-weight="400" fill="#5F5E5A" dominant-baseline="central">精子細胞が精子になる（変態）</text>
<text x="345" y="118" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">精子　n ×4</text>
