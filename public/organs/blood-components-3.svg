<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" width="680" height="530" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>造血の系統図（造血幹細胞から各血球まで）</title><desc>赤色骨髄の造血幹細胞は、骨髄系幹細胞とリンパ系幹細胞に分かれる。骨髄系幹細胞から、赤血球（エリスロポエチンが促す）、巨核球を経て血小板（トロンボポエチンが促す）、骨髄芽球系の好中球・好酸球・好塩基球と単球ができる。リンパ系幹細胞からB細胞（骨髄で成熟）、T細胞（胸腺で成熟）、NK細胞ができる。B細胞は活性化されて形質細胞になる。</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker></defs>
<rect width="680" height="530" fill="#fff"/>
<rect x="210" y="16" width="260" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2" />
<text x="340.0" y="38.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">造血幹細胞（赤色骨髄）</text>
<rect x="100" y="106" width="260" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="230.0" y="128.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">骨髄系幹細胞</text>
<rect x="500" y="106" width="160" height="44" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2" />
<text x="580.0" y="128.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">リンパ系幹細胞</text>
<path d="M300 62 L230 104" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M400 62 L560 104" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="20" y="196" width="100" height="52" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="70.0" y="213.5" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">赤芽球系</text>
<text x="70.0" y="230.5" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">網赤血球を経る</text>
<rect x="130" y="196" width="100" height="52" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="180.0" y="222.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">巨核球</text>
<rect x="240" y="196" width="230" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2" />
<text x="355.0" y="222.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">骨髄芽球系</text>
<path d="M160 152 L70 194" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M200 152 L180 194" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M290 152 L330 194" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="20" y="320" width="100" height="44" rx="8" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.2" />
<text x="70.0" y="342.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">赤血球</text>
<rect x="130" y="320" width="100" height="44" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="180.0" y="342.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">血小板</text>
<rect x="240" y="320" width="110" height="64" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2" />
<text x="295.0" y="335.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">顆粒球</text>
<text x="295.0" y="352.0" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">好中球・好酸球</text>
<text x="295.0" y="369.0" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">・好塩基球</text>
<rect x="360" y="320" width="110" height="64" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2" />
<text x="415.0" y="335.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">単球</text>
<text x="415.0" y="352.0" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">組織で</text>
<text x="415.0" y="369.0" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">マクロファージに</text>
<path d="M70 250 L70 318" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M180 250 L180 318" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M295 250 L295 318" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M415 250 L415 318" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="78" y="284" text-anchor="start" font-size="12" font-weight="500" fill="#993C1D" dominant-baseline="central">EPO（腎臓）</text>
<text x="188" y="284" text-anchor="start" font-size="12" font-weight="500" fill="#854F0B" dominant-baseline="central">トロンボポエチン</text>
<rect x="500" y="196" width="160" height="52" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2" />
<text x="580.0" y="213.5" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">B細胞</text>
<text x="580.0" y="230.5" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">（骨髄で成熟）</text>
<rect x="500" y="270" width="160" height="36" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2" />
<text x="580.0" y="288.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">形質細胞（抗体）</text>
<rect x="500" y="330" width="160" height="52" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2" />
<text x="580.0" y="347.5" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">T細胞</text>
<text x="580.0" y="364.5" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">（胸腺で成熟）</text>
<rect x="500" y="402" width="160" height="36" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2" />
<text x="580.0" y="420.0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">NK細胞</text>
<path d="M500 128 L484 128 L484 420" fill="none" stroke="#2C2C2A" stroke-width="1.8"/>
<path d="M484 222 L498 222" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M484 356 L498 356" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M484 420 L498 420" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M580 250 L580 268" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<text x="588" y="259" text-anchor="start" font-size="11" fill="#2C2C2A" dominant-baseline="central">活性化</text>
<text x="20" y="462" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">EPO＝エリスロポエチン。造血を促す因子には、ほかにコロニー刺激因子とインターロイキンがある。</text>
<text x="20" y="482" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">模式図。中間の前駆細胞（〜芽球）は省略した。NK細胞は自然免疫のリンパ球。</text>
<text x="20" y="502" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">マクロファージは、単球が血管を出て組織に入ったもの。</text>
</svg>