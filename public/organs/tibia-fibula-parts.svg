<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>脛骨・腓骨の各部（前面）（模式図）</title><desc>右の下腿骨を前から見た模式図。内側（右）の太い骨が脛骨、外側（左）の細い骨が腓骨。脛骨の近位は内側顆と外側顆に広がり、その間に顆間隆起。顆の下の前面に脛骨粗面、外側顆の前外側にガーディ結節。脛骨の前縁（脛骨稜）が脛骨粗面から下へ走る。遠位の内側が内果。腓骨は、近位に腓骨頭が脛骨外側顆の下に接して上脛腓関節をつくり、その下の細い部分が腓骨頸、遠位が外果。脛骨と腓骨の間は骨間膜（骨間縁に付く）でつながり、遠位では脛骨の腓骨切痕に腓骨が接して下脛腓関節をつくる。</desc>
