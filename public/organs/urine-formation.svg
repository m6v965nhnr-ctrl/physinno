<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 616" width="680" height="616" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>ネフロンの各部位での再吸収と分泌（模式図）</title><desc>ネフロンの各部位での再吸収と分泌の模式図。近位尿細管で水・Naの約65％とグルコース・アミノ酸のほぼ全部が再吸収され、H＋などが分泌される。下行脚では水が出て濾液が濃くなり、上行脚（太い部分）では水を通さずNaClが再吸収されて濾液が薄くなる。遠位尿細管ではNaが再吸収されKが分泌され、集合管ではADHで水が、アルドステロンでNaが再吸収される。</desc>
