<text x="26" y="208" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">近位尿細管（再吸収の中心）</text>
<text x="26" y="236" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">水 約67％・Na＋ 約65％・K＋ 約65％</text>
<text x="26" y="255" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">グルコース・アミノ酸・ビタミン ほぼ100％</text>
<text x="26" y="274" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">HCO3− 80〜90％・リン酸 約85％</text>
<text x="26" y="293" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">【分泌】H＋・NH4＋・クレアチニン・薬物</text>
<rect x="16" y="336" width="262" height="68" rx="8" fill="#fff" stroke="#3B6D11" stroke-width="1.5"/>
<rect x="16" y="336" width="262" height="24" rx="8" fill="#C0DD97"/><rect x="16" y="348" width="262" height="12" fill="#C0DD97"/>
<text x="26" y="348" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">下行脚（細い部分）</text>
<text x="26" y="376" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">水が出る（浸透圧で約15％）</text>
<text x="26" y="395" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">濾液は濃くなる（〜約1,200 mOsm/kg）</text>
<rect x="414" y="300" width="150" height="106" rx="8" fill="#fff" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="414" y="300" width="150" height="24" rx="8" fill="#9FE1CB"/><rect x="414" y="312" width="150" height="12" fill="#9FE1CB"/>
<text x="424" y="312" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">上行脚（太い部分）</text>
<text x="424" y="340" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">NaClを再吸収</text>
<text x="424" y="359" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">Na＋ 約25％</text>
<text x="424" y="378" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">水は通さない</text>
<text x="424" y="397" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">濾液は薄くなる</text>
<rect x="414" y="176" width="150" height="106" rx="8" fill="#fff" stroke="#854F0B" stroke-width="1.5"/>
<rect x="414" y="176" width="150" height="24" rx="8" fill="#FAC775"/><rect x="414" y="188" width="150" height="12" fill="#FAC775"/>
<text x="424" y="188" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">遠位尿細管</text>
<text x="424" y="216" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">Na＋ 約5％を再吸収</text>
<text x="424" y="235" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">Ca2＋（PTH）再吸収</text>
<text x="424" y="254" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">ADHで水 約8％</text>
<text x="424" y="273" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">【分泌】K＋・H＋</text>
<rect x="414" y="438" width="150" height="106" rx="8" fill="#fff" stroke="#534AB7" stroke-width="1.5"/>
<rect x="414" y="438" width="150" height="24" rx="8" fill="#CECBF6"/><rect x="414" y="450" width="150" height="12" fill="#CECBF6"/>
<text x="424" y="450" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">集合管</text>
<text x="424" y="478" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">ADHで水を再吸収</text>
<text x="424" y="497" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">Na＋ 約5％</text>
<text x="424" y="516" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">（アルドステロン）</text>
<text x="424" y="535" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">【分泌】K＋・H＋</text>
