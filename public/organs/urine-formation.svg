<text x="62" y="578" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">再吸収（尿細管から間質・血液へ）</text>
<text x="20" y="598" text-anchor="start" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">【分泌】は尿細管の中へ出される。割合は、濾液中の量に対する目安（OpenStaxの表）。</text>
