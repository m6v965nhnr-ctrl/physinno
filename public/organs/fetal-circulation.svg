<path d="M240 372 L438 372" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round" marker-end="url(#ab)"/>
<path d="M500 392 L500 450" fill="none" stroke="#534AB7" stroke-width="3" stroke-linecap="round" marker-end="url(#ap)"/>
