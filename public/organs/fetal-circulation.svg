<text x="340" y="386" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">動脈管</text>
<text x="240" y="106" text-anchor="start" font-size="13" fill="#2C2C2A" dominant-baseline="central">上大静脈</text>
<text x="630" y="150" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">大動脈弓から</text>
<text x="630" y="168" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">上半身へ</text>
<text x="552" y="590" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">臍動脈</text>
<text x="552" y="610" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">（2本）</text>
<text x="352" y="586" text-anchor="start" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">臍静脈</text>
<text x="272" y="584" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">静脈管</text>
<path d="M320 480 L262 462" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ap)"/>
<text x="296" y="474" text-anchor="start" font-size="11" fill="#2C2C2A" dominant-baseline="central"></text>
<line x1="20" y1="690" x2="50" y2="690" stroke="#A32D2D" stroke-width="4"/>
<text x="58" y="690" text-anchor="start" font-size="13" fill="#2C2C2A" dominant-baseline="central">酸素が多い血液</text>
<line x1="235" y1="690" x2="265" y2="690" stroke="#534AB7" stroke-width="4"/>
<text x="273" y="690" text-anchor="start" font-size="13" fill="#2C2C2A" dominant-baseline="central">中間（混ざった血液）</text>
<line x1="450" y1="690" x2="480" y2="690" stroke="#185FA5" stroke-width="4"/>
<text x="488" y="690" text-anchor="start" font-size="13" fill="#2C2C2A" dominant-baseline="central">酸素が少ない血液</text>
<text x="20" y="720" text-anchor="start" font-size="12" fill="#2C2C2A" dominant-baseline="central">色は酸素の多少の目安。肺を流れる血液はわずかで、肺から戻る血液も図では省略した。</text>
