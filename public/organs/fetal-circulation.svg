<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 740" width="680" height="740" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>胎児の血液循環（模式図）</title><desc>胎児の血液循環の模式図。胎盤からの臍静脈の血液は一部が肝臓を通り、一部は静脈管を通って下大静脈に入り、右心房から卵円孔を通って左心房へ向かう。上大静脈の血液は右心房から右心室、肺動脈幹に入り、大部分は動脈管を通って大動脈へ流れる。胎児の肺を流れる血液はわずかである。臍動脈が血液を胎盤へ運ぶ。</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker></defs>
<rect width="680" height="740" fill="#fff"/>
<rect x="250" y="16" width="180" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<text x="340" y="36" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">頭・上肢（上半身）</text>
<rect x="120" y="130" width="120" height="50" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2" />
<text x="180" y="155" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">右心房</text>
<rect x="440" y="130" width="120" height="50" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2" />
<text x="500" y="155" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">左心房</text>
<rect x="120" y="250" width="120" height="50" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="180" y="275" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">右心室</text>
<rect x="440" y="250" width="120" height="50" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="500" y="275" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">左心室</text>
<rect x="120" y="350" width="120" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="180" y="370" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">肺動脈幹</text>
<rect x="290" y="300" width="100" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<text x="340" y="320" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">肺</text>
<rect x="440" y="350" width="120" height="40" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="500" y="370" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">大動脈</text>
<rect x="440" y="452" width="120" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<text x="500" y="472" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">下半身</text>
<rect x="150" y="420" width="110" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2" />
<text x="205" y="440" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">下大静脈</text>
<rect x="270" y="482" width="140" height="52" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="340" y="508" text-anchor="middle" font-size="14" fill="#2C2C2A" dominant-baseline="central">肝臓</text>
