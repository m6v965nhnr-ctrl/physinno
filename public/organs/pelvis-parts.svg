<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>骨盤の各部（前面）（模式図）</title><desc>骨盤を前から見た模式図。中央に仙骨（上端の前縁が岬角）、左右に寛骨（腸骨・恥骨・坐骨）。腸骨は上の広がった部分（腸骨翼）で、上縁が腸骨稜、前端が上前腸骨棘、その下に下前腸骨棘、内面のくぼみが腸骨窩。寛骨の外側にくぼみの寛骨臼、その内下方に大きな孔の閉鎖孔。左右の恥骨は正中の恥骨結合でつながり、上縁近くに恥骨結節、恥骨上枝の上縁に恥骨櫛。坐骨の下端が坐骨結節。左右の恥骨下枝がつくる角が恥骨下角。赤い点線は分界線（岬角・弓状線・恥骨櫛・恥骨結合上縁）で、これより上が大骨盤、下が小骨盤。</desc>
