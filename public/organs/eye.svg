<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>眼球の断面（各部の名前）</title><desc>眼を水平に切った断面の模式図。前方に角膜、その奥に前房（房水）、虹彩と瞳孔、水晶体。毛様体から毛様体小帯が水晶体につながる。眼球の壁は外側から強膜、脈絡膜、網膜の順。眼球の後ろの空間は硝子体。網膜の中央に中心窩、少し離れて視神経乳頭があり、視神経が眼球から出る。</desc>
