0" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="476.0" cy="270.0" r="2.2" fill="#2C2C2A"/><text x="575" y="262" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">中心窩</text><line x1="571" y1="310" x2="405" y2="240" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="405" cy="240" r="2.2" fill="#2C2C2A"/><text x="575" y="310" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">硝子体</text><line x1="571" y1="395" x2="533.0" y2="323.1" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="533.0" cy="323.1" r="2.2" fill="#2C2C2A"/><text x="575" y="395" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視神経</text><line x1="571" y1="458" x2="475.1" y2="307.5" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="475.1" cy="307.5" r="2.2" fill="#2C2C2A"/><text x="575" y="458" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視神経乳頭</text><text x="575" y="480" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">（盲点）</text><text x="20" y="546" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">眼を水平に切った断面の模式図（前が左）。位置関係を示すもので、大きさ・厚さ・形は実物と異なります。</text>
