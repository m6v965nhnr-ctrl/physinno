<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>血中カルシウムの調節（副甲状腺ホルモンとカルシトニン）</title><desc>血中カルシウムが下がると副甲状腺から副甲状腺ホルモンが出て、骨吸収の促進、腎での遠位尿細管のカルシウム再吸収の促進とリン再吸収の抑制、腎でのビタミンDの活性化とそれによる腸でのカルシウム吸収の促進により、血中カルシウムが上がる。血中カルシウムが上がると甲状腺の傍濾胞細胞からカルシトニンが出て、血中カルシウムを下げる方向に働く。</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#854F0B"/></marker></defs><rect width="680" height="500" fill="#fff"/><rect x="80" y="20" width="280" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="220" y="40" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">血中カルシウムの低下</text><path d="M220 62 L220 98" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><rect x="80" y="100" width="280" height="56" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><text x="220" y="118" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">副甲状腺（主細胞）</text><text x="220" y="140" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">副甲状腺ホルモン（PTH）分泌↑</text><path d="M150 158 L80 206" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><path d="M220 158 L216 206" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><path d="M290 158 L352 206" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="14" y="208" width="132" height="132" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="80" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">骨</text><text x="80" y="252" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">破骨細胞を活性化</text><text x="80" y="272" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">骨吸収↑</text><text x="80" y="292" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">Ca・リンが</text><text x="80" y="312" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">血中へ</text><rect x="150" y="208" width="132" height="132" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="216" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">腎（尿細管）</text><text x="216" y="252" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">遠位尿細管で</text><text x="216" y="272" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">Ca再吸収↑</text><text x="216" y="292" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">リン再吸収↓</text><text x="216" y="312" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">（リン排泄↑）</text><rect x="286" y="208" width="132" height="132" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="352" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">腎 → 腸</text><text x="352" y="252" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">ビタミンDを</text><text x="352" y="272" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">活性型に変換</text><text x="352" y="292" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">腸でのCa</text><text x="352" y="312" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">吸収↑</text><path d="M80 342 L150 388" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><path d="M216 342 L216 388" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><path d="M352 342 L282 388" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="60" y="390" width="320" height="52" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="220" y="408" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">血中カルシウムの上昇</text><text x="220" y="428" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">血中リンの低下</text><path d="M60 416 L6 416 L6 128 L78 128" fill="none" stroke="#A32D2D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="220" y="474" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">血中Caが上がるとPTHの分泌が抑えられる（負のフィードバック）</text><rect x="450" y="20" width="214" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="557" y="40" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">血中カルシウムの上昇</text><path d="M557 62 L557 98" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><rect x="450" y="100" width="214" height="56" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/><text x="557" y="118" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">甲状腺（傍濾胞細胞）</text><text x="557" y="140" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">カルシトニン分泌↑</text><path d="M557 158 L557 206" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="450" y="208" width="214" height="132" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="557" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">カルシトニンの作用</text><text x="557" y="252" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">破骨細胞の活性↓</text><text x="557" y="272" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">腸でのCa吸収↓</text><text x="557" y="292" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">腎でのCa排泄↑</text><path d="M557 342 L557 388" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="450" y="390" width="214" height="52" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="557" y="416" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">血中カルシウムの低下</text><text x="557" y="466" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">通常のCa維持での重要性は</text><text x="557" y="486" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">大きくないとされる</text></svg>