<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>運動学習の3段階とフィードバックの流れ</title><desc>上段は、Fitts と Posner の運動学習の3段階。認知段階は、何をするかを理解し、遂行にばらつきがあり、改善が速く、多くの注意が必要。連合段階は、改善の速さが鈍り、遂行の一貫性が高まり、注意の要求が減り始める。自動化段階は、高い水準を最小の注意で保ち、複数の技能を同時に遂行できる。下段はフィードバックの流れ。学習者の運動から、体性感覚・視覚・聴覚などの内在的フィードバックが学習者に戻る。外から与える外在的フィードバックには、運動パターンについてのパフォーマンスの知識（KP）と、結果についての結果の知識（KR）がある。</desc><rect width="680" height="580" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#888780"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker></defs><text x="340" y="18" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">運動学習の3段階（Fitts と Posner）</text>
<rect x="20" y="38" width="190" height="40" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="115" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">認知段階</text>
<rect x="245" y="38" width="190" height="40" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">連合段階</text>
<rect x="470" y="38" width="190" height="40" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="565" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">自動化段階（自律段階）</text>
<path d="M212 58 L243 58" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#ar)"/>
<path d="M437 58 L468 58" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#ar)"/>
<text x="28" y="100" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">何をするかを理解する</text>
<text x="28" y="118" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">遂行にばらつきがある</text>
<text x="28" y="136" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">改善が速い</text>
<text x="28" y="154" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">多くの注意が必要</text>
<text x="253" y="100" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">改善の速さが鈍る</text>
<text x="253" y="118" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">遂行の一貫性が高まる</text>
<text x="253" y="136" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">注意の要求が減り始める</text>
<text x="478" y="100" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">高い水準を最小の注意で保つ</text>
<text x="478" y="118" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">複数の技能を同時にできる</text>
<text x="478" y="136" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#5F5E5A">（例：歌いながら</text>
<text x="478" y="154" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#5F5E5A">ギターを弾く）</text>
<text x="340" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">3つの段階の間に、はっきりした境界はなく、技能は次第に向上する</text>
<path d="M20 222 L660 222" fill="none" stroke="#B4B2A9" stroke-width="0.7" stroke-dasharray="4 3"/>
<text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">フィードバックの流れ</text>
<text x="205" y="262" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">内在的フィードバック</text>
<text x="205" y="279" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">（体性感覚・視覚・聴覚・前庭感覚・自己受容感覚）</text>
<path d="M330 338 L330 300 L80 300 L80 338" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="340" width="120" height="44" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="80" y="362" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">学習者</text>
<rect x="270" y="340" width="120" height="44" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="330" y="362" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">運動（動作）</text>
<rect x="520" y="340" width="140" height="44" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="590" y="362" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">運動の結果</text>
<path d="M142 362 L268 362" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#ar)"/>
<path d="M392 362 L518 362" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#ar)"/>
<rect x="150" y="452" width="460" height="44" rx="6" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="380" y="474" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">外在的（付加的）フィードバック：外から与える情報</text>
<path d="M330 386 L330 450" fill="none" stroke="#993C1D" stroke-width="2" marker-end="url(#ar)"/>
<path d="M590 386 L590 450" fill="none" stroke="#993C1D" stroke-width="2" marker-end="url(#ar)"/>
<path d="M148 474 L80 474 L80 388" fill="none" stroke="#993C1D" stroke-width="2" marker-end="url(#ar)"/>
<text x="322" y="412" text-anchor="end" dominant-baseline="central" font-size="13.5" fill="#2C2C2A">KP（パフォーマンスの知識）</text>
<text x="322" y="430" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">運動パターンについての情報</text>
<text x="582" y="412" text-anchor="end" dominant-baseline="central" font-size="13.5" fill="#2C2C2A">KR（結果の知識）</text>
<text x="582" y="430" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">結果についての情報</text>
<text x="340" y="522" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">外在的フィードバックは、練習の初期は多く、上達につれて減らす（漸減的）。</text>
<text x="340" y="540" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">多く与えすぎると、取り除いたときに成績が下がる（依存性産出効果）。</text></svg>
