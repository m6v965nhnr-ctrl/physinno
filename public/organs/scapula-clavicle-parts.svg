<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 960" width="680" height="960" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>肩甲骨の各部（後面と前面の模式図）</title><desc>右の肩甲骨。上は後ろから見た図。内側（図の左）に長い内側縁、上に上縁、外側に外側縁があり、内側縁と上縁の間が上角、内側縁と外側縁の間が下角。後面を横切る隆起が肩甲棘で、その上が棘上窩、下が棘下窩。肩甲棘の外側端が肩峰で、関節窩の上に張り出す。上縁の外寄りに肩甲切痕があり、肩甲上神経が通る。下は前から見た図（左右が反転する）。肋骨側の面全体がくぼんだ肩甲下窩。外側の角に関節窩があり、その上に関節上結節、下に関節下結節。上縁の外側端から前へ烏口突起が出る。</desc><rect width="680" height="960" fill="#fff"/><defs><clipPath id="sp"><path d="M 245,100 L 320,88 Q 355,76 378,96 Q 404,116 402,146 Q 398,176 382,200 L 345,320 Q 310,390 275,430 Q 252,370 248,280 Q 240,190 245,100 Z"/></clipPath><clipPath id="sa"><path d="M 435,560 L 360,548 Q 325,536 302,556 Q 276,576 278,606 Q 282,636 298,660 L 335,780 Q 370,850 405,890 Q 428,830 432,740 Q 440,650 435,560 Z"/></clipPath></defs><text x="340" y="34" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">後面（右の肩甲骨を後ろから見る）</text>
