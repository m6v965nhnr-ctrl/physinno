<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>副腎の断面（皮質3層と髄質）とホルモン</title><desc>副腎の断面の模式図。外側から被膜、皮質（球状層、束状層、網状層）、中心に髄質がある。球状層は鉱質コルチコイド（アルドステロン）、束状層は糖質コルチコイド（コルチゾール）、網状層は副腎アンドロゲン、髄質はアドレナリンとノルアドレナリンを分泌する。</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#854F0B"/></marker></defs><rect width="680" height="540" fill="#fff"/><ellipse cx="190" cy="270" rx="150" ry="202" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><ellipse cx="190" cy="270" rx="142" ry="192" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><ellipse cx="190" cy="270" rx="132" ry="178" fill="#FAC775" stroke="#854F0B" stroke-width="0.8"/><ellipse cx="190" cy="270" rx="96" ry="130" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.8"/><ellipse cx="190" cy="270" rx="76" ry="103" fill="#F4C0D1" stroke="#993556" stroke-width="0.8"/><text x="420" y="95" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">球状層</text><text x="420" y="117" font-size="13" fill="#2C2C2A" dominant-baseline="central">鉱質コルチコイド（アルドステロン）</text><text x="420" y="137" font-size="12.5" fill="#5F5E5A" dominant-baseline="central">調節: アンジオテンシンII・血中K</text><path d="M416 103 L254 107" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><circle cx="254" cy="107" r="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="420" y="190" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">束状層</text><text x="420" y="212" font-size="13" fill="#2C2C2A" dominant-baseline="central">糖質コルチコイド（コルチゾール）</text><text x="420" y="232" font-size="12.5" fill="#5F5E5A" dominant-baseline="central">調節: ACTH</text><path d="M416 198 L280 175" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><circle cx="280" cy="175" r="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="420" y="285" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">網状層</text><text x="420" y="307" font-size="13" fill="#2C2C2A" dominant-baseline="central">副腎アンドロゲン</text><text x="420" y="327" font-size="12.5" fill="#5F5E5A" dominant-baseline="central">調節: ACTH</text><path d="M416 293 L273 242" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><circle cx="273" cy="242" r="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="420" y="380" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">髄質</text><text x="420" y="402" font-size="13" fill="#2C2C2A" dominant-baseline="central">アドレナリン・ノルアドレナリン</text><text x="420" y="422" font-size="12.5" fill="#5F5E5A" dominant-baseline="central">調節: 交感神経</text><path d="M416 388 L225 297" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><circle cx="225" cy="297" r="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="20" y="150" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">被膜</text><path d="M56 150 L 106 109" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/><text x="20" y="498" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">皮質</text><text x="20" y="518" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">（ステロイドホルモン）</text><path d="M50 490 L91 347" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/></svg>