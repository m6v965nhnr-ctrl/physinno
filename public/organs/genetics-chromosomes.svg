<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 610" width="680" height="610" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>遺伝の様式（家系図のパターン）</title><desc>常染色体優性遺伝、常染色体劣性遺伝、X連鎖劣性遺伝の家系図の模式図。四角が男性、丸が女性、塗りつぶしが発症者、点のある記号が保因者を示す。</desc><rect width="680" height="610" fill="#fff"/>
<text x="20" y="40" font-size="15" font-weight="500" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">常染色体優性遺伝</text><rect x="152.0" y="69.0" width="26" height="26" fill="#534AB7" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="265" cy="82" r="13.0" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><line x1="178" y1="82" x2="252" y2="82" stroke="#2C2C2A" stroke-width="1.6"/><line x1="215" y1="82" x2="215" y2="110" stroke="#2C2C2A" stroke-width="1.6"/><line x1="110" y1="110" x2="320" y2="110" stroke="#2C2C2A" stroke-width="1.6"/><line x1="110" y1="110" x2="110" y2="135" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="110" cy="148" r="13.0" fill="#534AB7" stroke="#2C2C2A" stroke-width="1.6"/><line x1="180" y1="110" x2="180" y2="135" stroke="#2C2C2A" stroke-width="1.6"/><rect x="167.0" y="135.0" width="26" height="26" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><line x1="250" y1="110" x2="250" y2="135" stroke="#2C2C2A" stroke-width="1.6"/><rect x="237.0" y="135.0" width="26" height="26" fill="#534AB7" stroke="#2C2C2A" stroke-width="1.6"/><line x1="320" y1="110" x2="320" y2="135" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="320" cy="148" r="13.0" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><text x="390" y="64" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">異常なアレルが1つあれば発症する</text><text x="390" y="84" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">患者の子は、男女とも50%が発症する</text><text x="390" y="104" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">例: ハンチントン病・マルファン症候群・</text><text x="390" y="124" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">神経線維腫症・筋強直性ジストロフィー</text><text x="20" y="220" font-size="15" font-weight="500" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">常染色体劣性遺伝</text><rect x="152.0" y="249.0" width="26" height="26" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="165" cy="262" r="4.5" fill="#534AB7"/><circle cx="265" cy="262" r="13.0" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="265" cy="262" r="4.5" fill="#534AB7"/><line x1="178" y1="262" x2="252" y2="262" stroke="#2C2C2A" stroke-width="1.6"/><line x1="215" y1="262" x2="215" y2="290" stroke="#2C2C2A" stroke-width="1.6"/><line x1="110" y1="290" x2="320" y2="290" stroke="#2C2C2A" stroke-width="1.6"/><line x1="110" y1="290" x2="110" y2="315" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="110" cy="328" r="13.0" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><line x1="180" y1="290" x2="180" y2="315" stroke="#2C2C2A" stroke-width="1.6"/><rect x="167.0" y="315.0" width="26" height="26" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="180" cy="328" r="4.5" fill="#534AB7"/><line x1="250" y1="290" x2="250" y2="315" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="250" cy="328" r="13.0" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="250" cy="328" r="4.5" fill="#534AB7"/><line x1="320" y1="290" x2="320" y2="315" stroke="#2C2C2A" stroke-width="1.6"/><rect x="307.0" y="315.0" width="26" height="26" fill="#534AB7" stroke="#2C2C2A" stroke-width="1.6"/><text x="390" y="244" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">異常なアレルが2つそろうと発症する</text><text x="390" y="264" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">親は保因者（症状なし）</text><text x="390" y="284" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">子は25%が発症する</text><text x="390" y="304" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">例: フェニルケトン尿症・嚢胞性線維症・</text><text x="390" y="324" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">鎌状赤血球症</text><text x="20" y="400" font-size="15" font-weight="500" fill="#2C2C2A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">X連鎖劣性遺伝</text><rect x="152.0" y="429.0" width="26" height="26" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="265" cy="442" r="13.0" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="265" cy="442" r="4.5" fill="#534AB7"/><line x1="178" y1="442" x2="252" y2="442" stroke="#2C2C2A" stroke-width="1.6"/><line x1="215" y1="442" x2="215" y2="470" stroke="#2C2C2A" stroke-width="1.6"/><line x1="110" y1="470" x2="320" y2="470" stroke="#2C2C2A" stroke-width="1.6"/><line x1="110" y1="470" x2="110" y2="495" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="110" cy="508" r="13.0" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><line x1="180" y1="470" x2="180" y2="495" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="180" cy="508" r="13.0" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="180" cy="508" r="4.5" fill="#534AB7"/><line x1="250" y1="470" x2="250" y2="495" stroke="#2C2C2A" stroke-width="1.6"/><rect x="237.0" y="495.0" width="26" height="26" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><line x1="320" y1="470" x2="320" y2="495" stroke="#2C2C2A" stroke-width="1.6"/><rect x="307.0" y="495.0" width="26" height="26" fill="#534AB7" stroke="#2C2C2A" stroke-width="1.6"/><text x="390" y="424" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">保因者の母と正常な父では、</text><text x="390" y="444" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">息子の50%が発症する</text><text x="390" y="464" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">娘は発症せず、50%が保因者になる</text><text x="390" y="484" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">例: 血友病・色覚異常・</text><text x="390" y="504" font-size="12.5" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">デュシェンヌ型筋ジストロフィー</text><g><rect x="31.0" y="551.0" width="18" height="18" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><text x="56" y="560" font-size="12" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">男性</text><circle cx="110" cy="560" r="9.0" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><text x="126" y="560" font-size="12" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">女性</text><rect x="181.0" y="551.0" width="18" height="18" fill="#534AB7" stroke="#2C2C2A" stroke-width="1.6"/><text x="206" y="560" font-size="12" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">発症している</text><circle cx="310" cy="560" r="9.0" fill="#fff" stroke="#2C2C2A" stroke-width="1.6"/><circle cx="310" cy="560" r="3.1" fill="#534AB7"/><text x="326" y="560" font-size="12" fill="#2C2C2A" dominant-baseline="central" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">保因者（症状なし）</text></g>
<line x1="20" y1="190" x2="660" y2="190" stroke="#D3D1C7" stroke-width="1"/><line x1="20" y1="370" x2="660" y2="370" stroke="#D3D1C7" stroke-width="1"/>
<text x="20" y="592" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">代表的な例を示した模式図です。実際の家系では、子の数や男女の組み合わせはさまざまで、割合は確率です。</text>
</svg>
