<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 584" width="680" height="584" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>気管から肺胞までの分かれ方（模式図）</title><desc>気管、主気管支、葉気管支、区域気管支、細気管支、終末細気管支までが導管部で、ガス交換には直接関わらない。呼吸細気管支、肺胞管、肺胞嚢・肺胞がある呼吸部でガス交換が行われる。</desc><rect width="680" height="584" fill="#fff"/><g font-size="14" fill="#2C2C2A" dominant-baseline="central"><rect x="40" y="24" width="200" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="140" y="44.0" text-anchor="middle" font-weight="500">気管</text><text x="256" y="44.0">C字形の硝子軟骨（16〜20個）</text><line x1="140" y1="64" x2="140" y2="79" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="135,76 145,76 140,83" fill="#5F5E5A"/><rect x="40" y="84" width="200" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="140" y="104.0" text-anchor="middle" font-weight="500">主気管支</text><text x="256" y="104.0">軟骨の輪がある</text><line x1="140" y1="124" x2="140" y2="139" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="135,136 145,136 140,143" fill="#5F5E5A"/><rect x="40" y="144" width="200" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="140" y="164.0" text-anchor="middle" font-weight="500">葉気管支</text><text x="256" y="164.0">右3（上・中・下）、左2（上・下）</text><line x1="140" y1="184" x2="140" y2="199" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="135,196 145,196 140,203" fill="#5F5E5A"/><rect x="40" y="204" width="200" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="140" y="224.0" text-anchor="middle" font-weight="500">区域気管支</text><text x="256" y="224.0">右10（B1〜B10）、左8（B7なし）</text><line x1="140" y1="244" x2="140" y2="259" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="135,256 145,256 140,263" fill="#5F5E5A"/><rect x="40" y="264" width="200" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="140" y="284.0" text-anchor="middle" font-weight="500">細気管支</text><text x="256" y="284.0">軟骨なし、径約1 mm、平滑筋の壁</text><line x1="140" y1="304" x2="140" y2="319" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="135,316 145,316 140,323" fill="#5F5E5A"/><rect x="40" y="324" width="200" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><text x="140" y="344.0" text-anchor="middle" font-weight="500">終末細気管支</text><text x="256" y="344.0">各肺に1000本以上</text><line x1="140" y1="364" x2="140" y2="379" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="135,376 145,376 140,383" fill="#5F5E5A"/><rect x="40" y="384" width="200" height="40" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1"/><text x="140" y="404.0" text-anchor="middle" font-weight="500">呼吸細気管支</text><text x="256" y="404.0">ここからガス交換が始まる</text><line x1="140" y1="424" x2="140" y2="439" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="135,436 145,436 140,443" fill="#5F5E5A"/><rect x="40" y="444" width="200" height="40" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1"/><text x="140" y="464.0" text-anchor="middle" font-weight="500">肺胞管</text><text x="256" y="464.0">平滑筋と結合組織の管</text><line x1="140" y1="484" x2="140" y2="499" stroke="#5F5E5A" stroke-width="1.2"/><polygon points="135,496 145,496 140,503" fill="#5F5E5A"/><rect x="40" y="504" width="200" height="40" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1"/><text x="140" y="524.0" text-anchor="middle" font-weight="500">肺胞嚢・肺胞</text><text x="256" y="524.0">肺胞の集まりが肺胞嚢</text><path d="M552 24 L560 24 L560 364 L552 364" fill="none" stroke="#185FA5" stroke-width="1.5"/><text x="570" y="184.0" font-weight="500" fill="#185FA5">導管部</text><text x="570" y="206.0" fill="#2C2C2A">ガス交換なし</text><path d="M552 384 L560 384 L560 544 L552 544" fill="none" stroke="#993556" stroke-width="1.5"/><text x="570" y="454.0" font-weight="500" fill="#993556">呼吸部</text><text x="570" y="476.0" fill="#2C2C2A">ガス交換あり</text></g></svg>