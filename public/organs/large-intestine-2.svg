<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" width="680" height="690" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>結腸の特徴的な構造と肛門管の括約筋の模式図</title><desc>上は結腸を外から見た模式図で、縦走筋の3本の帯である結腸ヒモ、袋状の結腸膨起、脂肪の入った腹膜垂を示す。下は直腸と肛門管の断面の模式図で、内側の平滑筋の内肛門括約筋、外側の骨格筋の外肛門括約筋、歯状線を示す。</desc><rect width="680" height="690" fill="#fff"/>
<text x="20" y="34" font-size="14" font-weight="500" fill="#5F5E5A">結腸（外から見た図）</text>
<path d="M30 140 Q67 105 105 140 Q142 105 180 140 Q217 105 255 140 Q292 105 330 140 L330 220 Q292 255 255 220 Q217 255 180 220 Q142 255 105 220 Q67 255 30 220 Z" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/>
<g stroke="#A32D2D" stroke-width="4" stroke-linecap="round"><line x1="34" y1="158" x2="326" y2="158"/><line x1="34" y1="180" x2="326" y2="180"/><line x1="34" y1="202" x2="326" y2="202"/></g>
<g stroke="#993C1D" stroke-width="1" stroke-dasharray="3 3" fill="none"><line x1="105" y1="140" x2="105" y2="220"/><line x1="180" y1="140" x2="180" y2="220"/><line x1="255" y1="140" x2="255" y2="220"/></g>
<g stroke="#854F0B" stroke-width="1" fill="#FAC775"><line x1="67" y1="236" x2="67" y2="250"/><line x1="142" y1="236" x2="142" y2="250"/><line x1="217" y1="236" x2="217" y2="250"/><line x1="292" y1="236" x2="292" y2="250"/><circle cx="67" cy="260" r="10"/><circle cx="142" cy="260" r="10"/><circle cx="217" cy="260" r="10"/><circle cx="292" cy="260" r="10"/></g>
<rect x="125" y="520" width="150" height="92" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/><rect x="130" y="380" width="140" height="92" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><rect x="145" y="470" width="110" height="125" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/>
<polygon points="150,380 250,380 250,470 225,490 225,612 175,612 175,490 150,470" fill="#fff" stroke="#5F5E5A" stroke-width="1"/>
<line x1="175" y1="545" x2="225" y2="545" stroke="#E24B4A" stroke-width="2.5" stroke-dasharray="5 3"/>
<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central"><text x="142" y="82" text-anchor="middle">結腸膨起</text><text x="350" y="180">結腸ヒモ（縦走筋の3本の帯）</text><text x="217" y="302" text-anchor="middle">腹膜垂</text><text x="20" y="360" fill="#5F5E5A">直腸と肛門管（断面）</text><text x="300" y="425">直腸</text><text x="300" y="502">内肛門括約筋（平滑筋・不随意）</text><text x="300" y="545">歯状線</text><text x="300" y="582">外肛門括約筋（骨格筋・随意）</text><text x="200" y="640" text-anchor="middle">肛門</text></g>
<g stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"><line x1="142" y1="92" x2="142" y2="118"/><line x1="346" y1="180" x2="332" y2="180"/><line x1="217" y1="292" x2="217" y2="272"/><line x1="296" y1="425" x2="272" y2="425"/><line x1="296" y1="502" x2="256" y2="502"/><line x1="296" y1="545" x2="228" y2="545"/><line x1="296" y1="582" x2="276" y2="582"/><line x1="200" y1="632" x2="200" y2="615"/></g>
<text x="20" y="676" font-size="12" fill="#5F5E5A" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">直腸と肛門管には結腸ヒモも結腸膨起もありません。括約筋と歯状線の上下の位置は目安です。</text>
</svg>
