<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>椎間板ヘルニアと神経（椎骨を横から見た模式図）</title><desc>隣り合う2つの椎骨を横から見た模式図（左が前）。椎体の間の椎間板で、中心の髄核が線維輪を破って後方へ突出し、椎間孔の中の脊髄神経に触れている。椎間孔は、上下の椎弓根の間にあり、その後ろで、上の椎骨の下関節突起と下の椎骨の上関節突起が椎間関節をつくる。棘突起は後方へ出る。</desc><rect width="680" height="430" fill="#fff"/><rect x="270" y="66" width="80" height="30" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
