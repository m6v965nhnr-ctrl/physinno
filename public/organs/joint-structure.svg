<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>滑膜性関節の構造（断面の模式図）と、関節唇・関節円板・半月</title><desc>上段は、滑膜性関節を切った断面の模式図。上の骨の関節頭と、下の骨の関節窩のそれぞれの関節面を、関節軟骨がおおい、2つの関節軟骨の間に、滑液で満たされた関節腔がある。関節腔は関節包でかこまれ、関節包は関節面のすぐ外側で骨に付く。関節包の内面には滑膜がある。関節包の外には靱帯がある。下段は、一部の関節にある線維軟骨の模式図。関節唇は関節窩の縁につき、関節円板は2つの骨の間にあり、半月は上から見るとC字形で、外縁が厚く、内縁が薄い。</desc><rect width="680" height="640" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#888780"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker></defs><path d="M300 30 L380 30 L380 90 Q460 95 460 160 Q455 245 340 250 Q225 245 220 160 Q220 95 300 90 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
