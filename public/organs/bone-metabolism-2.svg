<g clip-path="url(#n4)"><rect x="530" y="250" width="80" height="50" fill="#C0DD97"/></g>
<path d="M540 250 Q570 292 600 250" fill="none" stroke="#3B6D11" stroke-width="1" />
<ellipse cx="570" cy="262" rx="5" ry="3.3" fill="#CECBF6" stroke="#534AB7" stroke-width="0.9" />
<ellipse cx="522" cy="246" rx="15" ry="3.8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" />
<ellipse cx="570" cy="246" rx="15" ry="3.8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" />
<ellipse cx="618" cy="246" rx="15" ry="3.8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" />
<text x="90" y="372" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#2C2C2A" font-weight="500">① 古い骨</text>
<text x="250" y="372" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#2C2C2A" font-weight="500">② 骨吸収</text>
<text x="250" y="390" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">破骨細胞が骨を溶かす</text>
<text x="410" y="372" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#2C2C2A" font-weight="500">③ 骨形成</text>
<text x="410" y="390" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">骨芽細胞が新しい骨をつくる</text>
<text x="570" y="372" text-anchor="middle" dominant-baseline="central" font-size="13.5" fill="#2C2C2A" font-weight="500">④ 置き換わった骨</text>
<text x="570" y="390" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">骨芽細胞の一部は骨細胞に</text>
<line x1="163" y1="300" x2="177" y2="300" stroke="#5F5E5A" stroke-width="1.6" />
<polygon points="177,300 170.7,303 170.7,297" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="0" />
<line x1="323" y1="300" x2="337" y2="300" stroke="#5F5E5A" stroke-width="1.6" />
<polygon points="337,300 330.7,303 330.7,297" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="0" />
<line x1="483" y1="300" x2="497" y2="300" stroke="#5F5E5A" stroke-width="1.6" />
<polygon points="497,300 490.7,303 490.7,297" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="0" />
<line x1="20" y1="414" x2="660" y2="414" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3" />
<text x="20" y="430" text-anchor="start" dominant-baseline="central" font-size="13.5" fill="#2C2C2A" font-weight="500">調節</text>
<rect x="20" y="444" width="306" height="104" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<rect x="348" y="444" width="312" height="104" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2" />
<text x="34" y="460" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" font-weight="500">吸収を進める・抑える</text>
<text x="34" y="482" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">副甲状腺ホルモン（PTH）</text>
<text x="34" y="499" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">破骨細胞を刺激して骨吸収を進める</text>
<text x="34" y="518" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">カルシトニン：破骨細胞の働きを抑える</text>
<text x="362" y="460" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" font-weight="500">形成を進める</text>
<text x="362" y="482" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">性ホルモン・成長ホルモン・甲状腺ホルモン</text>
<text x="362" y="499" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">骨芽細胞の働きを促す</text>
<text x="362" y="518" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">力学的負荷：骨の沈着を促す</text>
<text x="362" y="535" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">負荷がないと、骨のミネラルとコラーゲンが失われる</text>
<text x="340" y="574" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#5F5E5A">吸収が形成を上回ると骨量が減る（骨粗鬆症）。模式図で、大きさ・形は実物と異なる</text></svg>
