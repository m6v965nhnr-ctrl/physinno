<circle cx="436" cy="252" r="2" fill="#185FA5" stroke="none" stroke-width="0" />
<rect x="500" y="250" width="140" height="100" rx="0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
