<circle cx="266" cy="236" r="3.4" fill="#993C1D" stroke="none" stroke-width="0" />
<line x1="220" y1="252" x2="220" y2="258" stroke="#993C1D" stroke-width="1" />
<line x1="230" y1="252" x2="230" y2="258" stroke="#993C1D" stroke-width="1" />
<line x1="240" y1="252" x2="240" y2="258" stroke="#993C1D" stroke-width="1" />
<line x1="250" y1="252" x2="250" y2="258" stroke="#993C1D" stroke-width="1" />
<line x1="260" y1="252" x2="260" y2="258" stroke="#993C1D" stroke-width="1" />
<line x1="270" y1="252" x2="270" y2="258" stroke="#993C1D" stroke-width="1" />
<line x1="280" y1="252" x2="280" y2="258" stroke="#993C1D" stroke-width="1" />
<path d="M340 250 L380 250 Q410 292 440 250 L480 250 L480 350 L340 350 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<clipPath id="n3"><path d="M380 250 Q410 292 440 250 Z"/></clipPath>
<g clip-path="url(#n3)"><rect x="370" y="264" width="80" height="40" fill="#C0DD97"/><line x1="370" y1="264" x2="450" y2="264" stroke="#3B6D11" stroke-width="1"/></g>
<ellipse cx="384" cy="252" rx="8" ry="6.5" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" />
