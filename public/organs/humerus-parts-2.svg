<text x="165" y="40" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-weight="500">後面（右の上腕骨）</text>
<line x1="322" y1="214" x2="203" y2="214" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="203" cy="214" r="2.4" fill="#2C2C2A"/>
<rect x="330" y="205" width="18" height="18" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/>
<text x="358" y="214" font-size="14" text-anchor="start" dominant-baseline="central" fill="#2C2C2A" font-weight="500">外科頸</text>
<text x="358" y="233" font-size="12.5" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">腋窩神経が骨に接する。</text>
<text x="358" y="250" font-size="12.5" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">外科頸の骨折で傷つくことがある</text>
<line x1="322" y1="340" x2="167" y2="340" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="167" cy="340" r="2.4" fill="#2C2C2A"/>
<rect x="330" y="331" width="18" height="18" rx="3" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/>
<text x="358" y="340" font-size="14" text-anchor="start" dominant-baseline="central" fill="#2C2C2A" font-weight="500">橈骨神経溝</text>
<text x="358" y="359" font-size="12.5" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">橈骨神経が通る。</text>
<text x="358" y="376" font-size="12.5" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">骨幹部の骨折で傷つくことがある</text>
<line x1="322" y1="500" x2="203" y2="500" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="203" cy="500" r="2.4" fill="#2C2C2A"/>
<rect x="330" y="491" width="18" height="18" rx="3" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.2"/>
<text x="358" y="500" font-size="14" text-anchor="start" dominant-baseline="central" fill="#2C2C2A" font-weight="500">顆上（両上顆の上）</text>
<text x="358" y="519" font-size="12.5" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">顆上骨折の部位。</text>
<text x="358" y="536" font-size="12.5" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">前腕の血流と神経に注意</text>
<line x1="322" y1="590" x2="131" y2="585" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="131" cy="585" r="2.4" fill="#2C2C2A"/>
<rect x="330" y="581" width="18" height="18" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/>
<text x="358" y="590" font-size="14" text-anchor="start" dominant-baseline="central" fill="#2C2C2A" font-weight="500">内側上顆の後ろの溝</text>
<text x="358" y="609" font-size="12.5" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">尺骨神経が通る。</text>
<text x="358" y="626" font-size="12.5" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">内側上顆の骨折で傷つくことがある</text>
<text x="330" y="130" font-size="14" text-anchor="start" dominant-baseline="central" fill="#2C2C2A" font-weight="500">骨に接して通る神経の位置</text>
<text x="330" y="152" font-size="12.5" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">（色は神経が骨に近づく場所を示す。</text>
<text x="330" y="170" font-size="12.5" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">実際の経路の細部は省いている）</text></svg>