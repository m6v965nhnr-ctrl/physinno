<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>血糖調節の流れ（インスリンとグルカゴン）</title><desc>血糖が上がるとβ細胞からインスリンが出て、骨格筋と脂肪組織のグルコース取り込みと肝のグリコーゲン合成を促し、血糖を下げる。血糖が下がるとα細胞からグルカゴンが出て、肝のグリコーゲン分解と糖新生と脂肪分解を促し、血糖を上げる。δ細胞のソマトスタチンは、インスリンとグルカゴンの分泌を抑える。</desc><defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#854F0B"/></marker></defs><rect width="680" height="560" fill="#fff"/><rect x="20" y="24" width="110" height="120" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="75" y="60" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">食後など</text><text x="75" y="84" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">血糖が上昇</text><path d="M132 84.0 L153 84.0" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="155" y="24" width="110" height="120" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="210" y="84.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">膵島β細胞</text><path d="M267 84.0 L288 84.0" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="290" y="24" width="110" height="120" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="345" y="84.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">インスリン</text><path d="M402 84.0 L423 84.0" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="425" y="24" width="235" height="120" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="542" y="40" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">作用</text><text x="542" y="61" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">骨格筋・脂肪組織：</text><text x="542" y="82" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">グルコースの取り込み↑</text><text x="542" y="103" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">肝：グリコーゲン合成↑</text><text x="542" y="124" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">肝：グリコーゲン分解・糖新生↓</text><rect x="20" y="316" width="110" height="120" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="75" y="352" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">空腹・運動など</text><text x="75" y="376" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">血糖が低下</text><path d="M132 376.0 L153 376.0" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="155" y="316" width="110" height="120" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/><text x="210" y="376.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">膵島α細胞</text><path d="M267 376.0 L288 376.0" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="290" y="316" width="110" height="120" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1.2"/><text x="345" y="376.0" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">グルカゴン</text><path d="M402 376.0 L423 376.0" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ak)"/><rect x="425" y="316" width="235" height="120" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="542" y="332" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">作用</text><text x="542" y="353" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">肝：グリコーゲン分解↑</text><text x="542" y="374" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">肝：糖新生↑</text><text x="542" y="395" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">脂肪分解↑</text><rect x="20" y="184" width="640" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="340" y="224" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A" dominant-baseline="central">血　糖　値</text><path d="M75 184 L75 146" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="85" y="166" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">上がると</text><path d="M75 264 L75 314" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="85" y="292" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">下がると</text><path d="M542 146 L542 182" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ao)"/><text x="552" y="164" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">血糖を下げる</text><path d="M542 314 L542 266" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ao)"/><text x="552" y="290" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">血糖を上げる</text><rect x="20" y="462" width="640" height="44" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><text x="340" y="484" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">膵島δ細胞：ソマトスタチンが、インスリンとグルカゴンの分泌を抑える</text><text x="340" y="532" text-anchor="middle" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">アドレナリン・コルチゾール・成長ホルモンも血糖を上げる方向に働く</text></svg>