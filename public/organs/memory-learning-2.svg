<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>長期増強（LTP）の誘導</title><desc>左は通常の伝達。シナプス前終末から放出されたグルタミン酸がAMPA型受容体に結合してナトリウムが入るが、NMDA型受容体はマグネシウムイオンがチャネルをふさいでおり通らない。右は、シナプス後細胞が強く脱分極したとき。マグネシウムのブロックが外れ、NMDA型受容体からカルシウムイオンが流入し、AMPA型受容体が増えて、シナプス応答が増大する。</desc>
<rect width="680" height="436" fill="#fff"/>
<defs><marker id="m0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker></defs>
<text x="175" y="22" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#2C2C2A" font-weight="500">通常の伝達</text>
<rect x="30" y="52" width="290" height="60" rx="14" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="175" y="70" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">シナプス前終末</text>
<circle cx="80" cy="95" r="6" fill="#fff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="130" cy="95" r="6" fill="#fff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="180" cy="95" r="6" fill="#fff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="230" cy="95" r="6" fill="#fff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="270" cy="95" r="6" fill="#fff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="80" cy="138" r="4.5" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<circle cx="132" cy="150" r="4.5" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<circle cx="185" cy="142" r="4.5" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<circle cx="235" cy="152" r="4.5" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<circle cx="275" cy="140" r="4.5" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<text x="320" y="150" text-anchor="end" dominant-baseline="central" font-size="12" fill="#3B6D11">グルタミン酸</text>
<rect x="30" y="222" width="290" height="120" rx="10" fill="#F7F6F1" stroke="#5F5E5A" stroke-width="1"/>
<text x="175" y="330" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">シナプス後細胞</text>
<rect x="30" y="216" width="290" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="75" y="204" width="32" height="36" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.4"/>
<text x="91" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-weight="500">AMPA</text>
<path d="M91 170 L91 266" fill="none" stroke="#185FA5" stroke-width="2.2" marker-end="url(#m0)"/>
<text x="102" y="262" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#185FA5" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Na⁺</text>
<rect x="180" y="204" width="40" height="36" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.4"/>
<text x="200" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D" font-weight="500">NMDA</text>
<circle cx="200" cy="208" r="8" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.2"/>
<text x="228" y="214" text-anchor="start" dominant-baseline="central" font-size="12" fill="#A32D2D" font-weight="500">Mg²⁺が</text>
<text x="228" y="230" text-anchor="start" dominant-baseline="central" font-size="12" fill="#A32D2D" font-weight="500">ふさぐ</text>
<text x="505" y="22" text-anchor="middle" dominant-baseline="central" font-size="14.5" fill="#2C2C2A" font-weight="500">強く脱分極したとき</text>
<rect x="360" y="52" width="290" height="60" rx="14" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="505" y="70" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">シナプス前終末</text>
<circle cx="410" cy="95" r="6" fill="#fff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="460" cy="95" r="6" fill="#fff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="510" cy="95" r="6" fill="#fff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="560" cy="95" r="6" fill="#fff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="600" cy="95" r="6" fill="#fff" stroke="#0F6E56" stroke-width="1"/>
<circle cx="410" cy="138" r="4.5" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<circle cx="462" cy="150" r="4.5" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<circle cx="515" cy="142" r="4.5" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<circle cx="565" cy="152" r="4.5" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<circle cx="605" cy="140" r="4.5" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
<text x="650" y="150" text-anchor="end" dominant-baseline="central" font-size="12" fill="#3B6D11">グルタミン酸</text>
<rect x="360" y="222" width="290" height="120" rx="10" fill="#F7F6F1" stroke="#5F5E5A" stroke-width="1"/>
<text x="505" y="330" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">シナプス後細胞</text>
<rect x="360" y="216" width="290" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="405" y="204" width="32" height="36" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.4"/>
<text x="421" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-weight="500">AMPA</text>
<path d="M421 170 L421 266" fill="none" stroke="#185FA5" stroke-width="2.2" marker-end="url(#m0)"/>
<text x="432" y="262" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#185FA5" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Na⁺</text>
<rect x="510" y="204" width="40" height="36" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.4"/>
<text x="530" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D" font-weight="500">NMDA</text>
<circle cx="572" cy="176" r="8" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.2"/>
<text x="594" y="176" text-anchor="start" dominant-baseline="central" font-size="12" fill="#A32D2D" font-weight="500">Mg²⁺</text>
<path d="M530 160 L530 280" fill="none" stroke="#A32D2D" stroke-width="2.4" marker-end="url(#m1)"/>
<text x="542" y="262" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#A32D2D" font-weight="500" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ca²⁺</text>
<rect x="590" y="204" width="32" height="36" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="606" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" font-weight="500">AMPA</text>
<text x="606" y="252" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">集まる</text>
<text x="390" y="300" text-anchor="start" dominant-baseline="central" font-size="14" fill="#993C1D" font-weight="700">＋＋＋</text>
<text x="445" y="300" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#993C1D">強く脱分極</text>
<text x="175" y="364" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">グルタミン酸はAMPA型受容体に結合し、</text>
<text x="175" y="382" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">ナトリウムが入る。NMDA型受容体は通らない。</text>
<text x="505" y="364" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">Mg²⁺のブロックが外れ、NMDA型受容体から</text>
<text x="505" y="382" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">Ca²⁺が流入。その後AMPA型受容体が集まる</text>
<text x="340" y="414" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">脳科学辞典の長期増強の項に基づく簡略図。受容体の数や位置は模式的に描いたもので、実際の比率ではありません。</text>
<line x1="340" y1="10" x2="340" y2="350" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="0"/>
</svg>
