<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>嗅覚の経路（嗅上皮から嗅覚野まで）</title><desc>鼻腔の天井の嗅上皮にある嗅細胞（双極性ニューロン）の軸索が、篩板を通って頭蓋内の嗅球に入り、嗅球の僧帽細胞に伝わる。嗅索を通って側頭葉の一次嗅覚野と、辺縁系・視床下部へ向かう。嗅覚は視床を経由せずに大脳皮質へ入る。</desc>
<rect width="680" height="600" fill="#fff"/>
<text x="20" y="24" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">嗅覚の経路（横から見た模式図。顔は左向き）</text><path d="M60 150 C60 70 150 40 250 46 C340 50 380 90 372 150 C368 190 350 214 320 224 L300 226 C280 250 240 256 210 240 L130 200 L70 196 C62 184 60 168 60 150 Z" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/><text x="110" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5F5E5A">前頭葉</text><path d="M200 214 C230 196 300 196 340 210 C346 226 330 250 300 250 C260 256 220 250 200 232 Z" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/><text x="272" y="228" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">側頭葉の内側</text><path d="M30 250 C40 232 70 230 120 232 L190 232 L190 330 C150 340 90 340 50 320 C30 300 26 270 30 250 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2"/><text x="110" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">鼻腔</text><rect x="70" y="208" width="120" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><rect x="92" y="208" width="4" height="14" fill="#fff"/><rect x="112" y="208" width="4" height="14" fill="#fff"/><rect x="132" y="208" width="4" height="14" fill="#fff"/><rect x="152" y="208" width="4" height="14" fill="#fff"/><rect x="172" y="208" width="4" height="14" fill="#fff"/><path d="M72 230 L188 230 L188 240 L72 240 Z" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><ellipse cx="130" cy="188" rx="40" ry="16" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><path d="M170 190 C220 190 250 200 270 214" fill="none" stroke="#0F6E56" stroke-width="8" stroke-linecap="round"/><path d="M170 190 C220 190 250 200 270 214" fill="none" stroke="#9FE1CB" stroke-width="5" stroke-linecap="round"/><line x1="96" y1="232" x2="96" y2="196" stroke="#854F0B" stroke-width="1.6" /><line x1="124" y1="232" x2="124" y2="196" stroke="#854F0B" stroke-width="1.6" /><line x1="152" y1="232" x2="152" y2="196" stroke="#854F0B" stroke-width="1.6" /><text x="370" y="24" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">嗅上皮の拡大</text><rect x="380" y="60" width="220" height="26" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><text x="490" y="73" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">嗅球</text><rect x="380" y="110" width="220" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A"/><text x="490" y="116" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">篩板</text><rect x="380" y="130" width="220" height="90" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><rect x="380" y="220" width="220" height="46" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/><ellipse cx="440" cy="190" rx="9" ry="14" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/><line x1="440" y1="176" x2="440" y2="86" stroke="#854F0B" stroke-width="1.5" /><line x1="440" y1="204" x2="436" y2="226" stroke="#534AB7" stroke-width="1.4" /><line x1="440" y1="204" x2="444" y2="226" stroke="#534AB7" stroke-width="1.4" /><line x1="436" y1="226" x2="428" y2="252" stroke="#534AB7" stroke-width="1.2" /><line x1="444" y1="226" x2="452" y2="252" stroke="#534AB7" stroke-width="1.2" /><ellipse cx="540" cy="190" rx="9" ry="14" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/><line x1="540" y1="176" x2="540" y2="86" stroke="#854F0B" stroke-width="1.5" /><line x1="540" y1="204" x2="536" y2="226" stroke="#534AB7" stroke-width="1.4" /><line x1="540" y1="204" x2="544" y2="226" stroke="#534AB7" stroke-width="1.4" /><line x1="536" y1="226" x2="528" y2="252" stroke="#534AB7" stroke-width="1.2" /><line x1="544" y1="226" x2="552" y2="252" stroke="#534AB7" stroke-width="1.2" /><ellipse cx="510" cy="150" rx="60" ry="0.1" fill="none"/><text x="20" y="346" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">嗅覚の伝わり方</text><rect x="20" y="360" width="130" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/><text x="85.0" y="379.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">嗅細胞</text><text x="85.0" y="397.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">（嗅上皮）</text><rect x="190" y="360" width="130" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="255.0" y="379.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">嗅球</text><text x="255.0" y="397.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">（僧帽細胞）</text><rect x="360" y="360" width="90" height="56" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="1.2"/><text x="405.0" y="388.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">嗅索</text><rect x="500" y="360" width="160" height="56" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="580.0" y="379.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">一次嗅覚野</text><text x="580.0" y="397.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">（側頭葉）</text><line x1="150" y1="388" x2="188" y2="388" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="190,388 182,383 182,393" fill="#5F5E5A"/><line x1="320" y1="388" x2="358" y2="388" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="360,388 352,383 352,393" fill="#5F5E5A"/><line x1="450" y1="388" x2="498" y2="388" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="500,388 492,383 492,393" fill="#5F5E5A"/><rect x="500" y="444" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="580" y="466" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">辺縁系・視床下部</text><path d="M425 416 L425 466 L500 466" fill="none" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="500,466 492,461 492,471" fill="#5F5E5A"/><text x="20" y="468" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視床を経由せずに大脳皮質へ入る。</text><text x="20" y="520" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">嗅細胞は双極性のニューロンで、線毛が鼻腔の粘液に出ている。軸索は篩板を通って嗅球に入る。</text><text x="20" y="544" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">辺縁系・視床下部への経路は、においと記憶・情動の結びつきに関わる。</text><text x="20" y="574" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">模式図。大きさ・位置・形は実物と異なります。</text><line x1="70" y1="170" x2="96" y2="182" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="96" cy="182" r="2.2" fill="#2C2C2A"/><text x="66" y="170" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">嗅球</text><line x1="226" y1="150" x2="215" y2="196" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="215" cy="196" r="2.2" fill="#2C2C2A"/><text x="230" y="150" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">嗅索</text><line x1="64" y1="214" x2="74" y2="214" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="74" cy="214" r="2.2" fill="#2C2C2A"/><text x="60" y="214" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">篩板</text><line x1="196" y1="262" x2="150" y2="236" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="150" cy="236" r="2.2" fill="#2C2C2A"/><text x="200" y="262" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">嗅上皮</text><line x1="604" y1="190" x2="549" y2="190" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="549" cy="190" r="2.2" fill="#2C2C2A"/><text x="608" y="190" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">嗅細胞</text><line x1="604" y1="100" x2="540" y2="100" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="540" cy="100" r="2.2" fill="#2C2C2A"/><text x="608" y="100" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">軸索</text><line x1="604" y1="150" x2="590" y2="150" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="590" cy="150" r="2.2" fill="#2C2C2A"/><text x="608" y="150" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">嗅上皮</text><text x="490" y="246" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">粘液（線毛が出ている）</text>
</svg>
