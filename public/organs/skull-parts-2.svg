<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 900" width="680" height="900" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>頭蓋の前面・眼窩・副鼻腔・鼻腔</title>
<desc>頭蓋を前から見た図。前頭骨、鼻骨、頬骨、上顎骨、下顎骨を色分けし、眼窩の縁の色で、上壁が前頭骨、外側壁が頬骨、下壁が上顎骨、内側壁が篩骨と涙骨であることを示す。副鼻腔は、前頭洞が眉の上、篩骨洞が眼窩と鼻腔の間、上顎洞が眼窩の下にある。下の拡大図は鼻腔で、鼻中隔の上部は篩骨の垂直板、下部は鋤骨、外側壁に中鼻甲介（篩骨）と下鼻甲介がある。</desc>
