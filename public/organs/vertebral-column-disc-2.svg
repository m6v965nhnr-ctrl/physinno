<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>椎間板と靱帯（脊柱の正中矢状断の模式図）</title><desc>隣り合う3つの椎骨を、正中で縦に切った模式図（左が前）。椎体の間に椎間板があり、外側の線維輪と中心の髄核からなる。椎体の前面に前縦靱帯、椎体の後面（脊柱管の前壁）に後縦靱帯が走る。脊柱管の中に脊髄があり、後方では椎弓板の間に黄色靱帯、棘突起の間に棘間靱帯、棘突起の先端に棘上靱帯がある。</desc><rect width="680" height="540" fill="#fff"/><rect x="352" y="34" width="44" height="462" rx="0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3" fill-opacity="0.5"/>
