<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" width="680" height="720" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>足の骨の各部（足背側から）（模式図）</title><desc>右足を上（足背側）から見た模式図。後方（かかと側）に踵骨と、その上に距骨（頭・頸・体）。距骨の前に内側の舟状骨、踵骨の前に外側の立方骨。舟状骨の前に内側・中間・外側の3つの楔状骨。その前に中足骨が第1〜第5まで母趾側から並び、先に趾骨（母趾は2個、ほかの趾は3個ずつ）。赤い点線がリスフラン関節（足根骨と中足骨の間）、青い点線がショパール関節（距舟関節と踵立方関節）。</desc>
