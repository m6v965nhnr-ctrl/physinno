<text x="331.0" y="278" text-anchor="middle" font-size="13" fill="#185FA5" font-weight="500">3</text>
<text x="363.0" y="306" text-anchor="middle" font-size="13" fill="#185FA5" font-weight="500">4</text>
<text x="398.0" y="306" text-anchor="middle" font-size="13" fill="#185FA5" font-weight="500">5</text>
<text x="205" y="190" text-anchor="end">第1中足骨</text>
<text x="205" y="265" text-anchor="end">楔状骨（内側・中間・外側）</text>
<text x="205" y="355" text-anchor="end">舟状骨</text>
<text x="205" y="405" text-anchor="end">距骨頭</text>
<text x="205" y="445" text-anchor="end">距骨頸</text>
<text x="205" y="485" text-anchor="end">距骨体（上面が滑車）</text>
<text x="448" y="70" text-anchor="start">趾骨（母趾2・ほか各3＝計14）</text>
<text x="448" y="200" text-anchor="start">中足骨（母趾側から第1〜5）</text>
<text x="448" y="262" text-anchor="start">第5中足骨粗面</text>
<text x="448" y="395" text-anchor="start">立方骨</text>
<text x="448" y="520" text-anchor="start">踵骨</text>
<text x="448" y="600" text-anchor="start">踵骨隆起（かかと）</text>
<text x="448" y="300" text-anchor="start" font-size="13" fill="#A32D2D" font-weight="500">リスフラン関節（足根中足関節）</text>
<text x="448" y="442" text-anchor="start" font-size="13" fill="#185FA5" font-weight="500">ショパール関節（横足根関節）</text>
<text x="340" y="18" text-anchor="middle" font-size="13" fill="#5F5E5A">遠位（つま先）</text>
<text x="340" y="660" text-anchor="middle" font-size="13" fill="#5F5E5A">近位（かかと）</text>
<text x="120" y="690" text-anchor="middle" font-size="13" fill="#5F5E5A">内側（母趾側）</text>
<text x="560" y="690" text-anchor="middle" font-size="13" fill="#5F5E5A">外側（小趾側）</text>
<text x="340" y="700" text-anchor="middle" font-size="14" fill="#2C2C2A" font-weight="500">右足を上（足背）から見た図</text>
