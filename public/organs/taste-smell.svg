<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 604" width="680" height="604" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>舌の神経支配と味蕾</title><desc>舌の味覚の神経支配と味蕾の模式図。舌の前の2/3は顔面神経（鼓索神経）、後ろの1/3は舌咽神経、のどに近い最後方は迷走神経が味覚を伝える。味蕾は味毛を持つ味細胞、支持細胞、基底細胞と神経線維からなる。味覚は孤束核、視床、大脳皮質の味覚野へ伝わる。</desc>
<rect width="680" height="604" fill="#fff"/>
<text x="20" y="24" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">舌の神経支配（味覚）</text><path d="M118 188 C150 178 250 178 282 188 C290 150 296 120 290 100 C260 76 140 76 110 100 C104 120 108 150 118 188 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" opacity="0"/><path d="M112 212 C150 200 250 200 288 212 L288 250 C282 320 240 360 200 360 C160 360 118 320 112 250 Z" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/><path d="M112 212 C108 160 104 120 112 100 C124 82 150 70 200 70 C250 70 276 82 288 100 C296 120 292 160 288 212 C250 200 150 200 112 212 Z" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><path d="M126 92 C150 78 250 78 274 92 C250 88 150 88 126 92 Z" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/><path d="M130 76 C160 66 240 66 270 76 L274 92 C240 84 160 84 126 92 Z" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/><text x="200" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">前の2/3</text><text x="200" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">後ろの1/3</text><text x="200" y="56" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5F5E5A">舌根（のどに近い側。最後方に迷走神経）</text><text x="200" y="376" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5F5E5A">舌先</text><text x="430" y="24" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">味蕾の模式図</text><path d="M440 120 C440 80 490 60 540 60 C590 60 640 80 640 120 L640 270 L440 270 Z" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><ellipse cx="540" cy="150" rx="46" ry="76" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/><ellipse cx="514" cy="150" rx="8" ry="52" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><ellipse cx="531" cy="150" rx="8" ry="52" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><ellipse cx="549" cy="150" rx="8" ry="52" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><ellipse cx="566" cy="150" rx="8" ry="52" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/><line x1="514" y1="100" x2="527.0" y2="66" stroke="#534AB7" stroke-width="1.4" /><line x1="531" y1="100" x2="535.5" y2="66" stroke="#534AB7" stroke-width="1.4" /><line x1="549" y1="100" x2="544.5" y2="66" stroke="#534AB7" stroke-width="1.4" /><line x1="566" y1="100" x2="553.0" y2="66" stroke="#534AB7" stroke-width="1.4" /><ellipse cx="540" cy="246" rx="30" ry="9" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/><line x1="540" y1="255" x2="540" y2="300" stroke="#854F0B" stroke-width="2.5" /><line x1="524" y1="232" x2="524" y2="300" stroke="#854F0B" stroke-width="1.5" /><line x1="556" y1="232" x2="556" y2="300" stroke="#854F0B" stroke-width="1.5" /><text x="20" y="390" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">味覚の伝わり方</text><rect x="20" y="410" width="140" height="64" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2"/><text x="90.0" y="424.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">顔面神経</text><text x="90.0" y="442.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">舌咽神経</text><text x="90.0" y="460.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">（迷走神経）</text><rect x="190" y="410" width="130" height="64" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2"/><text x="255.0" y="433.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">孤束核</text><text x="255.0" y="451.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">（脳幹）</text><rect x="330" y="410" width="130" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="395.0" y="433.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">視床</text><text x="395.0" y="451.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">（後内側腹側核）</text><rect x="480" y="410" width="130" height="64" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2"/><text x="545.0" y="433.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">味覚野</text><text x="545.0" y="451.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">（大脳皮質）</text><line x1="160" y1="442" x2="188" y2="442" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="190,442 182,437 182,447" fill="#5F5E5A"/><line x1="320" y1="442" x2="328" y2="442" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="330,442 322,437 322,447" fill="#5F5E5A"/><line x1="460" y1="442" x2="478" y2="442" stroke="#5F5E5A" stroke-width="1.6" /><polygon points="480,442 472,437 472,447" fill="#5F5E5A"/><text x="20" y="516" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">味蕾は舌の乳頭にあり、味細胞が唾液に溶けた化学物質を受け取る。</text><text x="20" y="538" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">基本の味は、甘味・塩味・酸味・苦味・うま味の5つ。</text><text x="20" y="566" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">舌の図は神経の分担を示すもので、乳頭の種類・分布は描いていません。</text><text x="20" y="588" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">形・大きさは実物と異なります。</text><line x1="306" y1="300" x2="260" y2="300" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="260" cy="300" r="2.2" fill="#2C2C2A"/><text x="310" y="300" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">顔面神経（鼓索神経）</text><line x1="306" y1="130" x2="284" y2="140" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="284" cy="140" r="2.2" fill="#2C2C2A"/><text x="310" y="130" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">舌咽神経</text><line x1="104" y1="82" x2="140" y2="78" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="140" cy="78" r="2.2" fill="#2C2C2A"/><text x="100" y="82" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">迷走神経</text><line x1="436" y1="90" x2="522" y2="84" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="522" cy="84" r="2.2" fill="#2C2C2A"/><text x="432" y="90" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">味毛</text><line x1="436" y1="150" x2="516" y2="150" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="516" cy="150" r="2.2" fill="#2C2C2A"/><text x="432" y="150" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">味細胞</text><line x1="436" y1="230" x2="516" y2="244" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="516" cy="244" r="2.2" fill="#2C2C2A"/><text x="432" y="230" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">基底細胞</text><line x1="586" y1="300" x2="548" y2="290" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="548" cy="290" r="2.2" fill="#2C2C2A"/><text x="590" y="300" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">神経線維</text>
</svg>
