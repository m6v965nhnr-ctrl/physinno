<text x="350" y="310" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">内外の仮骨が合わさり、</text>
<text x="350" y="326" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">外側の縁は緻密骨に置き換わる</text>
