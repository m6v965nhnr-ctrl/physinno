<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" height="590" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>骨折の治癒の段階（模式図）</title><desc>長骨の骨幹が折れて治る流れの模式図。1、骨折血腫：骨折の6〜8時間後ごろに血液が固まり、周りの骨細胞が死ぬ。2、仮骨の形成：約48時間で、髄腔側に線維軟骨の内仮骨、骨膜側に軟骨と骨の外仮骨ができて骨折部が安定する。3、数週間かけて、破骨細胞が死んだ骨を吸収し、仮骨の軟骨が骨梁に置き換わる。4、リモデリング：内外の仮骨が合わさり、外側の縁は緻密骨に置き換わり、腫れは改変されて目立たなくなる。</desc><rect width="680" height="590" fill="#fff"/><text x="20" y="20" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="500">① 骨折血腫</text>
<text x="20" y="40" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">骨折の6〜8時間後ごろ、血液が固まる</text>
<text x="20" y="56" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">周りの骨細胞は血流が絶たれて死ぬ</text>
<polygon points="30,124 168,124 161,148 171,170 164,196 30,196" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<polygon points="194,124 330,124 330,196 188,196 196,172 189,148" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<polygon points="30,136 163,136 157,152 166,170 161,184 30,184" fill="#FAC775" stroke="#854F0B" stroke-width="1" />
<polygon points="198,136 330,136 330,184 191,184 199,170 193,152" fill="#FAC775" stroke="#854F0B" stroke-width="1" />
<ellipse cx="180" cy="160" rx="32" ry="48" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.2" fill-opacity="0.55"/>
<text x="220" y="94" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">骨折血腫</text>
<line x1="216" y1="94" x2="194" y2="126" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" />
<circle cx="194" cy="126" r="2.5" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0" />
<text x="350" y="20" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="500">② 仮骨の形成</text>
<text x="350" y="40" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">約48時間で骨折部が安定する</text>
<polygon points="360,124 498,124 491,148 501,170 494,196 360,196" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
