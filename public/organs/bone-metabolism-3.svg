<ellipse cx="202" cy="434" rx="7" ry="4.6" fill="#F5C4B3" stroke="#993C1D" stroke-width="1" />
<text x="250" y="512" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">破骨細胞</text>
<text x="250" y="529" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">死んだ骨を吸収</text>
<line x1="246" y1="512" x2="203" y2="436" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" />
<circle cx="203" cy="436" r="2.5" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0" />
<text x="24" y="368" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">骨梁</text>
<text x="24" y="385" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">軟骨が置き換わる</text>
