<polygon points="528,136 660,136 660,184 521,184 529,170 523,152" fill="#FAC775" stroke="#854F0B" stroke-width="1" />
<rect x="492" y="136" width="34" height="48" rx="0" fill="#CECBF6" stroke="#534AB7" stroke-width="1" />
<ellipse cx="510" cy="122" rx="46" ry="15" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<ellipse cx="510" cy="198" rx="46" ry="15" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="354" y="82" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">外仮骨</text>
<text x="354" y="99" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">軟骨と骨（骨膜側）</text>
<line x1="350" y1="82" x2="476" y2="116" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" />
<circle cx="476" cy="116" r="2.5" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0" />
<text x="550" y="232" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">内仮骨（髄腔側）</text>
<text x="550" y="249" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">線維軟骨</text>
<line x1="546" y1="232" x2="520" y2="176" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" />
<circle cx="520" cy="176" r="2.5" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0" />
<text x="20" y="290" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="500">③ 仮骨が骨梁に置き換わる</text>
<text x="20" y="310" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">数週間：破骨細胞が死んだ骨を吸収し、</text>
<text x="20" y="326" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">仮骨の軟骨が骨梁（海綿骨）になる</text>
<polygon points="30,394 168,394 161,418 171,440 164,466 30,466" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
