<text x="354" y="529" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">内外の仮骨が合わさる</text>
<line x1="350" y1="512" x2="440" y2="461" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" />
