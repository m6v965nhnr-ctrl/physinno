<text x="540" y="512" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A">わずかな腫れ</text>
<text x="540" y="529" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">改変されて目立たなくなる</text>
<line x1="536" y1="512" x2="526" y2="470" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" />
<circle cx="526" cy="470" r="2.5" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0" />
<text x="340" y="572" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#5F5E5A">骨の治癒の流れ（OpenStax の骨折修復の項による）。模式図で、大きさ・形は実物と異なる</text></svg>
