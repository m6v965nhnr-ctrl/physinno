<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 684" width="680" height="684" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>視覚伝導路（網膜から一次視覚野まで）</title><desc>両眼の網膜の右半分（左視野を見る側）からの線維は右の脳へ、左半分（右視野を見る側）からの線維は左の脳へ向かう。視神経は視交叉で、鼻側網膜からの線維だけが反対側へ交叉し、視索、外側膝状体、視放線を経て後頭葉の一次視覚野に入る。①視神経、②視交叉、③視索（外側膝状体・視放線を含む）、④後頭葉の障害の場所を印で示した。</desc>
