/><path d="M190 476 A44 44 0 0 1 234 520" fill="none" stroke="#185FA5" stroke-width="9" stroke-linecap="butt"/><path d="M190 476 A44 44 0 0 1 234 520" fill="none" stroke="#B5D4F4" stroke-width="6" stroke-linecap="butt"/><text x="190" y="540" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">左眼</text><circle cx="490" cy="520" r="44" fill="#fff" stroke="#2C2C2A" stroke-width="1.2"/><path d="M446 520 A44 44 0 0 1 490 476" fill="none" stroke="#993C1D" stroke-width="9" stroke-linecap="butt"/><path d="M446 520 A44 44 0 0 1 490 476" fill="none" stroke="#F5C4B3" stroke-width="6" stroke-linecap="butt"/><path d="M490 476 A44 44 0 0 1 534 520" fill="none" stroke="#185FA5" stroke-width="9" stroke-linecap="butt"/><path d="M490 476 A44 44 0 0 1 534 520" fill="none" stroke="#B5D4F4" stroke-width="6" stroke-linecap="butt"/><text x="490" y="540" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">右眼</text><path d="M190 476 C190 430 320 410 334 366 C350 350 380 330 400 262 C410 250 420 246 428 250" fill="none" stroke="#185FA5" stroke-width="6" stroke-linecap="round"/><path d="M190 476 C190 430 320 410 334 366 C350 350 380 330 400 262 C410 250 420 246 428 250" fill="none" stroke="#B5D4F4" stroke-width="4" stroke-linecap="round"/><path d="M178 478 C178 420 240 340 252 250" fill="none" stroke="#993C1D" stroke-width="6" stroke-linecap="round"/><path d="M178 478 C178 420 240 340 252 250" fill="none" stroke="#F5C4B3" stroke-width="4" stroke-linecap="round"/><path d="M490 476 C490 430 360 410 346 366 C330 350 300 330 280 262 C270 250 260 246 252 250" fill="none" stroke="#993C1D" stroke-width="6" stroke-linecap="round"/><path d="M490 476 C490 430 360 410 346 366 C330 350 300 330 280 262 C270 250 260 246 252 250" fill="none" stroke="#F5C4B3" stroke-width="4" stroke-linecap="round"/><path d="M502 478 C502 420 440 340 428 250" fill="none" stroke="#185FA5" stroke-width="6" stroke-linecap="round"/><path d="M502 478 C502 420 440 340 428 250" fill="none" stroke="#B5D4F4" stroke-width="4" stroke-linecap="round"/><ellipse cx="340" cy="360" rx="24" ry="14" fill="none" stroke="#2C2C2A" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="180" cy="430" r="11" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/><text x="180" y="430" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fff">①</text><circle cx="340" cy="392" r="11" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/><text x="340" y="392" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fff">②</text><circle cx="404" cy="300" r="11" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/><text x="404" y="300" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fff">③</text><circle cx="446" cy="150" r="11" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/><text x="446" y="150" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fff">③</text><circle cx="506" cy="69" r="11" fill="#E24B4A" stroke="#A32D2D" stroke-width="1"/><text x="506" y="69" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fff">④</text><text x="522" y="69" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">後頭葉</text><line x1="134" y1="410" x2="190" y2="430" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="190" cy="430" r="2.2" fill="#2C2C2A"/><text x="130" y="410" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視神経</text><line x1="376" y1="396" x2="364" y2="362" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="364" cy="362" r="2.2" fill="#2C2C2A"/><text x="380" y="396" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視交叉</text><line x1="486" y1="286" x2="412" y2="296" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="412" cy="296" r="2.2" fill="#2C2C2A"/><text x="490" y="286" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視索</text><line x1="496" y1="236" x2="450" y2="236" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="450" cy="236" r="2.2" fill="#2C2C2A"/><text x="500" y="236" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">外側膝状体</text><line x1="496" y1="150" x2="452" y2="150" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="452" cy="150" r="2.2" fill="#2C2C2A"/><text x="500" y="150" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">視放線</text><rect x="20" y="574" width="16" height="12" rx="2" fill="#B5D4F4" stroke="#185FA5"/><text x="42" y="580" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">左視野からの情報（右の脳へ）</text><rect x="260" y="574" width="16" height="12" rx="2" fill="#F5C4B3" stroke="#993C1D"/><text x="282" y="580" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">右視野からの情報（左の脳へ）</text><text x="20" y="612" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">①〜④は、次の図の視野の欠け方に対応する障害の場所（③は視索・外側膝状体・視放線）。</text><text x="20" y="636" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">左右の目・脳は図の左右にそのまま対応させた模式図です（左眼は図の左）。</text><text x="20" y="658" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">経路の太さ・長さ・形は実物と異なります。</text>
</svg>
