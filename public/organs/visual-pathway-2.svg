<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 642" width="680" height="642" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>障害の場所と視野の欠損</title><desc>4つの障害の場所と、左眼・右眼の視野の欠け方。①視神経の障害では障害された側の眼の視野が欠ける。②視交叉の障害では両眼の外側の視野が欠ける（両耳側半盲）。③視索・外側膝状体・視放線の障害（右側）では、両眼とも左の視野が半分欠ける（同名半盲）。④後頭葉の障害でも同名半盲になり、中心部の視野が残ることがある（黄斑回避）。</desc>
<rect width="680" height="642" fill="#fff"/>
<rect x="20" y="20" width="316" height="252" rx="8" fill="#fff" stroke="#D3D1C7" stroke-width="1"/><text x="34" y="40" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">① 視神経の障害</text><text x="34" y="62" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">障害された側の眼の視野が欠ける</text><text x="34" y="82" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">（ここでは左眼が完全に障害された場合）</text><defs><clipPath id="cp20200"><circle cx="100" cy="170" r="52"/></clipPath></defs><circle cx="100" cy="170" r="52" fill="#fff"/><g clip-path="url(#cp20200)"><rect x="48" y="118" width="104" height="104" fill="#888780"/></g><circle cx="100" cy="170" r="52" fill="none" stroke="#2C2C2A" stroke-width="1.2"/><line x1="95" y1="170" x2="105" y2="170" stroke="#E24B4A" stroke-width="1.5" /><line x1="100" y1="165" x2="100" y2="175" stroke="#E24B4A" stroke-width="1.5" /><text x="100" y="238" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">左眼の視野</text><defs><clipPath id="cp20201"><circle cx="256" cy="170" r="52"/></clipPath></defs><circle cx="256" cy="170" r="52" fill="#fff"/><g clip-path="url(#cp20201)"></g><circle cx="256" cy="170" r="52" fill="none" stroke="#2C2C2A" stroke-width="1.2"/><line x1="251" y1="170" x2="261" y2="170" stroke="#E24B4A" stroke-width="1.5" /><line x1="256" y1="165" x2="256" y2="175" stroke="#E24B4A" stroke-width="1.5" /><text x="256" y="238" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">右眼の視野</text><rect x="344" y="20" width="316" height="252" rx="8" fill="#fff" stroke="#D3D1C7" stroke-width="1"/><text x="358" y="40" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">② 視交叉の障害</text><text x="358" y="62" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">両耳側半盲</text><text x="358" y="82" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">（両眼とも、外側の視野が欠ける）</text><defs><clipPath id="cp344200"><circle cx="424" cy="170" r="52"/></clipPath></defs><circle cx="424" cy="170" r="52" fill="#fff"/><g clip-path="url(#cp344200)"><rect x="372" y="118" width="52" height="104" fill="#888780"/></g><circle cx="424" cy="170" r="52" fill="none" stroke="#2C2C2A" stroke-width="1.2"/><line x1="419" y1="170" x2="429" y2="170" stroke="#E24B4A" stroke-width="1.5" /><line x1="424" y1="165" x2="424" y2="175" stroke="#E24B4A" stroke-width="1.5" /><text x="424" y="238" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">左眼の視野</text><defs><clipPath id="cp344201"><circle cx="580" cy="170" r="52"/></clipPath></defs><circle cx="580" cy="170" r="52" fill="#fff"/><g clip-path="url(#cp344201)"><rect x="580" y="118" width="52" height="104" fill="#888780"/></g><circle cx="580" cy="170" r="52" fill="none" stroke="#2C2C2A" stroke-width="1.2"/><line x1="575" y1="170" x2="585" y2="170" stroke="#E24B4A" stroke-width="1.5" /><line x1="580" y1="165" x2="580" y2="175" stroke="#E24B4A" stroke-width="1.5" /><text x="580" y="238" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">右眼の視野</text><rect x="20" y="286" width="316" height="252" rx="8" fill="#fff" stroke="#D3D1C7" stroke-width="1"/><text x="34" y="306" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">③ 視索・外側膝状体・視放線</text><text x="34" y="328" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">同名半盲</text><text x="34" y="348" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">（右側の障害なら、両眼とも左の視野が欠ける）</text><defs><clipPath id="cp202860"><circle cx="100" cy="436" r="52"/></clipPath></defs><circle cx="100" cy="436" r="52" fill="#fff"/><g clip-path="url(#cp202860)"><rect x="48" y="384" width="52" height="104" fill="#888780"/></g><circle cx="100" cy="436" r="52" fill="none" stroke="#2C2C2A" stroke-width="1.2"/><line x1="95" y1="436" x2="105" y2="436" stroke="#E24B4A" stroke-width="1.5" /><line x1="100" y1="431" x2="100" y2="441" stroke="#E24B4A" stroke-width="1.5" /><text x="100" y="504" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">左眼の視野</text><defs><clipPath id="cp202861"><circle cx="256" cy="436" r="52"/></clipPath></defs><circle cx="256" cy="436" r="52" fill="#fff"/><g clip-path="url(#cp202861)"><rect x="204" y="384" width="52" height="104" fill="#888780"/></g><circle cx="256" cy="436" r="52" fill="none" stroke="#2C2C2A" stroke-width="1.2"/><line x1="251" y1="436" x2="261" y2="436" stroke="#E24B4A" stroke-width="1.5" /><line x1="256" y1="431" x2="256" y2="441" stroke="#E24B4A" stroke-width="1.5" /><text x="256" y="504" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">右眼の視野</text><rect x="344" y="286" width="316" height="252" rx="8" fill="#fff" stroke="#D3D1C7" stroke-width="1"/><text x="358" y="306" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">④ 後頭葉（一次視覚野）</text><text x="358" y="328" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">同名半盲（右側の障害の例）</text><text x="358" y="348" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">中心部の視野が残ること（黄斑回避）がある</text><defs><clipPath id="cp3442860"><circle cx="424" cy="436" r="52"/></clipPath></defs><circle cx="424" cy="436" r="52" fill="#fff"/><g clip-path="url(#cp3442860)"><rect x="372" y="384" width="52" height="104" fill="#888780"/><circle cx="424" cy="436" r="15" fill="#fff"/></g><circle cx="424" cy="436" r="52" fill="none" stroke="#2C2C2A" stroke-width="1.2"/><line x1="419" y1="436" x2="429" y2="436" stroke="#E24B4A" stroke-width="1.5" /><line x1="424" y1="431" x2="424" y2="441" stroke="#E24B4A" stroke-width="1.5" /><text x="424" y="504" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">左眼の視野</text><defs><clipPath id="cp3442861"><circle cx="580" cy="436" r="52"/></clipPath></defs><circle cx="580" cy="436" r="52" fill="#fff"/><g clip-path="url(#cp3442861)"><rect x="528" y="384" width="52" height="104" fill="#888780"/><circle cx="580" cy="436" r="15" fill="#fff"/></g><circle cx="580" cy="436" r="52" fill="none" stroke="#2C2C2A" stroke-width="1.2"/><line x1="575" y1="436" x2="585" y2="436" stroke="#E24B4A" stroke-width="1.5" /><line x1="580" y1="431" x2="580" y2="441" stroke="#E24B4A" stroke-width="1.5" /><text x="580" y="504" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">右眼の視野</text><text x="20" y="566" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">灰色は見えない範囲、赤い十字は注視点。視野は見ている人の向きで描いた（左眼の視野の左側が外側）。</text><text x="20" y="590" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">同名半盲では、障害が後ろ（後頭葉）にあるほど、左右の眼の欠け方がそろう。</text><text x="20" y="618" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">完全に障害された場合の模式図です。実際の欠け方は、障害の程度によって異なります。</text>
</svg>
