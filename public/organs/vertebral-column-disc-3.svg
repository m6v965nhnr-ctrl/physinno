<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>椎骨と椎間板を上から見た模式図（水平断）</title><desc>腰の椎骨を上から見た模式図（上が前）。前方に椎体があり、その上に椎間板が重なる。椎間板は外側の線維輪と中心の髄核からなる。椎体の後方に椎弓があり、椎弓は左右の椎弓根と椎弓板からなる。椎弓と椎体の間の椎孔の中に、神経の通る袋（硬膜管）がある。椎弓から後方へ棘突起、左右へ横突起が出る。</desc><rect width="680" height="500" fill="#fff"/><path d="M270 205 C246 285 262 352 326 362 L354 362 C418 352 434 285 410 205" fill="none" stroke="#5F5E5A" stroke-width="17" stroke-linecap="round"/>
