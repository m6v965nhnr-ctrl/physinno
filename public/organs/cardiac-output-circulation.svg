<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" width="680" height="550" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>心拍出量を決める因子（関係図）</title><desc>心拍出量は心拍数と1回拍出量の積。心拍数は自律神経やホルモンなどで変わる。1回拍出量は拡張末期容積と収縮末期容積の差で、前負荷、心収縮力、後負荷で決まる。</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker></defs>
<rect width="680" height="550" fill="#fff"/>
<rect x="190" y="16" width="300" height="52" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2" />
<text x="340" y="34" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A" dominant-baseline="central">心拍出量（CO）</text>
<text x="340" y="54" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">＝ 心拍数 × 1回拍出量</text>
<path d="M270 70 L180 112" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M410 70 L500 112" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="40" y="114" width="280" height="72" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="1.2" />
<text x="180" y="134" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">心拍数（HR）</text>
<text x="180" y="158" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">交感神経↑・迷走神経（副交感）↓</text>
<text x="180" y="176" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">カテコールアミン・甲状腺ホルモン・体温↑</text>
<text x="340" y="150" text-anchor="middle" font-size="20" font-weight="500" fill="#2C2C2A" dominant-baseline="central">×</text>
<rect x="360" y="114" width="280" height="72" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2" />
<text x="500" y="134" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">1回拍出量（SV）</text>
<text x="500" y="158" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">＝ 拡張末期容積（EDV）</text>
<text x="500" y="176" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">− 収縮末期容積（ESV）</text>
<path d="M420 188 L130 252" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M500 188 L340 252" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M580 188 L550 252" fill="none" stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="20" y="254" width="220" height="150" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="130" y="274" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">前負荷</text>
<text x="130" y="296" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">収縮前に心室が引き伸ばされる</text>
<text x="130" y="314" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">程度（EDV）</text>
<text x="130" y="340" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">静脈還流↑・充満時間↑・</text>
<text x="130" y="358" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">心房収縮 → 前負荷↑</text>
<text x="130" y="382" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">（フランク・スターリング）</text>
<rect x="250" y="254" width="190" height="150" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="345" y="274" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">心収縮力</text>
<text x="345" y="296" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">収縮の強さ</text>
<text x="345" y="322" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">↑ 交感神経・カテコール</text>
<text x="345" y="340" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">アミン・甲状腺ホルモン</text>
<text x="345" y="366" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">↓ 副交感神経・低酸素・</text>
<text x="345" y="384" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">アシドーシス・高K血症</text>
<rect x="450" y="254" width="200" height="150" rx="10" fill="#F4C0D1" stroke="#993556" stroke-width="1.2" />
<text x="550" y="274" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">後負荷</text>
<text x="550" y="296" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">血液を送り出すために</text>
<text x="550" y="314" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">心室が打ち勝つ抵抗</text>
<text x="550" y="342" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">血管抵抗↑や大動脈弁</text>
<text x="550" y="360" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central">狭窄で増える</text>
<rect x="20" y="430" width="630" height="98" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<text x="335" y="450" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">安静時の目安（片側の心室）</text>
<text x="335" y="474" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">心拍数 約75/分（60〜100）× 1回拍出量 約70 mL（55〜100）</text>
<text x="335" y="496" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">＝ 心拍出量 約5.25 L/分（4.0〜8.0）　駆出率＝SV÷EDV：約55〜70%</text>
</svg>