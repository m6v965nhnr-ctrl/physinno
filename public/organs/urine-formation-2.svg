<text x="20" y="92" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">輸入細動脈</text>
<text x="20" y="212" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">輸出細動脈</text>
