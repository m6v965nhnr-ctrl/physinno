<text x="380" y="352" text-anchor="start" font-size="12.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">濾過膜を通らず、血液側に残る</text>
<text x="380" y="300" text-anchor="start" font-size="12.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">有窓内皮</text>
