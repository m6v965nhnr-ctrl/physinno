<line x1="480" y1="288" x2="500" y2="262" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="516" y="300" text-anchor="start" font-size="12.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">足細胞（濾過スリット）</text>
<line x1="566" y1="288" x2="524" y2="244" stroke="#888780" stroke-width="0.9" stroke-dasharray="4 3"/>
<rect x="20" y="382" width="640" height="148" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="36" y="406" text-anchor="start" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">有効濾過圧（正味の濾過を押す力）</text>
<path d="M60 440 L200 440" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round" marker-end="url(#ab)"/>
<text x="212" y="440" text-anchor="start" font-size="13.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">糸球体血圧　55 mmHg（濾過を押す）</text>
<path d="M200 470 L60 470" fill="none" stroke="#A32D2D" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="212" y="470" text-anchor="start" font-size="13.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">ボウマン嚢内圧　15 mmHg（逆らう）</text>
<path d="M200 500 L60 500" fill="none" stroke="#A32D2D" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="212" y="500" text-anchor="start" font-size="13.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">血漿膠質浸透圧　30 mmHg（逆らう）</text>
<text x="476" y="440" text-anchor="start" font-size="13.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">有効濾過圧</text>
<text x="476" y="466" text-anchor="start" font-size="13.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">＝55－(15＋30)</text>
