<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>吸息と呼息の胸郭と横隔膜の動き（前から見た模式図）</title><desc>吸息では横隔膜が収縮して下がり、肋骨が上方・外方へ動いて胸郭が広がり、肺胞内圧が大気圧より低くなって空気が入る。安静時の呼息では、筋が弛緩し、肺と胸壁の弾性で縮み、肺胞内圧が大気圧より高くなって空気が出る。</desc><rect width="680" height="500" fill="#fff"/><g font-size="14" fill="#2C2C2A" dominant-baseline="central"><g transform="translate(10 40)"><text x="165" y="-14" text-anchor="middle" font-weight="500" font-size="15">吸息（吸気）</text>
<path d="M58 62 C58 30 110 20 150 20 C190 20 242 30 242 62 L254 250 L252 300 L48 300 L46 250 Z" fill="#B5D4F4" stroke="none"/><ellipse cx="150" cy="150" rx="28" ry="52" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<path d="M48 292 C100 262 200 262 252 292 L258 336 L42 336 Z" fill="#F1EFE8" stroke="none"/><path d="M58 62 C58 30 110 20 150 20 C190 20 242 30 242 62 L254 250 L252 300 L48 300 L46 250 Z" fill="none" stroke="#5F5E5A" stroke-width="4" stroke-linejoin="round"/>
<path d="M48 292 C100 262 200 262 252 292" fill="none" stroke="#993C1D" stroke-width="5" stroke-linecap="round"/><line x1="150" y1="222" x2="150.0" y2="250.0" stroke="#A32D2D" stroke-width="2.4"/><polygon points="150,256 156.0,245.0 144.0,245.0" fill="#A32D2D"/><line x1="52" y1="175" x2="33.193029271310074" y2="145.07981929526602" stroke="#A32D2D" stroke-width="2.4"/><polygon points="30,140 30.8,152.5 40.9,146.1" fill="#A32D2D"/><line x1="248" y1="175" x2="266.8069707286899" y2="145.07981929526602" stroke="#A32D2D" stroke-width="2.4"/><polygon points="270,140 259.1,146.1 269.2,152.5" fill="#A32D2D"/>
<text x="150" y="152" text-anchor="middle">縦隔</text><text x="100" y="110" text-anchor="middle">肺</text><text x="200" y="110" text-anchor="middle">肺</text><text x="150" y="292" text-anchor="middle" fill="#993C1D" font-weight="500">横隔膜</text>
<text x="165" y="372" text-anchor="middle">横隔膜が収縮して下がる</text><text x="165" y="394" text-anchor="middle">外肋間筋が収縮して肋骨が上方・外方へ</text><text x="165" y="416" text-anchor="middle">胸郭が広がり、肺胞内圧が大気圧より</text><text x="165" y="438" text-anchor="middle">低くなって、空気が入る</text></g><g transform="translate(350 40)"><text x="165" y="-14" text-anchor="middle" font-weight="500" font-size="15">呼息（呼気・安静時）</text>
<path d="M70 70 C70 40 120 30 150 30 C180 30 230 40 230 70 L238 240 C238 260 236 285 236 300 L64 300 C64 285 62 260 62 240 Z" fill="#B5D4F4" stroke="none"/><ellipse cx="150" cy="150" rx="28" ry="52" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<path d="M62 268 C100 205 200 205 238 268 L242 336 L58 336 Z" fill="#F1EFE8" stroke="none"/><path d="M70 70 C70 40 120 30 150 30 C180 30 230 40 230 70 L238 240 C238 260 236 285 236 300 L64 300 C64 285 62 260 62 240 Z" fill="none" stroke="#5F5E5A" stroke-width="4" stroke-linejoin="round"/>
