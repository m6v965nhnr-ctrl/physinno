<text x="150" y="152" text-anchor="middle">縦隔</text><text x="100" y="110" text-anchor="middle">肺</text><text x="200" y="110" text-anchor="middle">肺</text><text x="150" y="248" text-anchor="middle" fill="#993C1D" font-weight="500">横隔膜</text>
<text x="165" y="372" text-anchor="middle">横隔膜・外肋間筋は弛緩し、</text><text x="165" y="394" text-anchor="middle">肺と胸壁の弾性で縮む（受動的）</text><text x="165" y="416" text-anchor="middle">肺胞内圧が大気圧より高くなって、</text><text x="165" y="438" text-anchor="middle">空気が出る</text></g><line x1="340" y1="30" x2="340" y2="480" stroke="#D3D1C7" stroke-width="1"/></g></svg>