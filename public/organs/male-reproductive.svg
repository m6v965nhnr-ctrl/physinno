<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" width="680" height="690" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>男性生殖器の矢状断（精子の通り道）</title><desc>男性生殖器を横から見た模式図（前が左）。陰嚢の中に精巣と精巣上体があり、精巣上体から精管が精索となって上り、鼠径管を通って骨盤に入り、膀胱の後ろを回って精嚢の管と合わさり射精管になる。射精管は前立腺を貫いて前立腺部尿道に開く。尿道は前立腺部、膜様部、海綿体部の順で陰茎の尿道海綿体の中を通る。前立腺は直腸の前にある。尿道球腺は膜様部の近くにある。下に精子の通り道を順に示す。</desc><defs><marker id="ah2C2C2A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker></defs><rect width="680" height="690" fill="#fff"/>
