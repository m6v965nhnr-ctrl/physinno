<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><title>体温調節の流れ（模式図）</title><desc>末梢と中枢の温度受容器の情報が視床下部の体温調節中枢に集まり、寒冷時は皮膚血管収縮・ふるえ・代謝亢進、暑熱時は皮膚血管拡張・発汗・呼吸数増加で、熱産生と熱放散を調節して核心温度を保つ。</desc>
<defs><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2C2C2A"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker></defs>
<rect width="680" height="560" fill="#fff"/>
<rect x="12" y="18" width="185" height="54" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2" />
<text x="104.5" y="36.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F6E56" dominant-baseline="central">末梢温度受容器</text>
<text x="104.5" y="53.5" text-anchor="middle" font-size="13" fill="#0F6E56" dominant-baseline="central">（皮膚・粘膜）</text>
<rect x="483" y="18" width="185" height="54" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.2" />
<text x="575.5" y="36.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0F6E56" dominant-baseline="central">中枢温度受容器</text>
<text x="575.5" y="53.5" text-anchor="middle" font-size="13" fill="#0F6E56" dominant-baseline="central">（視床下部など：核心温度）</text>
<rect x="222" y="14" width="236" height="62" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1.2" />
<text x="340.0" y="36.5" text-anchor="middle" font-size="13" font-weight="500" fill="#534AB7" dominant-baseline="central">体温調節中枢</text>
<text x="340.0" y="53.5" text-anchor="middle" font-size="13" fill="#534AB7" dominant-baseline="central">視床下部（視索前野・前視床下部）</text>
<path d="M199 45 L220 45" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M481 45 L460 45" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M290 76 L190 112" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M390 76 L490 112" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<rect x="20" y="114" width="300" height="34" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="170.0" y="131.0" text-anchor="middle" font-size="14" font-weight="500" fill="#185FA5" dominant-baseline="central">寒冷時（熱産生↑・放散↓）</text>
<rect x="360" y="114" width="300" height="34" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="510.0" y="131.0" text-anchor="middle" font-size="14" font-weight="500" fill="#993C1D" dominant-baseline="central">暑熱時（放散↑）</text>
<rect x="20" y="162" width="300" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="170.0" y="182.0" text-anchor="middle" font-size="13" fill="#185FA5" dominant-baseline="central">交感神経↑ → 皮膚血管収縮（放散を抑える）</text>
<rect x="20" y="210" width="300" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="170.0" y="230.0" text-anchor="middle" font-size="13" fill="#185FA5" dominant-baseline="central">ふるえ（骨格筋・体性運動神経）→ 熱産生</text>
<rect x="20" y="258" width="300" height="40" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="170.0" y="278.0" text-anchor="middle" font-size="13" fill="#185FA5" dominant-baseline="central">甲状腺ホルモン・カテコラミン↑ → 代謝↑</text>
<rect x="360" y="162" width="300" height="40" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="510.0" y="182.0" text-anchor="middle" font-size="13" fill="#993C1D" dominant-baseline="central">交感神経↓ → 皮膚血管拡張（放散を促す）</text>
<rect x="360" y="210" width="300" height="40" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="510.0" y="230.0" text-anchor="middle" font-size="13" fill="#993C1D" dominant-baseline="central">発汗（コリン作動性の交感神経 → エクリン腺）</text>
<rect x="360" y="258" width="300" height="40" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="510.0" y="278.0" text-anchor="middle" font-size="13" fill="#993C1D" dominant-baseline="central">呼吸数↑（呼気からの水分蒸発）</text>
<text x="340" y="330" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">熱の産生と放散のバランス</text>
<rect x="20" y="346" width="300" height="62" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.2" />
<text x="170.0" y="361.0" text-anchor="middle" font-size="12" font-weight="500" fill="#185FA5" dominant-baseline="central">熱産生</text>
<text x="170.0" y="377.0" text-anchor="middle" font-size="12" fill="#185FA5" dominant-baseline="central">基礎代謝・筋運動・内分泌（甲状腺ホルモン、</text>
<text x="170.0" y="393.0" text-anchor="middle" font-size="12" fill="#185FA5" dominant-baseline="central">アドレナリン）・褐色脂肪組織</text>
<rect x="360" y="346" width="300" height="62" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.2" />
<text x="510.0" y="361.0" text-anchor="middle" font-size="12" font-weight="500" fill="#993C1D" dominant-baseline="central">熱放散</text>
<text x="510.0" y="377.0" text-anchor="middle" font-size="12" fill="#993C1D" dominant-baseline="central">血流で体表へ → 放射・伝導・対流・</text>
<text x="510.0" y="393.0" text-anchor="middle" font-size="12" fill="#993C1D" dominant-baseline="central">蒸発（不感蒸泄・発汗）</text>
<rect x="195" y="448" width="290" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" />
<text x="340.0" y="464.0" text-anchor="middle" font-size="12" font-weight="500" fill="#5F5E5A" dominant-baseline="central">核心温度</text>
<text x="340.0" y="480.0" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">36〜38℃（資料により36.5〜37.5℃）</text>
<path d="M170 408 C170 436 180 460 193 468" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M510 408 C510 436 500 460 487 468" fill="none" stroke="#2C2C2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ak)"/>
<path d="M487 478 L674 478 L674 46 L670 46" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#ap)"/>
<text x="580" y="468" text-anchor="middle" font-size="12" fill="#534AB7" dominant-baseline="central">負のフィードバック</text>
<text x="14" y="522" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">実線は流れ、点線はフィードバック。主な反応のみを示した模式図で、神経経路の詳細は省略。</text>
<text x="14" y="542" text-anchor="start" font-size="12" fill="#5F5E5A" dominant-baseline="central">出典: 広島大学の教材、温度生物学ハンドブック、OpenStax。</text>
</svg>