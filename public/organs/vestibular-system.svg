<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 604" width="680" height="604" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>前庭器官（半規管と耳石器）</title><desc>内耳の前庭器官の模式図。3つの半規管（上・後・外側）の根元に膨大部があり、卵形嚢と球形嚢につながる。前庭神経が脳へ向かう（神経は1本だけ描いた）。右上は耳石器の断面で、有毛細胞の不動毛が耳石膜に埋まり、その上に耳石が載っている。右下は膨大部の断面で、有毛細胞の不動毛がクプラに埋まっている。</desc>
<rect width="680" height="604" fill="#fff"/>
<text x="20" y="24" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">前庭器官（内耳）</text><ellipse cx="205" cy="150" rx="40" ry="66" fill="none" stroke="#534AB7" stroke-width="9" transform="rotate(14 205 150)"/><ellipse cx="205" cy="150" rx="40" ry="66" fill="none" stroke="#CECBF6" stroke-width="5.5" transform="rotate(14 205 150)"/><ellipse cx="120" cy="160" rx="38" ry="64" fill="none" stroke="#534AB7" stroke-width="9" transform="rotate(-14 120 160)"/><ellipse cx="120" cy="160" rx="38" ry="64" fill="none" stroke="#CECBF6" stroke-width="5.5" transform="rotate(-14 120 160)"/><ellipse cx="165" cy="236" rx="78" ry="24" fill="none" stroke="#534AB7" stroke-width="9" transform="rotate(0 165 236)"/><ellipse cx="165" cy="236" rx="78" ry="24" fill="none" stroke="#CECBF6" stroke-width="5.5" transform="rotate(0 165 236)"/><ellipse cx="162" cy="214" rx="42" ry="20" fill="#CECBF6" stroke="#534AB7" stroke-width="1.5"/><ellipse cx="162" cy="268" rx="24" ry="20" fill="#CECBF6" stroke="#534AB7" stroke-width="1.5"/><circle cx="178" cy="197" r="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><circle cx="148" cy="203" r="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><circle cx="209" cy="219" r="8" fill="#FAC775" stroke="#854F0B" stroke-width="1.2"/><path d="M168 286 C190 320 240 332 300 330" fill="none" stroke="#854F0B" stroke-width="6" stroke-linecap="round"/><path d="M168 286 C190 320 240 332 300 330" fill="none" stroke="#FAC775" stroke-width="3.5" stroke-linecap="round"/><line x1="266" y1="50" x2="224" y2="92" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="224" cy="92" r="2.2" fill="#2C2C2A"/><text x="270" y="50" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">上（前）半規管</text><line x1="114" y1="60" x2="96" y2="100" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="96" cy="100" r="2.2" fill="#2C2C2A"/><text x="110" y="60" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">後半規管</text><line x1="266" y1="130" x2="182" y2="194" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="182" cy="194" r="2.2" fill="#2C2C2A"/><text x="270" y="130" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">膨大部</text><line x1="154" y1="332" x2="94" y2="246" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="94" cy="246" r="2.2" fill="#2C2C2A"/><text x="150" y="332" text-anchor="end" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">外側（水平）半規管</text><line x1="266" y1="200" x2="190" y2="226" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="190" cy="226" r="2.2" fill="#2C2C2A"/><text x="270" y="200" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">卵形嚢</text><line x1="266" y1="276" x2="184" y2="270" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="184" cy="270" r="2.2" fill="#2C2C2A"/><text x="270" y="276" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">球形嚢</text><line x1="306" y1="350" x2="290" y2="331" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><circle cx="290" cy="331" r="2.2" fill="#2C2C2A"/><text x="310" y="350" text-anchor="start" dominant-baseline="central" font-size="14" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">前庭神経</text><text x="360" y="24" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">耳石器（卵形嚢・球形嚢）</text><rect x="360" y="110" width="230" height="20" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><rect x="360" y="130" width="230" height="12" fill="none"/><ellipse cx="374.0" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><ellipse cx="394.5" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><ellipse cx="415.0" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><ellipse cx="435.5" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><ellipse cx="456.0" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><ellipse cx="476.5" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><ellipse cx="497.0" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><ellipse cx="517.5" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><ellipse cx="538.0" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><ellipse cx="558.5" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><ellipse cx="579.0" cy="100" rx="6" ry="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/><line x1="380" y1="190" x2="380" y2="124" stroke="#854F0B" stroke-width="1.2" /><line x1="384" y1="190" x2="383" y2="126" stroke="#854F0B" stroke-width="1.2" /><rect x="372" y="190" width="18" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="408" y1="190" x2="408" y2="124" stroke="#854F0B" stroke-width="1.2" /><line x1="412" y1="190" x2="411" y2="126" stroke="#854F0B" stroke-width="1.2" /><rect x="400" y="190" width="18" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="436" y1="190" x2="436" y2="124" stroke="#854F0B" stroke-width="1.2" /><line x1="440" y1="190" x2="439" y2="126" stroke="#854F0B" stroke-width="1.2" /><rect x="428" y="190" width="18" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="464" y1="190" x2="464" y2="124" stroke="#854F0B" stroke-width="1.2" /><line x1="468" y1="190" x2="467" y2="126" stroke="#854F0B" stroke-width="1.2" /><rect x="456" y="190" width="18" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="492" y1="190" x2="492" y2="124" stroke="#854F0B" stroke-width="1.2" /><line x1="496" y1="190" x2="495" y2="126" stroke="#854F0B" stroke-width="1.2" /><rect x="484" y="190" width="18" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="520" y1="190" x2="520" y2="124" stroke="#854F0B" stroke-width="1.2" /><line x1="524" y1="190" x2="523" y2="126" stroke="#854F0B" stroke-width="1.2" /><rect x="512" y="190" width="18" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="548" y1="190" x2="548" y2="124" stroke="#854F0B" stroke-width="1.2" /><line x1="552" y1="190" x2="551" y2="126" stroke="#854F0B" stroke-width="1.2" /><rect x="540" y="190" width="18" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="576" y1="190" x2="576" y2="124" stroke="#854F0B" stroke-width="1.2" /><line x1="580" y1="190" x2="579" y2="126" stroke="#854F0B" stroke-width="1.2" /><rect x="568" y="190" width="18" height="24" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><rect x="360" y="214" width="230" height="14" rx="3" fill="#F5C4B3" stroke="#993C1D"/><text x="475" y="221" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">支持細胞</text><line x1="592" y1="100" x2="600" y2="100" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="604" y="100" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">耳石</text><text x="604" y="120" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">耳石膜</text><text x="604" y="160" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">不動毛</text><text x="604" y="202" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">有毛細胞</text><text x="360" y="250" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">頭を傾けると、耳石膜が重力の向きに</text><text x="360" y="270" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ずれて、不動毛が曲がる。</text><text x="360" y="290" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">頭の傾きと直線加速度を感じる。</text><text x="360" y="336" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">半規管の膨大部</text><rect x="370" y="446" width="210" height="16" rx="3" fill="#F5C4B3" stroke="#993C1D"/><rect x="389" y="428" width="14" height="18" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="396" y1="428" x2="404" y2="388" stroke="#854F0B" stroke-width="1.2" /><rect x="419" y="428" width="14" height="18" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="426" y1="428" x2="434" y2="388" stroke="#854F0B" stroke-width="1.2" /><rect x="449" y="428" width="14" height="18" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="456" y1="428" x2="464" y2="388" stroke="#854F0B" stroke-width="1.2" /><rect x="479" y="428" width="14" height="18" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="486" y1="428" x2="494" y2="388" stroke="#854F0B" stroke-width="1.2" /><rect x="509" y="428" width="14" height="18" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="516" y1="428" x2="524" y2="388" stroke="#854F0B" stroke-width="1.2" /><rect x="539" y="428" width="14" height="18" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="1"/><line x1="546" y1="428" x2="554" y2="388" stroke="#854F0B" stroke-width="1.2" /><path d="M382 428 C410 366 530 366 572 428 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1" opacity="0.75"/><text x="478" y="402" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">クプラ</text><line x1="582" y1="436" x2="592" y2="436" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="604" y="436" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">有毛細胞</text><text x="360" y="484" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">頭が回ると、管の中の液体が遅れて動き、</text><text x="360" y="504" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">クプラが頭の動きと反対向きに</text><text x="360" y="524" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">押されて曲がる。</text><text x="20" y="548" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">半規管は3つあり、1つは水平、2つは垂直の向きにある。頭の回転を感じる。</text><text x="20" y="572" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">左の図の位置関係は単純化したもので、大きさ・形・向きは実物と異なります。</text>
<text x="20" y="592" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A" >前庭神経は卵形嚢・球形嚢・半規管のすべての信号を運ぶが、図では1本だけ描いた。</text>
</svg>
