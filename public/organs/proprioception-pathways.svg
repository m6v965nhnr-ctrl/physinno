<rect x="286" y="184" width="246" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="409.0" y="206.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">後索–内側毛帯系</text>
<text x="409.0" y="223.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（上と同じ経路）</text>
<rect x="534" y="184" width="110" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="589.0" y="206.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">延髄</text>
<text x="589.0" y="223.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（毛帯交叉）</text>
<rect x="14" y="250" width="118" height="62" rx="4" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="73.0" y="272.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" font-weight="500">識別触覚</text>
<text x="73.0" y="289.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" font-weight="500">（2点識別）</text>
