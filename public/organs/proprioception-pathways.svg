<text x="409.0" y="272.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">後索–内側毛帯系</text>
<text x="409.0" y="289.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（上と同じ経路）</text>
<rect x="534" y="250" width="110" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="589.0" y="272.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">延髄</text>
<text x="589.0" y="289.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（毛帯交叉）</text>
<rect x="14" y="316" width="118" height="62" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="73.0" y="347.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" font-weight="500">粗大触覚</text>
<rect x="134" y="316" width="150" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="209.0" y="347.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">皮膚の機械受容器</text>
<rect x="286" y="316" width="246" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="409.0" y="338.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">前脊髄視床路（後角固有核）</text>
<text x="409.0" y="355.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">→視床VPL核→中心後回</text>
<rect x="534" y="316" width="110" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="589.0" y="338.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">脊髄の中</text>
<text x="589.0" y="355.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（入った高さ）</text>
<rect x="14" y="382" width="118" height="62" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="73.0" y="413.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" font-weight="500">痛覚・温度覚</text>
<rect x="134" y="382" width="150" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="209.0" y="404.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">自由神経終末</text>
<text x="209.0" y="421.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（Aδ線維・C線維）</text>
