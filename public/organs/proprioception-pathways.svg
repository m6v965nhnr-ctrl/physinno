<text x="409.0" y="421.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">→視床VPL核→中心後回</text>
<rect x="534" y="382" width="110" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="589.0" y="404.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">脊髄の中</text>
<text x="589.0" y="421.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（入った高さ）</text>
<rect x="14" y="448" width="118" height="62" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="73.0" y="470.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" font-weight="500">無意識の</text>
<text x="73.0" y="487.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" font-weight="500">深部感覚</text>
<rect x="134" y="448" width="150" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="209.0" y="470.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">筋紡錘</text>
<text x="209.0" y="487.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">ゴルジ腱器官</text>
<rect x="286" y="448" width="246" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="409.0" y="462.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">脊髄小脳路</text>
<text x="409.0" y="479.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（後脊髄小脳路：胸髄核→</text>
<text x="409.0" y="496.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">同側の側索→小脳）</text>
<rect x="534" y="448" width="110" height="62" rx="4" fill="#fff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="589.0" y="470.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">交叉しない</text>
<text x="589.0" y="487.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">（後脊髄小脳路）</text>
<rect x="14" y="528" width="26" height="14" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="46" y="535" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">後索–内側毛帯系</text>
<rect x="204" y="528" width="26" height="14" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="236" y="535" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">脊髄視床路</text>
<rect x="394" y="528" width="26" height="14" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="426" y="535" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">脊髄小脳路</text>
<text x="14" y="562" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">VPL核は視床の後外側腹側核。顔面の体性感覚は三叉神経系で、視床のVPM核を経る。</text>
<text x="14" y="578" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">北大の資料・OpenStax・脳科学辞典・UTHealthの教材に基づく。経路の図は『脊髄』カードを参照。</text><text x="14" y="598" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">粗大触覚の経路は出典で異なる（北大は前脊髄視床路、UTHealthは外側脊髄視床路）。簡略化した図。</text>
</svg>
