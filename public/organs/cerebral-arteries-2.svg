<path d="M470 90 L700 90 L700 470 L215 470 L215 372 L450 344 L440 300 Z" fill="#9FE1CB"/>
</g>
<path d="M150 288 C170 226 250 190 340 188 C430 188 500 220 514 288 C470 252 410 234 340 234 C265 234 195 252 150 288 Z" fill="#D3D1C7" stroke="#888780" stroke-width="1.5"/>
<path d="M470 116 L440 300" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
<path d="M75 290 C70 205 135 135 245 118 C350 104 470 112 545 158 C612 198 640 265 628 320 C620 362 585 380 545 384 C510 388 470 395 440 400 C420 404 410 420 402 440 L330 440 C322 415 300 392 262 384 C200 372 150 362 112 345 C85 332 76 312 75 290 Z" fill="none" stroke="#2C2C2A" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<text x="60.0" y="157.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">前頭葉</text>
<text x="195.0" y="137.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">頭頂葉</text>
<text x="155.0" y="202.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">側頭葉</text>
<text x="284.0" y="165.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">後頭葉</text>
<text x="427.5" y="147.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">前頭葉</text>
<text x="525.0" y="100.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">頭頂葉</text>
<text x="510.0" y="217.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">側頭葉</text>
<text x="625.0" y="155.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">後頭葉</text>
<text x="511.0" y="135.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">脳梁</text>
<text x="150" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">外側面（左半球）</text>
<text x="498" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">内側面</text>
<text x="22" y="64" font-size="13" fill="#888780">前</text>
<text x="358" y="64" font-size="13" fill="#888780">前</text>
<text x="300" y="64" text-anchor="end" font-size="13" fill="#888780">後</text>
<text x="650" y="64" text-anchor="end" font-size="13" fill="#888780">後</text>
<text x="569.0" y="194.0" font-size="12" fill="#5F5E5A">頭頂後頭溝</text>
<text x="569.0" y="208.0" font-size="12" fill="#5F5E5A">（境の目安）</text>
<rect x="20" y="262" width="16" height="12" rx="2" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="42" y="268" dominant-baseline="central" font-size="13" fill="#2C2C2A">前大脳動脈の領域</text>
<rect x="190" y="262" width="16" height="12" rx="2" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="212" y="268" dominant-baseline="central" font-size="13" fill="#2C2C2A">中大脳動脈の領域</text>
<rect x="360" y="262" width="16" height="12" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="382" y="268" dominant-baseline="central" font-size="13" fill="#2C2C2A">後大脳動脈の領域</text>
<text x="20" y="292" font-size="13" fill="#5F5E5A">領域の境は目安。上頭頂小葉は、出典で中大脳動脈と後大脳動脈の両方に挙げられている。</text>
<text x="20" y="314" font-size="13" fill="#5F5E5A">内側面の点線（前・後大脳動脈の境）は、出典に境として書かれておらず、頭頂後頭溝を目安にした。</text>
</svg>