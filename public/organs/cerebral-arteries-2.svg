<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" width="680" height="334" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>3つの大脳動脈の支配領域（大脳半球の外側面と内側面）</title>
<desc>大脳半球の外側面（左）と内側面（右）で、前大脳動脈・中大脳動脈・後大脳動脈の支配領域を色分けした模式図。前は左、後ろは右。外側面は、中大脳動脈が外側面の大部分、前大脳動脈が上縁の帯、後大脳動脈が後頭葉と側頭葉の下面。内側面は、前大脳動脈が前頭葉・頭頂葉の内側面（脳梁の周り）、後大脳動脈が後頭葉の内側面と側頭葉の下面。</desc>
<rect width="680" height="312" fill="#fff"/>
<defs><clipPath id="cl"><path d="M70 300 C62 215 125 140 235 122 C335 108 455 115 545 160 C615 195 645 265 632 325 C625 370 590 395 545 392 C500 405 430 425 360 420 C300 415 245 395 215 365 C190 340 150 352 120 350 C90 345 72 330 70 300 Z"/></clipPath><clipPath id="cm"><path d="M75 290 C70 205 135 135 245 118 C350 104 470 112 545 158 C612 198 640 265 628 320 C620 362 585 380 545 384 C510 388 470 395 440 400 C420 404 410 420 402 440 L330 440 C322 415 300 392 262 384 C200 372 150 362 112 345 C85 332 76 312 75 290 Z"/></clipPath></defs>
<g transform="translate(-15,30) scale(0.5)">
