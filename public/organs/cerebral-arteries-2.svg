<path d="M70 300 C62 215 125 140 235 122 C335 108 455 115 545 160 C615 195 645 265 632 325 C625 370 590 395 545 392 C500 405 430 425 360 420 C300 415 245 395 215 365 C190 340 150 352 120 350 C90 345 72 330 70 300 Z" fill="none" stroke="#FAC775" stroke-width="72" clip-path="url(#ca)"/>
<path d="M545 100 C575 160 580 230 572 300 C566 340 560 360 556 440 L700 440 L700 100 Z" fill="#9FE1CB"/>
<clipPath id="cb"><path d="M205 330 L565 330 L565 460 L205 460 Z"/></clipPath>
<path d="M70 300 C62 215 125 140 235 122 C335 108 455 115 545 160 C615 195 645 265 632 325 C625 370 590 395 545 392 C500 405 430 425 360 420 C300 415 245 395 215 365 C190 340 150 352 120 350 C90 345 72 330 70 300 Z" fill="none" stroke="#9FE1CB" stroke-width="64" clip-path="url(#cb)"/>
</g>
<path d="M70 300 C62 215 125 140 235 122 C335 108 455 115 545 160 C615 195 645 265 632 325 C625 370 590 395 545 392 C500 405 430 425 360 420 C300 415 245 395 215 365 C190 340 150 352 120 350 C90 345 72 330 70 300 Z" fill="none" stroke="#2C2C2A" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g transform="translate(345,30) scale(0.5)">
<path d="M75 290 C70 205 135 135 245 118 C350 104 470 112 545 158 C612 198 640 265 628 320 C620 362 585 380 545 384 C510 388 470 395 440 400 C420 404 410 420 402 440 L330 440 C322 415 300 392 262 384 C200 372 150 362 112 345 C85 332 76 312 75 290 Z" fill="#FAC775"/>
