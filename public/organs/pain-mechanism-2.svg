<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
<title>ゲートコントロールと下行性抑制</title><desc>脊髄後角の回路。太いAβ線維（触・圧）はT細胞（中枢投射細胞）を興奮させ、同時に抑制性介在ニューロンを興奮させる。細いAδ・C線維（痛み）はT細胞を興奮させ、抑制性介在ニューロンの働きを抑える。抑制性介在ニューロンはT細胞への入力を抑える。T細胞は上位中枢へ痛みの信号を送る。右側には、水道周囲灰白質から延髄の吻側腹内側部を経て後角に向かう下行性の抑制と、青斑核からの下行性の抑制が描かれる。</desc>
<rect width="680" height="640" fill="#fff"/>
<defs><marker id="m0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#534AB7"/></marker><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#185FA5"/></marker><marker id="m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker><marker id="m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A32D2D"/></marker><marker id="m4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker></defs>
<text x="220" y="20" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5F5E5A" font-weight="500">脊髄後角のゲート</text>
<text x="560" y="20" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#5F5E5A" font-weight="500">下行性の抑制</text>
<rect x="20" y="215" width="380" height="285" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="30" y="232" text-anchor="start" dominant-baseline="central" font-size="13" fill="#5F5E5A">脊髄後角</text>
<rect x="215" y="60" width="170" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="300.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">上位中枢へ</text>
<text x="300.0" y="97.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">（痛みの信号）</text>
<path d="M300 268 L300 118" fill="none" stroke="#534AB7" stroke-width="2.5" marker-end="url(#m0)"/>
<circle cx="300" cy="290" r="22" fill="#CECBF6" stroke="#534AB7" stroke-width="1.8"/>
<text x="300" y="290" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#2C2C2A" font-weight="500">T</text>
<text x="335" y="255" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">T細胞</text>
<text x="335" y="270" text-anchor="start" dominant-baseline="central" font-size="12" fill="#2C2C2A" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">（中枢投射細胞）</text>
<circle cx="180" cy="400" r="14" fill="#FAC775" stroke="#854F0B" stroke-width="1.8"/>
<text x="172" y="426" text-anchor="end" dominant-baseline="central" font-size="12.5" fill="#854F0B" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">抑制性</text>
<text x="172" y="442" text-anchor="end" dominant-baseline="central" font-size="12.5" fill="#854F0B" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">介在ニューロン</text>
<text x="30" y="262" text-anchor="start" dominant-baseline="central" font-size="13" fill="#185FA5" font-weight="500">Aβ線維（触・圧）</text>
<path d="M30 290 L276 290" fill="none" stroke="#185FA5" stroke-width="2.5" marker-end="url(#m1)"/>
<path d="M100 290 L100 400 L164 400" fill="none" stroke="#185FA5" stroke-width="2.2" marker-end="url(#m1)"/>
<text x="262" y="277" text-anchor="end" dominant-baseline="central" font-size="16" fill="#185FA5" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">＋</text>
<text x="150" y="388" text-anchor="end" dominant-baseline="central" font-size="16" fill="#185FA5" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">＋</text>
<path d="M300 560 L300 314" fill="none" stroke="#993C1D" stroke-width="2.5" marker-end="url(#m2)"/>
<text x="300" y="578" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#993C1D" font-weight="500">Aδ・C線維（痛み）</text>
<text x="312" y="350" text-anchor="start" dominant-baseline="central" font-size="16" fill="#993C1D" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">＋</text>
<path d="M300 470 L196 408" fill="none" stroke="#993C1D" stroke-width="2.2" marker-end="url(#m2)"/>
<text x="250" y="424" text-anchor="end" dominant-baseline="central" font-size="16" fill="#A32D2D" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">－</text>
<path d="M190 388 Q230 330 280 308" fill="none" stroke="#A32D2D" stroke-width="2.4" marker-end="url(#m3)"/>
<text x="222" y="336" text-anchor="end" dominant-baseline="central" font-size="16" fill="#A32D2D" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">－</text>
<rect x="470" y="60" width="180" height="50" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="560.0" y="76.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">中脳</text>
<text x="560.0" y="93.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">水道周囲灰白質（PAG）</text>
<rect x="470" y="150" width="180" height="56" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="560.0" y="169.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">延髄 吻側腹内側部</text>
<text x="560.0" y="186.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">（大縫線核など）</text>
<rect x="470" y="320" width="180" height="50" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="560.0" y="336.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">青斑核</text>
<text x="560.0" y="353.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">（橋の背側）</text>
<path d="M560 110 L560 148" fill="none" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#m4)"/>
<path d="M560 206 L560 292 L326 292" fill="none" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#m4)"/>
<path d="M470 345 L322 302" fill="none" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#m4)"/>
<text x="520" y="278" text-anchor="end" dominant-baseline="central" font-size="16" fill="#A32D2D" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">－</text>
<text x="440" y="334" text-anchor="end" dominant-baseline="central" font-size="16" fill="#A32D2D" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">－</text>
<text x="470" y="440" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">オピオイド（β-エンドルフィン、</text>
<text x="470" y="457" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">エンケファリンなど）は、PAGの</text>
<text x="470" y="474" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">GABAニューロンを抑えて、</text>
<text x="470" y="491" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#2C2C2A">下行性の抑制を働かせる。</text>
<text x="30" y="524" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">Aβ線維が活動すると、</text>
<text x="30" y="542" text-anchor="start" dominant-baseline="central" font-size="13" fill="#2C2C2A">T細胞への入力が弱まり、痛みが和らぐ</text>
<text x="30" y="605" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">＋は興奮、－は抑制。熊本保健科学大学の総説と脳科学辞典の記述に基づく簡略図。</text>
</svg>
